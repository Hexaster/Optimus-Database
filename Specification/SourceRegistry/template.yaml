source_name:

# 此數據源服務於哪些數據庫
domain:

# 官方來源入口
source_url: 


# =========================
# 訪問與授權
# =========================

access:
  access_type:         # public / paid / restricted

  license: 

  # 公司項目特別需要確認
  commercial_use:      # true / false / unknown

  authentication:
    type:              # none / api_key / account / oauth
    credential_env:    # 如 OPENALEX_API_KEY


# =========================
# 數據獲取
# =========================

retrieval:
  routes:

    - route_id: 

      method: 
      # 例：
      # rest_api
      # bulk_download
      # web_download
      # ftp
      # s3

      endpoint: 

      formats: []

      # 若該 route 需要檢索條件，
      # Registry 只引用外部 query config
      query_config: 

      # 非 API source 可留空
      pagination:
        method: 
        page_size: 

      # 無明確限制可留空
      rate_limit:
        requests_per_second: 


# =========================
# 本項目的下載範圍
# =========================

scope:
  mode: 
  # 例：
  # full
  # target_filtered
  # query_filtered

  config_file: 


# =========================
# Source Record Identity
# =========================

identity:
  # 上游數據自身用來唯一識別記錄的字段
  source_record_keys: []


# =========================
# 版本策略
# =========================

versioning:
  mode: null
  # 例：
  # rolling
  # release
  # snapshot

  # 如果官方提供版本信息，
  # 記錄從哪裡獲取
  version_source: 


# =========================
# Parser / Mapping
# =========================

processing:
  parser: 

  mapping_file: 

  target_schema: 


# =========================
# 更新策略
# =========================

update:
  upstream_frequency: 

  project_check_frequency: 

  update_strategy: 
  # 例：
  # full_refresh
  # incremental
  # rerun_query


# =========================
# Source-specific Validation
# =========================

validation:
  required_source_fields: []