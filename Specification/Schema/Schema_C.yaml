manufacturing:
  table: manufacturing
  description: 制造工艺核心实体表。每个产品/工艺版本对应一条记录。
  fields:
    manufacturing_id:
      type: uuid
      key: primary
      description: 平台内部唯一制造工艺 ID。
      nullable: false
    name:
      type: string
      description: 制造工艺或工艺版本的名称/代号。
      nullable: true
    t_cell_source:
      type: string
      nullable: true
      description: T 细胞来源。
    cd4_cd8_ratio:
      type: string
      nullable: true
      description: 起始或目标 CD4:CD8 比例。
    starting_cell_quality:
      type: json
      nullable: true
      description: 起始细胞质量相关信息。
    activation_method:
      type: string
      nullable: true
      description: T 细胞激活方式。
    reagents:
      type: json
      nullable: true
      description: 制造过程中使用的关键试剂。
    vector_type:
      type: string
      nullable: true
      description: 用于基因导入的载体类型。
    moi:
      type: number
      nullable: true
      description: 感染复数（MOI）。
      unit: dimensionless
      check: moi >= 0
    transduction_transfection_conditions:
      type: json
      nullable: true
      description: 转导或转染条件。
    culture_system:
      type: string
      nullable: true
      description: 细胞培养体系。
    cytokine_combination:
      type: json
      nullable: true
      description: 培养过程中使用的细胞因子组合。
    culture_duration:
      type: string
      nullable: true
      description: 培养时长。
    cryopreservation_conditions:
      type: json
      nullable: true
      description: 冻存条件。
    formulation:
      type: json
      nullable: true
      description: 最终制剂相关信息。
    corresponding_car_product:
      type: string
      nullable: true
      description: 来源中报告的对应 CAR 构型或产品信息。
    version:
      type: string
      nullable: false
      description: 该制造工艺记录的版本。
      default: '1.0'
    entry_date:
      type: date
      nullable: false
      description: 该记录的录入日期。
      default: current_date
manufacturing_evidence:
  table: manufacturing_evidence
  description: 制造工艺证据表。保存特定来源或实验中该工艺得到的质量、表型与功能结果。
  fields:
    evidence_id:
      type: uuid
      key: primary
      description: 平台内部唯一制造工艺证据记录 ID。
      nullable: false
    manufacturing_id:
      type: uuid
      key: foreign
      references: manufacturing.manufacturing_id
      description: 该证据对应的制造工艺 ID。
      nullable: false
      index: true
    source_type:
      type: string
      nullable: false
      description: 证据来源类型。
      allowed_values:
      - public_database
      - literature
      - patent
      - internal_data
      index: true
    source_id:
      type: string
      nullable: false
      description: 外部来源 ID，例如 DOI、专利号、数据库登录号或内部批次号。
      index: true
    citation:
      type: string
      nullable: true
      description: 该证据对应的引用信息。
    evidence_level:
      type: string
      nullable: false
      description: 证据等级；具体分级值由统一证据分级规范定义。
    experimental_conditions:
      type: json
      nullable: true
      description: 产生该证据时的实验条件。
    applicable_scenario:
      type: string
      nullable: true
      description: 该证据或结果适用的场景。
    contrary_evidence:
      type: boolean
      nullable: false
      description: 该记录是否属于与主要结论相反的证据。
      default: false
    cell_viability:
      type: number
      nullable: true
      description: 细胞活率。
      unit: '%'
      check: 0 <= cell_viability <= 100
    transduction_efficiency:
      type: number
      nullable: true
      description: 转导效率。
      unit: '%'
      check: 0 <= transduction_efficiency <= 100
    vcn:
      type: number
      nullable: true
      description: 载体拷贝数（VCN）。
      unit: copies/cell
      check: vcn >= 0
    cd3_positive_ratio:
      type: number
      nullable: true
      description: CD3+ 细胞比例。
      unit: '%'
      check: 0 <= cd3_positive_ratio <= 100
    memory_phenotype:
      type: string
      nullable: true
      description: 产品细胞的记忆表型。
    exhaustion_phenotype:
      type: string
      nullable: true
      description: 产品细胞的耗竭表型。
    treg_phenotype:
      type: string
      nullable: true
      description: 产品细胞的 Treg 相关表型。
    sterility:
      type: string
      nullable: true
      description: 无菌检测结果。
    mycoplasma:
      type: string
      nullable: true
      description: 支原体检测结果。
    endotoxin:
      type: string
      nullable: true
      description: 内毒素检测结果。
    killing_activity:
      type: string
      nullable: true
      description: 杀伤活性结果。
    cytokine_release:
      type: json
      nullable: true
      description: 细胞因子释放结果。
relationships:
- from: binder_evidence.binder_id
  to: binder.binder_id
  cardinality: many-to-one
- from: car_evidence.car_id
  to: car.car_id
  cardinality: many-to-one
- from: manufacturing_evidence.manufacturing_id
  to: manufacturing.manufacturing_id
  cardinality: many-to-one
