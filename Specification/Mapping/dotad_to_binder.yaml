        Schema_A 沒有通用的 numeric developability observation 字段；若硬塞入
        experimental_conditions、antigen kd、cross_reactivity 或 aggregation_tendency
        會改變原始語義。需先擴充 target schema 並建立 assay/unit dictionary。


# =========================================================
# Source-specific validation for this mapping
# =========================================================

validation:
  - metadata.ID 必須非空且在 metadata.xlsx 內唯一。
  - metadata.INN 必須非空且在 metadata.xlsx 內唯一。
  - 每個 scope-selected metadata.ID 必須在 sequence.xlsx 恰好匹配一行。
  - sequence.INN 非空時必須等於同 ID 的 metadata.INN。
  - VH/VL 去除空白及 "-" placeholder 後，若非空，必須只含標準 20 種氨基酸單字母碼。
  - metadata.PDB 去除 tab/空白並按分號拆分後，每個非空值必須符合四字符 PDB ID 格式。
  - experimental 的 study sheet 必須能唯一匹配 link sheet 的 PMID；無法匹配時不得生成 literature evidence。
  - experimental.metric_value 寫入 tm 或 hydrophobicity 前必須可解析為 number。
  - 多靶點/多特異性記錄缺少 arm-to-target assignment 時必須觸發 multispecific_guard。


target_generated_fields:
  - binder.binder_id
  - binder.version
  - binder.entry_date
  - binder_evidence.evidence_id
  - binder_evidence.binder_id


blocking_issues:
  - item: binder_evidence.evidence_level
    reason: Schema_A 要求非空，但項目級統一 evidence grading standard 尚未提供。
    effect: evidence 可完成解析與 staging，但在 evidence_level 確定前不得寫入正式 target table。
  - item: multispecific arm-to-target assignment
    reason: DOTAD 原始檔沒有 arm 粒度的 target 與 sequence 關係。
    effect: 多靶點/多特異性記錄不得自動產生 Binder target_antigen 關係。


registry_discrepancies:
  - item: identity.source_record_keys
    registry_value: [antibody_id]
    observed: 實際下載檔的 source-native 欄名是 ID；metadata.ID 唯一，應改為 [ID]。
