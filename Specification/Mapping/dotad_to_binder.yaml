        - SGAC(Negated)
        - SMAC
        - PSR
        - ACSINS
        - CIC
        - CSI
        - ELISA
        - BVP
        - DNP
        - Fe.FVIII.2
        - Fe.C3.2
        - Fe.LysM.2
        - Heme.FVIII.2
        - Heme.C3.2
        - Heme.LysM.2
        - Heme.2
        - FA.2
        - FcRn.Rel.RT.3
        - Hep.RT.3
        - CL.ml.day.4
        - CL.mL.d.kg.7
        - Trans.MDCK.hFcRn.ng.mL.7
        - Trans.MDCK.ng.mL.7
        - MDCK.MFI.7
        - MDCK.hFcRn.MFI.7
