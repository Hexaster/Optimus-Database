# 模板1 · 数据源登记（通用，适用于任何数据源）
# 用途：登记「怎么拿数据 + 能为 A/B/C 三库填哪些字段」。字段清单必须取样验证真实存在。
# 说明：本模板对所有数据源通用——文献/专利/Binder结构库/制造工艺库/CAR库 均用同一份填。
source_name: YAbS                  # 数据源名称（The Antibody Society "Database for Therapeutic Antibodies"）
domain: binder_db                  # literature / patent / binder_db / manufacturing_db / car_db / other

# 官方來源入口
source_url: https://db.antibodysociety.org/

入口_API:
  endpoint: https://db.antibodysociety.org/db0/results   # 检索表单 POST 目标；无公开 REST API
  method: web_download              # rest_api / bulk_download / bigquery_sql / web_download / file_dump
  authentication: none              # none / api_key / service_account / login（检索页免登录，站点另有 Login 入口）
  credential_env:                   # 环境变量名（如需凭证）

文件格式: []                        # 未验证。检索结果为 HTML 表格（django_tables2），未确认有无 CSV 导出

版本或快照:
  mode: rolling                     # rolling / release / snapshot
  version_source: 未找到版本或快照日期标示
  snapshot_date:

更新频率:
  upstream: 未在站点上找到官方说明（旧登记写的 bimonthly 无出处，本轮已移除）
  project_check: 打通检索后再定

取样验证:                           # 证明字段清单真实存在
  verified: false                   # true / false
  verification_sample: |
    2026-08-20 实测，三次尝试均未取得记录：
      (1) POST /db0/results 无 cookie/referer → 403 CSRF verification failed
      (2) 带 csrfmiddlewaretoken + cookie + Referer → 500 Server Error
      (3) 同上再加 text_targets=CDH17 等文字条件 → 仍 500 Server Error
    已确认的站点结构（来自 GET /search，200，206,858 bytes）：
      - Django 应用，表单 <form action="/db0/results" method="post">
      - 文字类输入：d_inn, text_targets, text_indctns, text_indctns_apprv, text_comments, free_text
      - 复选框组：checked_cate_gen_mol, checked_cate_gen_fmt, checked_isotype_fc,
                  checked_mab_seq_source, checked_cate_rcrd, checked_cate_stage_advnc,
                  checked_prmry_thrptc, checked_cmpny_cntry, checked_upper
      - 区间类：date_cols / date_cols_st / date_cols_ed / text_year1_st / text_year1_ed
      - 前端载入 django_tables2_column_shifter（表格列可切换）
    推断 500 的原因：该表单要求提交完整的复选框集合，只提交文字条件时后端取不到必需参数。
    未继续暴力试参数——避免对公益站点造成无谓请求。
  verified_at: 2026-08-20

# 该源能为下列三库填的字段（从各库要求字段里挑；不列=填不了）
# 库字段总数：Binder 47 / CAR 25 / 制造工艺 33
可填字段_Binder: []                 # 未取到任何一条记录，不列字段
可填字段_CAR: []
可填字段_制造工艺: []

notes: >
  【本轮结论】YAbS 可达但未打通。旧登记里的
  formats: [csv]、source_record_keys: [Entry ID]、upstream_frequency: bimonthly
  三项均无取样依据，本轮已移除。

  【打通路径】表单参数名已经摸清（见 取样验证），差的是「必需参数的完整集合」。
  两条可选做法：
  (a) 人工在浏览器里做一次 CDH17 / GUCY2C 检索，用 DevTools 抓下完整的 POST body，
  照抄成固定模板即可脚本化——最省事，需要人操作一次；
  (b) 直接联系 The Antibody Society 询问有无批量导出或 API。
  建议走 (a)。

  【从表单参数能读出的覆盖面（推测，未验证，不得据此入库）】
  表单里有 d_inn（INN 名称）、text_targets（靶点）、checked_mab_seq_source（序列来源）、
  checked_cate_stage_advnc（研发阶段）、checked_cmpny_cntry（公司/国别），
  说明该库的维度与 Thera-SAbDab 高度重叠。
  若 (a) 打通后发现覆盖面确实与 Thera-SAbDab 重复且无序列，本源优先级应下调——
  A 库真正缺的是亲和力与工艺相关证据，不是又一份 INN 清单。

  【授权】站点未见 license 声明。本项目为非商用（2026-08-20 业务侧确认），
  学术用途一般无碍，但批量抓取前仍建议先问过站方，尤其因为这是学会运营的公益站点。
