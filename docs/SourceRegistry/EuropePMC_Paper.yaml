notes: >
  抽取主力（文献侧唯一能抽功能/工艺参数的源）。全文仅 OA 子集（有 PMCID）。
  两点口径：① binder 可能是单域 VHH(无 VH/VL 配对)，非都是 scFv；
  ② 效应细胞可能是 NK 系(CAR-NK)而非原代 CAR-T——工艺字段按对应细胞口径填。
  功能属性按设计归 DB1，不进 B 库。
