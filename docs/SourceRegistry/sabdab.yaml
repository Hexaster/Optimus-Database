# 模板1 · 数据源登记（通用，适用于任何数据源）
# 用途：登记「怎么拿数据 + 能为 A/B/C 三库填哪些字段」。字段清单必须取样验证真实存在。
# 说明：本模板对所有数据源通用——文献/专利/Binder结构库/制造工艺库/CAR库 均用同一份填。
source_name: SAbDab2               # 数据源名称
domain: binder_db                  # literature / patent / binder_db / manufacturing_db / car_db / other

# 官方來源入口
source_url: https://sabdab.opig.stats.ox.ac.uk/

入口_API:
  endpoint: https://sabdab.opig.stats.ox.ac.uk/api/   # 规格：/api/openapi.json；具体 route 见 notes
  method: rest_api                  # rest_api / bulk_download / bigquery_sql / web_download / file_dump
  authentication: none              # none / api_key / service_account / login
  credential_env:                   # 环境变量名（如需凭证）

文件格式: [csv, cif, json]          # json / xml / pdf / csv / fasta / bigquery_table ...

版本或快照:
  mode: rolling                     # rolling / release / snapshot
  version_source: GET /api/openapi.json 的 info.version（实测 2.0.10）；GET /api/stats/summary 的 last_update
  snapshot_date: 2026-08-06         # /api/stats/summary → last_update "Thu 06 Aug 2026 00:44:32"

更新频率:
  upstream: 跟随 RCSB PDB 增量重建；实测 last_update 与查询日相差 14 天，官方未承诺固定周期
  project_check: 每周

取样验证:                           # 证明字段清单真实存在
  verified: true                    # true / false
  verification_sample: |
    (1) GET https://sabdab.opig.stats.ox.ac.uk/api/stats/summary
        → {"antibody_instances":21914,"PDB_entries":11458,"SAbDab2_entries":6780,
           "with_antigen":19560,"last_update":"Thu 06 Aug 2026 00:44:32"}
    (2) summary CSV 实测 45 栏（表头见 data/raw/sabdab/20260824/gucy2c_summary.csv）：
        INSTANCE,PDB,SABDAB_ID,HEAVY_ID,LIGHT_ID,Hchain,Lchain,model,antigen_chain,antigen_type,
        antigen_name,short_header,date,SABDABdepo_date,SABDABupdate_date,compound,organism,...,
        method,resolution,r_free,r_factor,type,...,heavy_subclass,light_subclass,light_ctype
    (3) 靶点样本（GCC/GUCY2C）：PDB 8GHO / 8GHP，mmCIF 5 檔存于
        data/raw/sabdab/20260824/gucy2c_structures.tgz
  verified_at: 2026-08-20

# 该源能为下列三库填的字段（从各库要求字段里挑；不列=填不了）
# 库字段总数：Binder 47 / CAR 25 / 制造工艺 33
可填字段_Binder:
  # --- route: all_summary（45 栏 CSV）---
  - binder.target_antigen
  - binder.vdj_genes
  - binder.germline_origin
  - binder.structure_template
  - binder.complex_structure
  - binder_evidence.source_id
  - binder_evidence.citation
  - binder_evidence.experimental_conditions
  - binder_evidence.species_reactivity
  # --- route: structures（mmCIF）---
  - binder.vh_sequence
  - binder.vl_sequence
可填字段_CAR: []
可填字段_制造工艺: []

notes: >
  【route 说明】本源有两条 route，模板1 只有单一「入口_API」，故在此列全：
  (a) all_summary：GET /api/download/all-summary（另有 all-single-domain-summary 4,664 列、
  all-sd-h-summary 4,508 列，栏位结构与主 summary 完全相同）。该 endpoint 只接受 GET，
  HEAD 返回 405，无法用 HEAD 探测 Last-Modified。
  (b) structures：GET /api/download/all-structures、POST /api/download/search-structures（mmCIF）。
  vh_sequence / vl_sequence 只能走这条 route，summary 内不含任何氨基酸序列。
  其余 endpoint：POST /api/sequence-similarity-search（支援 CDRH1/H2/H3、CDRL1/L2/L3、Framework 区域检索）、
  POST /api/sequence-nonredundant-search、GET /api/rcsb-pdb-annotations、GET /api/stats/summary。

  【重要负面结论，勿误用】当前 SAbDab2 summary（v2.0.10，45 栏）不含 affinity / delta_g /
  affinity_method / temperature / pmid / scfv / engineered 这些旧版 SAbDab 栏位。
  => binder_evidence 的 kd / kon / koff / measurement_method / measurement_conditions
  无法由本源获得，须另找文献、专利或 DOTAD / TABS。
  同理 epitope / binding_site 不能用 antigen_chain / antigen_name 顶替——那只说明「结合了哪条抗原链」，
  需从结构档计算接触残基后 derived。

  【授权】/api/openapi.json 的 info.license 明示 CC BY 4.0，商用可行，需署名。

  【待决】binder.name：summary 不提供抗体名称（compound 是结构标题，SABDAB_ID 是内部 ID），
  暂留 null 等 Thera-SAbDab / 文献源回填。

  详细逐栏映射见 Specification/Mapping/sabdab_to_binder.yaml。

  【2026-08-24 实测：本项目两个靶点在本库的覆盖情况】
  下载全量 all-summary（21,914 行）后逐行核对：
    GUCY2C —— 3 条 instance，2 个 PDB（8GHO / 8GHP），同属 1 个抗体
               SABDAB_ID=sabdab2_H03VYL030Q，compound 写明
               "GUCY2C-peptide bound to anti-GUCY2C-scFv antibody"。是 scFv，可直接用作 A。
    CDH17  —— 0 条。全库 15 条 cadherin 相关记录经逐条查看，
               分别是 Cadherin-1 / Cadherin-3 / Cadherin-6 与一条 "Cadherin derived peptide"，
               没有任何一条是 Cadherin-17。这是空集，不是检索式写错。
  => A 库在 CDH17 侧拿不到任何实验结构，binder.complex_structure /
     structure_template 对 CDH17 只能留 null，或改由 AlphaFold-Multimer 预测（属模型预测级证据）。

  【检索接口的坑，直接影响 registry 里 queries 怎么写】
  POST /api/download/search-summary 的 binds_to_antigen 匹配的是 antigen_name 栏的文本，
  不是基因符号。实测：
    "guanylyl cyclase" → 3 行      "GUCY2C"      → 0 行
    "cadherin-17"      → 0 行      "CDH17"       → 0 行      "LI-cadherin" → 0 行
  所以必须写抗原全名并把别名都列上；用基因符号检索会得到「假空集」。
  另注：该栏 maxLength 25，一次只能传一个字符串，多别名要拆成多条 query。

  【零命中返回 404，不是空 CSV】search-summary 与 search-structures 在无结果时
  回 HTTP 404，与「路径不存在」共用状态码，只能靠响应体区分：
    零命中  {"detail":"No antibody instances matched the requested filters."}
    路径错  {"detail":"Not Found"}
  downloader 按这段文本判别；若 OPIG 日后改了这句话，CDH17 那三条 query 会从
  「记为 no_hits」变成「抛错中断」——是显性失败，不会静默丢数据。

# ---------------------------------------------------------------------------
# 可执行下载配置 —— src/cart_db/downloaders 读的就是这一块。
# 上面的散文是给人看的；代码只认这里的键。
# ---------------------------------------------------------------------------
下载配置:
  downloader: sabdab
  source_dir: sabdab
  http:
    rate_limit_rps: 2        # OPIG 未公布限速，自行克制
    timeout_s: 60
    read_timeout_s: 600

  routes:
    # 全量索引。不按靶点过滤——它本身就是「某靶点在不在库里」的判据，
    # 不先有它就无法区分「空集」与「检索式写错」。11.7 MB，代价可忽略。
    # 注意：summary 不含任何氨基酸序列，序列必须走 target_structures 的 mmCIF。
    - route_id: all_summary
      endpoint: https://sabdab.opig.stats.ox.ac.uk/api/download/all-summary
      output:
        summary: all_summary.csv

    # 按本项目靶点取结构档。结构档体积大，只对 GCC/CDH17 下载。
    #
    # 三个布尔参数各自决定打包里出现什么档，2026-08-24 实测：
    #   full_structure=true（默认）        → pdb_XXXX_sabdab.cif，整个 PDB 条目
    #   antibody_instance_crops=true       → pdb_XXXX_<H>_<L>_abag.cif，逐 instance 的
    #                                        抗体+抗原裁切档。算表位接触残基要的是这个。
    #   include_antigen=true               → 让上面两者带上抗原链
    # 只开 include_antigen 不开 crops，拿到的仍然只有整份结构（实测 2 档而非 5 档）。
    # binder.epitope 无法由 antigen_name 顶替（见 notes），所以 crops 必须开。
    - route_id: target_structures
      search_summary_endpoint: https://sabdab.opig.stats.ox.ac.uk/api/download/search-summary
      search_structures_endpoint: https://sabdab.opig.stats.ox.ac.uk/api/download/search-structures
      queries:
        - label: gucy2c
          body:
            binds_to_antigen: "guanylyl cyclase"   # 实测 3 行；写 "GUCY2C" 会得 0
            include_antigen: true
            antibody_instance_crops: true
        # 下面三条 2026-08-24 实测均为 0 行，仍保留：
        # 空集本身是要留档的结论，且上游 rolling，日后可能出现新结构。
        # downloader 会把 0 行记成 skip(no_hits) 而不是报错。
        - label: cdh17_cadherin17
          body:
            binds_to_antigen: "Cadherin-17"
            include_antigen: true
            antibody_instance_crops: true
        - label: cdh17_licadherin
          body:
            binds_to_antigen: "LI-cadherin"
            include_antigen: true
            antibody_instance_crops: true
        - label: cdh17_hpt1
          body:
            binds_to_antigen: "HPT-1"              # Q12864 的 AltName，见 NCBI GenPept
            include_antigen: true
            antibody_instance_crops: true
