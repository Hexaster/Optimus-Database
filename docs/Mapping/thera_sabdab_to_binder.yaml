# =========================
# Mapping: Thera-SAbDab -> binder.binder + binder.binder_evidence
# =========================
# 只回答一件事：Thera-SAbDab 的字段如何变成数据库字段。
# 不描述如何获取数据（见 docs/SourceRegistry/thera_sabdab.yaml），
# 不描述目标库结构、类型、约束（见 sql/03_binder.sql）。

mapping_id: thera_sabdab_to_binder
source_name: Thera-SAbDab
route_id: seqstruc_download
target_schema: sql/03_binder.sql → binder.binder + binder.binder_evidence
source_format: csv_row
record_grain: 一个 WHO INN 治疗性抗体（单特异一条 = 一个 binder；双特异一条 = 两个 binder）

status: draft
last_verified: 2026-08-20


# =========================================================
# Part 0 — 输入档案
# =========================================================
source_dataset:
  file: data/raw/therasabdab/20260824/TheraSAbDab_SeqStruc_OnlineDownload.csv
  encoding: utf-8-sig            # 档首有 BOM，必须用 utf-8-sig 读，否则首栏名会带乱码
  observed_rows: 1133
  observed_cols: 24
  record_key: [Therapeutic]
  snapshot: 2025-03-18           # Last-Modified；本源已停更，见 Part 5 R1
  target_subset:
    file: data/raw/therasabdab/therasabdab_GCC_CDH17_subset.csv
    rows: 本项目靶点命中 —— Cabotamig(CDH17;CD3E, Active)、Indusatumab(GUCY2C, Discontinued)


# =========================================================
# Part 1 — Source 字段清单（24 栏）
# =========================================================
# fill 为 2026-08-20 实测非空率（'na' 计为空）。

source_field_inventory:

  - source: Therapeutic
    fill: 100.0%
    uniq: 1133
    example: Abagovomab
    target: binder.binder.name
    note: INN 名称；同时作 source_id 与 entity_key
  - source: Format
    fill: 100.0%
    uniq: 104
    example: Whole mAb
    target: null
    method: not_mapped
    note: |
      实测分布：Whole mAb 800、Whole mAb ADC 58、Bispecific mAb 50、
      Bispecific Mixed mAb and scFv 21、Whole mAb Fusion 19、Fab 11、Fusion Protein 11、
      Bispecific scFv 9、scFv 7 ……
      => 纯 scFv 只有 7 条。CAR-T 用的 A 必须是 scFv/VHH，
      其余 Whole mAb 需先判断能否 scFv 化，不能直接当 binder 用。最新 schema 不存储 format。
  - source: CH1 Isotype
    fill: 97.6%
    example: G1
    target: null
    note: 恒定区亚型，本库无对应列
  - source: VD LC
    fill: 98.8%
    example: Kappa
    target: null
    note: 轻链型别 κ/λ，本库无对应列
  - source: "Highest_Clin_Trial (Feb '25)"
    fill: 100.0%
    uniq: 14
    example: Phase-III
    target: binder.binder_evidence.applicable_scenario
    method: derived
    note: 栏名自带截止日 Feb '25。注意栏名含空格与撇号，读取时勿改写
  - source: Est. Status
    fill: 100.0%
    uniq: 6
    example: Discontinued
    target: binder.binder_evidence.applicable_scenario
    method: derived
  - source: HeavySequence
    fill: 99.8%
    uniq: 1047
    example: QVKLQESGAELARPGASVKLSCKASGYTFTNYWMQ...
    target: binder.binder.vh_sequence
  - source: LightSequence
    fill: 97.6%
    uniq: 993
    target: binder.binder.vl_sequence
  - source: HeavySequence(ifbispec)
    fill: 13.9%
    target: binder.binder.vh_sequence
    note: 双特异的第二组重链。非空时该行展开成第二个 binder 实体，见 Part 3 (2)
  - source: LightSequence(ifbispec)
    fill: 12.3%
    target: binder.binder.vl_sequence
    note: 同上
  - source: 100% SI Structure
    fill: 32.5%
    example: 7vux:HL
    target: binder.binder.structure_template
    method: derived
    rule: 格式为 "{pdb}:{chains}"；取 100% 序列一致的优先
  - source: [99% SI Structure, 95-98% SI Structure]
    fill: 20.6% / 19.7%
    target: binder.binder.structure_template
    method: derived
    note: |
      【填充率虚高告警】实测这两栏的值常为字串 "None;None" 而非空，
      朴素的非空判断会把它们算作有值。必须先把 "None" 当缺失处理。
      仅在 100% SI Structure 为空时才回退到 99%，再回退到 95-98%，
      并把实际相似度档位写进 experimental_conditions。
  - source: [Year Proposed, Year Recommended]
    fill: 100.0% / 88.4%
    example: '2006'
    target: binder.binder_evidence.citation
    method: derived
    note: WHO INN 提出年 / 推荐年，用于组装 citation
  - source: Target
    fill: 100.0%
    uniq: 523
    example: MUC16/CA125
    target: binder.binder.target_antigen
    method: derived
    rule_ref: normalize_antigen_name
    note: |
      分隔符有两种语义，必须区分：
        "/" —— 同一靶点的别名，如 MUC16/CA125，归一化成一个靶点
        ";" —— 真正的多靶点，如 CDH17;CD3E（双特异），拆成两条 binder
      本项目靶点即命中这两种：Indusatumab=GUCY2C（单）、Cabotamig=CDH17;CD3E（双）
  - source: Companies
    fill: 99.7%
    target: null
    note: 开发公司。本库无对应列；对 patent_status 有参考价值但不足以直接填
  - source: Conditions Approved
    fill: 25.2%
    target: binder.binder_evidence.applicable_scenario
    method: derived
  - source: [Conditions Active, Conditions Discontinued]
    fill: 66.8% / 54.0%
    target: binder.binder_evidence.applicable_scenario
    method: derived
    rule: 三个 Conditions 栏合并，各自标注状态；";" 分隔多个适应症
  - source: Development Tech
    fill: 17.2%
    uniq: 43
    example: 'BiTE Technology.'
    target: null
    note: |
      【本轮更正】docs/SourceRegistry/thera_sabdab.yaml 初版曾把此栏映射到 germline_origin，那是错的。
      本栏内容是平台技术名（BiTE Technology 等），不是人源化程度，且只有 17.2% 非空。
      人源化信息在 Genetics 栏，见下。
  - source: Genetics (Bispecifics delimited with semicolon)
    fill: 97.0%
    uniq: 31
    example: Murine
    target: binder.binder.germline_origin
    method: derived
    note: |
      这才是人源化/来源信息所在栏（Murine / Humanized / Human / Chimeric 等）。
      双特异的两组值以 ";" 分隔，拆分后分别给两个 binder 实体。
      仍不直接填 humanization —— 该列语义是「人源化程度」，需业务侧定义分级后再填。
  - source: Notes
    fill: 38.1%
    example: 'Sequence sourced through DrugBank. Biosimilars...'
    target: binder.binder_evidence.experimental_conditions
    method: derived
    note: |
      含序列出处说明（如 "Sequence sourced through DrugBank"）。
      对证据可追溯性有用：若 Notes 指出序列来自第三方而非原始发表，
      应在 citation 中如实标注，不得伪装成 Thera-SAbDab 自有数据。
  - source: Alternative Therapeutic Names
    fill: 99.7%
    uniq: 1032
    example: ACA 125;ACA125;ACA-125
    target: null
    note: |
      不直接入库，但必须交给实体归一化用——
      这是把本源与 DOTAD / SAbDab2 / 文献源对齐的最有效别名表。


# =========================================================
# Part 2 — binder.binder 中本源填不了的字段
# =========================================================
unmapped_target_columns:
  not_available:
    - scfv_sequence          # 有 VH/VL，无 scFv 构建体
    - linker            # 即便 Format 写 scFv 也没给 linker 序列
    - numbering_scheme
    - fr_cdr_regions
    - cdr_lengths
    - vdj_genes
    - somatic_mutations
    - epitope
    - binding_site
    - glycosylation_sites
    - free_cysteines
    - humanization_level      # Genetics 只给来源类别，分级定义未定，见 Part 1
    - kd             # 本源无任何定量测量值
    - kon
    - koff
    - measurement_method
    - measurement_conditions
    - tm
    - viscosity
    - aggregation_tendency
    - solubility
    - hydrophobicity
    - charge
    - immunogenicity_ada_risk
    - cross_reactivity_protein
    - cross_reactivity_cell
    - species_reactivity
    - complex_structure # 只有 "{pdb}:{chains}"，无抗原链信息
  platform_managed:
    - version
    - entry_date


# =========================================================
# Part 3 — 可执行映射
# =========================================================

targets:

  # 单特异：同一源行产生一条实体和一条证据。
  - table: binder.binder
    record_per_source: one
    condition: HeavySequence(ifbispec) 为空
    entity_key: [Therapeutic]
    fields:
      - {target: binder_id, method: platform}
      - {target: name, source: Therapeutic, method: direct}
      - {target: vh_sequence, source: HeavySequence, method: direct}
      - {target: vl_sequence, source: LightSequence, method: direct}
      - {target: target_antigen, source: Target, method: derived, rule_ref: normalize_antigen_name}
      - {target: germline_origin, source: "Genetics (Bispecifics delimited with semicolon)", method: direct}
      - target: structure_template
        source: [100% SI Structure, 99% SI Structure, 95-98% SI Structure]
        method: derived
        rule_ref: pick_best_structure

  - table: binder.binder_evidence
    record_per_source: one
    condition: HeavySequence(ifbispec) 为空
    entity_key: [Therapeutic]
    fields:
      - {target: evidence_id, method: platform}
      - {target: binder_id, method: parent, references: binder.binder_id}
      - {target: source_type, method: constant, value: public_database}
      - {target: source_id, source: Therapeutic, method: direct, required: true}
      - {target: evidence_level, method: constant, value: 同行评议}
      - target: applicable_scenario
        source: ["Highest_Clin_Trial (Feb '25)", Est. Status,
                 Conditions Approved, Conditions Active, Conditions Discontinued]
        method: derived
        rule: '合并临床阶段、状态与适应症，并标注截止 2025-02'
      - target: citation
        source: [Therapeutic, Year Proposed, Year Recommended, Notes]
        method: derived
      - target: experimental_conditions
        source: [Notes, 实际采用的 SI 档位]
        method: derived
      - {target: contrary_evidence, method: constant, value: false}

  # 双特异：每个 arm 分别产生实体与证据，两表共用 entity_key。
  - table: binder.binder
    record_per_source: many
    condition: HeavySequence(ifbispec) 非空
    iterate_over: 两组序列 —— (HeavySequence, LightSequence) 与 (HeavySequence(ifbispec), LightSequence(ifbispec))
    entity_key: [Therapeutic, arm_index]
    fields:
      - {target: binder_id, method: platform}
      - {target: name, source: [Therapeutic, arm_index], method: derived}
      - {target: vh_sequence, source: [HeavySequence, HeavySequence(ifbispec)], method: derived}
      - {target: vl_sequence, source: [LightSequence, LightSequence(ifbispec)], method: derived}
      - target: target_antigen
        source: Target
        method: derived
        rule: '按 ";" 拆分 Target，第 n 段配第 n 组序列；段数不一致则 extraction_failed'
      - {target: germline_origin, source: "Genetics (Bispecifics delimited with semicolon)", method: derived}
      - {target: structure_template, source: [100% SI Structure, 99% SI Structure, 95-98% SI Structure], method: derived, rule_ref: pick_best_structure}

  - table: binder.binder_evidence
    record_per_source: many
    condition: HeavySequence(ifbispec) 非空
    iterate_over: 两个 binder arm
    entity_key: [Therapeutic, arm_index]
    fields:
      - {target: evidence_id, method: platform}
      - {target: binder_id, method: parent, references: binder.binder_id}
      - {target: source_type, method: constant, value: public_database}
      - {target: source_id, source: [Therapeutic, arm_index], method: derived, required: true}
      - {target: evidence_level, method: constant, value: 同行评议}
      - {target: applicable_scenario, source: ["Highest_Clin_Trial (Feb '25)", Est. Status, Conditions Approved, Conditions Active, Conditions Discontinued], method: derived}
      - {target: citation, source: [Therapeutic, Year Proposed, Year Recommended, Notes], method: derived}
      - {target: experimental_conditions, source: [Notes, 实际采用的 SI 档位], method: derived}
      - {target: contrary_evidence, method: constant, value: false}


# =========================================================
# Part 4 — 派生规则标识
# =========================================================
rule_refs:
  normalize_antigen_name:
    description: 靶点名归一化
    rule: '"/" 视为别名合并；";" 视为多靶点拆分'
  pick_best_structure:
    description: 三个 SI Structure 栏按相似度优先级回退取值
    rule: 100% → 99% → 95-98%；字串 "None" 与 "None;None" 一律当缺失
    note: 采用的档位必须写进 experimental_conditions，否则下游无法判断结构可信度


# =========================================================
# Part 5 — 已知风险
# =========================================================
risks:
  - id: R1
    desc: |
      本源已停更。档案 Last-Modified 为 2025-03-18，栏名写死 "Highest_Clin_Trial (Feb '25)"。
      development_stage 与 Est. Status 已过时约 18 个月，不得当作当前状态使用，
      须以 ClinicalTrials.gov 或文献复核。
      建议在 experimental_conditions 中一律注明 "(as of 2025-02)"。
  - id: R2
    desc: |
      1,133 条里纯 scFv 只有 7 条、Bispecific scFv 9 条。
      本源对 A 库的价值主要是「提供 VH/VL 序列 + INN 名称 + 靶点」，
      而不是「提供可直接用的 scFv 构建体」。
      Whole mAb（800 条）需另行 scFv 化，linker 本源也没给。
  - id: R3
    desc: |
      双特异展开依赖 Target 的 ";" 段数与序列组数一一对应。
      实测 HeavySequence(ifbispec) 13.9% 非空、LightSequence(ifbispec) 12.3% 非空，
      两者不等 —— 说明存在「有重链无轻链」的第二臂（可能是 VHH 臂）。
      硬按顺序配对会错配靶点。必须先校验，不一致则判 extraction_failed。
  - id: R4
    desc: |
      99% / 95-98% SI Structure 两栏含字串 "None;None"，
      朴素非空判断会把填充率虚高到 20% 左右。
      pick_best_structure 必须显式处理该字串。
