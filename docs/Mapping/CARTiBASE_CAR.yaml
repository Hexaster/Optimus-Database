source_name: CARTiBASE
domain: car_db                 # 从专利/文献抽取的 CAR 序列库（B 池，全靶点）
入口_API:
  endpoint: https://cartibase.org           # 站内 Download/Export 导出 CSV
  条目route: https://cartibase.org/entry/{来源号_序号}   # 例 /entry/EP20170776591_1209（仅浏览器可见，headless 空壳）
  method: web_download                       # 无稳定 API：/api=404，SPA(Vue)动态加载
  authentication: none                       # 浏览/导出免注册
  credential_env: null
文件格式: [html]            # 直接访问：SPA(Vue) HTML 空壳，无记录体(不可直接抽)
抽取:
  可用格式: [fasta, csv]    # fasta=单条目序列(已实测到手)；csv=站内批量导出
  获取步骤: 浏览器打开 → 单条目可下 FASTA(已实测)；批量走站内 Download/Export 导出 CSV(headless 取不到：/api=404)
  额外成本: 无 API，需人工导出；且商用许可"严格禁止"→ 落地前须先解决授权
版本或快照: {mode: snapshot, version_source: 导出日期即快照标识, snapshot_date: null}
更新频率: {upstream: unknown, project_check: quarterly}
取样验证:
  verified: true                             # 序列已实测；记录体(靶点等结构字段)仍未取
  verification_sample: 'entry EP20170776591_1209（键=来源专利号_序号）：FASTA 已到手，969 aa 多顺反子 ORF，实测可无缝拆为 CAR(1-517: CD8α信号肽|VL|(G4S)×3|VH|myc|CD8α铰链|CD8α跨膜|4-1BB|CD3ζ) — P2A — 未鉴定ORF2 — T2A — PuroR；但条目页记录体仍取不到(/api=404，HTML 仅空壳3066B)，故靶抗原等字段仍空'
  verified_at: 2026-08-21
# 条目 = 从专利/文献抽的 CAR 序列 → 主要填 B(CAR)；scFv 内含 → Binder 部分◐；无工艺
# ---------------------------------------------------------------
# 可填性词表（三个 可填字段_* 小节通用）
#   直给   = 源页面/档案直接给出该值，无需加工
#   派生   = 由源字段按规则推出（rule 写明）
#   需另取 = 需再发一次请求/换一种档案才有（登录、PDF、补充材料）
#   需计算 = 需跑工具才有（ANARCI 编号、序列比对、坐标切分）
#   ◐条件 = 只有部分条目/部分论文有
#   不适用 = 该字段对本源的记录类型语义上不成立（≠缺失）
#   无     = 本源任何路径都给不出
#   平台   = 由库自身管理（uid/entry_date/source_weight 等）
# ---------------------------------------------------------------

可填字段_Binder:
  规范条目: 47
  本源可填: 15
  本源不可填: 39
  前提: ★以"单条目 FASTA 已到手"为准（实测 EP20170776591_1209）；记录体(靶点等)仍受 SPA 阻断
  字段:
    名称代号:
      列: name_code
      可填性: 派生（退化）
      rule: 条目无克隆名 → 退化用条目键（如 EP20170776591_1209）充当代号
      置信度: 低
      备注: ★这是占位而非真名；跨源归并须靠序列而非名称
    来源类型: {列: source_type, 可填性: 派生, rule: 恒为 公开库（条目本体来自 CARTiBASE 库）}
    来源ID:
      列: source_id
      可填性: 派生
      rule: 取条目键前半段 = 来源专利号（规范所称"专利号"）
      置信度: 高
    实验条件: {列: experiment_conditions, 可填性: 不适用, 备注: 纯序列条目，无实验}
    证据等级:
      列: evidence_level
      可填性: 派生
      rule: 上游证据是专利 → 专利预印本（weight 0.4）
      备注: ★不得因经数据库转录而升级为 同行评议
    版本:
      列: version
      可填性: 派生
      rule: snapshot 模式——导出日期即快照标识
      备注: 须在取数时主动记录，FASTA 档本身不含日期
    录入日期: {列: entry_date, 可填性: 平台}
    引用:
      列: citation
      可填性: 派生
      rule: '"CARTiBASE entry {键} (source patent {专利号}, {FASTA 标题})"，可再加模块坐标区间'
    适用场景: {列: applicable_scenario, 可填性: 派生, rule: 由拆出的模块构成推出（如"二代 CAR 规范模块序列基准"）}
    相反证据: {列: contrary_evidence, 可填性: 无}
    VH序列:
      列: vh_seq
      可填性: 需计算
      来源位置: FASTA 全序列
      rule: 规范模块比对定位 VH 区段后切出（实测 160-279，120 aa）
      成本: 无额外请求，纯本地计算
      置信度: 高（比对无缝覆盖时）
      备注: ★本源相对文献源的最大优势——序列在手，VH/VL 可直接切出
    VL序列: {列: vl_seq, 可填性: 需计算, 备注: 实测 41-144，104 aa；★注意本条 scFv 朝向为 VL→VH}
    scFv全序列: {列: scfv_seq, 可填性: 需计算, 备注: 含内部 linker 的连续区段（实测 41-279）}
    linker: {列: linker, 可填性: 直给（比对即得）, 备注: 实测 (G4S)×3 = GGGGSGGGGSGGGGS，145-159}
    格式:
      列: format
      可填性: 派生
      rule: 由序列结构判定（有 VL-linker-VH → scFv；单域 → VHH）
      置信度: 高
      备注: ★比文献源的"文本推断格式"可靠——这是序列证实
    编号体系: {列: numbering, 可填性: 需计算, 备注: 由我方 pipeline 决定，不由来源决定}
    'FR/CDR 区':
      列: '[cdr_h1, cdr_h2, cdr_h3, cdr_l1, cdr_l2, cdr_l3] —— ★FR 无列'
      可填性: 需计算
      前置: VH/VL 已可切出 → 跑 ANARCI 即得
      备注: ★本源这一组是"可执行的下一步"而非死缺口
    CDR长度: {列: cdr_lengths, 可填性: 需计算}
    'V(D)J基因': {列: vdj_genes, 可填性: 需计算}
    胚系来源:
      列: germline
      可填性: 需计算
      置信度: 低
      备注: ★可由框架序列推测（本条疑鼠源），但未跑比对前不得写入；宁可留空
    体细胞突变: {列: somatic_mutations, 可填性: 需计算}
    专利状态:
      列: patent_status
      可填性: 需另取
      rule: 以 source_id 的专利号去 EPO / Google Patents 查 legal_status
      成本: 需查外部源
  不可填:
    - 列: [target_antigen]
      原因: ★序列不含靶点信息，FASTA 标题只有专利名。须回读来源专利或取 CARTiBASE 靶点列。
             这是本源最关键的缺口——无靶点则无法参与任何按靶点的筛选
    - 列: [epitope_position, epitope_kind, binding_site]
      原因: 纯序列，无表位定位
    - 列: [kd_nm, kon_m1s1, koff_s1, measure_method, measure_condition,
           cross_reactivity, species_reactivity]
      原因: 序列库不含亲和力与特异性数据
    - 列: [tm_celsius, viscosity, aggregation, solubility, hydrophobicity, net_charge,
           glycosylation_sites, free_cysteine, humanization, immunogenicity_risk]
      原因: 无成药性表征
    - 列: [structure_template, complex_structure, prediction_confidence]
      原因: 无结构数据
    - 列: [development_stage, in_vitro_readout]
      原因: 无开发阶段标注、无功能读出

可填字段_CAR:
  规范条目: 25
  本源可填: 17
  本源不可填: 12
  备注: ★六个源里 B 库模块级填得最实的一个——序列在手，坐标与长度全部实算
  字段:
    元数据11:
      列: [uid, name_code, source_type, source_id, experiment_conditions,
           evidence_level, version, entry_date, citation, applicable_scenario, contrary_evidence]
      可填性: 同 可填字段_Binder 的对应栏
      备注: citation 可精确到模块坐标区间，可回溯性强于文献源
    模块类型:
      列: module_type
      可填性: 需计算
      rule: 对全序列做规范模块比对，输出首尾相接的模块坐标表
      验收: ★要求无缝覆盖率 100% 方可采信（实测本条 969/969）
      置信度: 高（匹配段）/ 低（未匹配段须标 null，禁止猜测）
    来源分子: {列: source_molecule, 可填性: 需计算, rule: 由比对命中的规范序列判定（CD8α / 4-1BB / CD3ζ 等）}
    序列:
      列: sequence
      可填性: 直给（切分即得）
      备注: ★本源唯一能直接给出各模块序列的库——文献源只给模块名
    长度: {列: length_aa, 可填性: 需计算, rule: 模块坐标区间长度，实算}
    装配规则:
      列: assembly_rules
      可填性: 直给（带坐标）
      备注: ★可回溯性最强的一栏——模块顺序附精确 aa 坐标；属 car.module 列非 car.construct
    可兼容模块:
      列: compatible_modules
      可填性: 无（单条）→ ◐条件（批量后可推）
      rule: 待批量 CSV 到手，由"哪些模块组合反复共现"反推兼容性
      备注: ★这是本源规模优势（>10,000 条）的兑现路径，但受许可阻断
    不可兼容模块: {列: incompatible_modules, 可填性: 无}
  不可填:
    - 列: [activation_speed, metabolic_state, expansion_capacity, memory_phenotype,
           persistence, exhaustion_risk, tonic_signaling]
      原因: ★纯序列库无功能读出。注意 4-1BB 的"低耗竭/高持久"虽是常识，
             但本表只存本源给出的值，常识性属性须另有可引证来源，不得据常识填入
    - 列: [epitope_distance_effect, synapse_effect, tonic_effect]
      原因: 几何效应需构型对照实验，单条序列给不出
    - 列: 几何长度
      原因: ★残基数已实算（如 CD8α 铰链 48 aa），但物理跨度需结构换算且 schema 无列
             ——本源是"有能力算却无处存"的典型

可填字段_制造工艺:
  规范条目: 36
  本源可填: 0
  本源不可填: 36
  建行建议: ★不建行——22 个业务列全空
  元数据11:
    列: [uid, name_code, source_type, source_id, experiment_conditions,
         evidence_level, version, entry_date, citation, applicable_scenario, contrary_evidence]
    可填性: 技术上可填（同 可填字段_Binder 的对应栏）
    备注: ★但业务列全空时，元数据齐全并无意义——故本源不建 process 行，这 11 栏一并不产出
  唯一线索:
    note: 序列内含 PuroR（嘌呤霉素抗性）说明上游构建用嘌呤霉素筛选，
          但那属"来源专利的构建方式"，非本项目工艺记录，不入 C 库
  不可填:
    - 列: [t_cell_source, cd4_cd8_ratio, starting_quality, activation_method,
           activation_reagents, vector, moi, transduction_condition, culture_system,
           cytokines, culture_days, cryo_condition, formulation]
      原因: 纯序列条目，无任何制备信息
    - 列: [viability_pct, transduction_efficiency_pct, vcn, cd3_positive_pct, phenotype,
           sterility, mycoplasma, endotoxin, cytotoxicity, cytokine_release]
      原因: 无放行与功能指标
    - 列: [car_construct_uid, product_name]
      原因: car_construct_uid 技术上可指向本条 construct，但无工艺内容可载，故不建行

notes: >
  React/Vue SPA，无公开 bulk API，仅网页手动导出 CSV，字段需导出后按真实列名回填。
  规模 >10,000 条 CAR。⚠许可(P0)：ToS 明示仅学术非商用，"与工业/商业伙伴合作的研究严格禁止"
  → 复星×明度(商业合作)按字面连研究性使用都被禁，取得书面授权前不得入生产库。
  替代路径：直接用来源专利(如 EP20170776591)重取同一序列，专利文本无此限制。
