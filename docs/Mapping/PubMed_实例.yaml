# =========================
# Instance: PubMed PMID 40487639 -> A / B / C
# =========================
# 只回答一件事：这一条题录+摘要抽出来的值，如何变成数据库字段。
# 不描述如何获取数据（见 1_数据源登记/PubMed.yaml），
# 不描述目标库结构、类型、约束（见 sql/03_binder.sql、04_car.sql、05_process.sql）。
#
# 本条的教学目的：演示「摘要级源的天花板」——
# 与 EuropePMC_实例.yaml 是同一篇文章（PMID 40487639 = PMC12144966），
# 但那边走 OA 全文、A/B/C 三库填满，这边只有题录+摘要、几乎全空。
# ★两档并读即可量化"全文 vs 摘要"的产出差距，这是 PubMed 定位为补充/发现源的依据。

instance_id: pubmed_40487639_to_abc
source_name: PubMed
route_id: [efetch_abstract]
target_schema:
  - sql/03_binder.sql  → binder.binder + binder.binder_evidence
  - sql/04_car.sql     → car.car + car.car_evidence
  - sql/05_process.sql → manufacturing.manufacturing + manufacturing.manufacturing_evidence
source_format: pubmed_xml（题录 + 摘要）
record_grain: 一条 PubMed 题录（PMID 40487639）

status: verified
last_verified: 2026-08-19

example:
  id: PMID 40487639
  title: CDH17-targeting CAR-NK cells synergize with CD47 blockade for potent suppression of gastrointestinal cancers
  url: https://pubmed.ncbi.nlm.nih.gov/40487639/
  format: xml（题录 + 摘要）

attached_files:
  - file: PubMed_40487639.xml
    note: efetch 题录 + 摘要 XML；Part 1 全部取证出自此档

sibling_record:
  note: ★同一篇文章的全文抽取见 EuropePMC_实例.yaml（PMC12144966）
  relation: PMID 40487639 → PMCID PMC12144966（本 XML 的 ArticleId 直接给出）
  implication: 本条不应与 EuropePMC 条重复建实体；应归并为同一来源，见 R1


# =========================================================
# Part 1 — XML 字段清单（本源能给什么）
# =========================================================
source_field_inventory:

  # ---- 识别类 ----
  - source: PMID
    example: '40487639'
    target: binder.binder_evidence.source_id
    note: 本源唯一稳定主键
  - source: 'ArticleId[IdType=doi]'
    example: 10.1016/j.apsb.2025.03.039
    target: binder.binder_evidence.source_id
    note: ★优先用 DOI 作 source_id，PMID 作辅助键——跨源归并时 DOI 覆盖面更广
  - source: 'ArticleId[IdType=pmc]'
    example: PMC12144966
    target: null
    method: routing_key
    note: ★不入库，作全文路由钥匙：有 PMCID 即可转 PMC 取 OA 全文（=EuropePMC 路由）

  # ---- 书目 ----
  - source: ArticleTitle
    example: CDH17-targeting CAR-NK cells synergize with CD47 blockade for potent suppression of gastrointestinal cancers.
    target: binder.binder_evidence.citation
    method: derived
  - source: [Journal/Title, ISOAbbreviation, Volume, Issue, MedlinePgn, PubDate]
    example: 'Acta pharmaceutica Sinica. B | Acta Pharm Sin B | 15 | 5 | 2559-2574 | 2025 May'
    target: binder.binder_evidence.citation
    method: derived
  - source: ArticleDate
    example: '2025-03-19'
    target: null
    note: 电子首发日，与 PubDate（2025 May）不同；组装 citation 时取 PubDate，勿混用
  - source: Author（17 位）
    example: 'Zheng Liuhai; Ding Youbing; Xu Xiaolong; ... Li Zhijie'
    target: binder.binder_evidence.citation
    method: derived
  - source: Affiliation
    example: Shenzhen People's Hospital ... Shenzhen 518020, China.
    target: null
    note: 本库无机构列
  - source: PublicationType
    example: Journal Article
    target: binder.binder_evidence.evidence_level
    method: derived
    note: Journal Article + 期刊同行评议 → 同行评议；若为 Preprint/Review 须另判

  # ---- 主题 ----
  - source: Keyword
    example: '[CAR-NK, CD47–SIRPα checkpoint, CDH17, CV1, Gastrointestinal cancers, M1-phenotype macrophages, Macrophage activation, Nanobody]'
    target: binder.binder.target_antigen
    method: derived
    note: |
      ★本条最有价值的元数据栏。关键词直接给出 CDH17（靶点）、Nanobody（binder 格式）、
      CAR-NK（效应细胞类型）三项，靠关键词即可完成靶点粗筛与格式预判。
  - source: DescriptorName（MeSH）
    example: '（本条为空）'
    target: null
    note: ★本条 MeSH 未标引（2025 年新文常见滞后）→ 不能依赖 MeSH 做靶点筛选，须回退到 Keyword
  - source: AbstractText
    example: 'we engineered nanobody-based chimeric antigen receptor (CAR) natural killer (NK) cells targeting cadherin 17 (CDH17) ...'
    target: [binder.binder.target_antigen, binder.binder_evidence.applicable_scenario]
    method: derived
    note: 无结构化 Label（非分段摘要），只能整段做 NER/规则抽取

  # ---- 不可用 ----
  - source: Grant
    example: '（本条为空）'
    target: null
  - source: ReferenceList/ArticleId
    example: '约 130 条参考文献的 PMID/PMCID'
    target: null
    method: discovery
    note: ★不入库，但可作"滚雪球"发现源——由本条参考文献扩展候选文献池


# =========================================================
# Part 2 — A 库映射（binder.binder）
# =========================================================
# 按 Binder 字段规范 47 栏逐栏对齐。
# ★结论先行：47 栏里只有 4 栏有值（name 为 null）。这就是摘要级的天花板。
targets_binder:
  - tables: [binder.binder, binder.binder_evidence]
    field_routing: "entity fields -> binder.binder; source/measurement fields -> binder.binder_evidence; IDs linked by binder_id"
    record_per_source: one
    entity_key: [source_id]
    caveat: ★本条只够建"占位实体 + 全文路由指针"，不够支撑任何序列/亲和力建模

    # ===== 公共元数据 11 栏（本源唯一填得动的一组）=====
    metadata_fields:
      - {platform_primary_key: true, method: platform}
      - target: name
        method: constant
        value: null
        note: |
          ★摘要只说 "nanobody-based CAR"，未给克隆名（全文才有 NbCDH17 / NbC9）。
          旧版本此栏填 "(标题)" —— 用文章标题充当 binder 名称是伪值，会在 A 库里
          造出一个名字是句子的实体，且无法与全文抽取的 NbCDH17 归并。已改为 null。
      - {target: source_type, method: constant, value: literature}
      - {target: source_id, method: derived, value: '10.1016/j.apsb.2025.03.039', rule: 优先取 DOI；PMID 40487639 作辅助键}
      - target: experimental_conditions
        method: constant
        value: null
        note: 摘要不含任何实验条件
      - {target: evidence_level, method: constant, value: 同行评议, note: 'PublicationType = Journal Article + 期刊同行评议；evidence_level 以文本保存'}
      - {target: version, method: constant, value: 正式发表版（非预印本）}
      - {target: entry_date, method: platform, note: 不得用 PubDate(2025 May) 或 ArticleDate(2025-03-19) 冒充}
      - {target: citation, method: derived, value: 'Zheng L, Ding Y, Xu X, et al. (2025). CDH17-targeting CAR-NK cells synergize with CD47 blockade for potent suppression of gastrointestinal cancers. Acta Pharm Sin B 15(5):2559-2574. doi:10.1016/j.apsb.2025.03.039. PMID 40487639.'}
      - {target: applicable_scenario, method: derived, value: '胃肠道肿瘤 CDH17 靶向（摘要级，仅够做靶点粗筛）'}
      - {target: contrary_evidence, method: constant, value: false}

    # ===== 序列 4 栏 =====
    sequence_fields:
      - target: [vh_sequence, vl_sequence, scfv_sequence, linker]
        method: constant
        value: null
        status: 本粒度缺失（全文有）
        note: ★不是"本源永久缺失"——同文全文层的情况见 EuropePMC_实例.yaml
      - {unmapped_legacy_field: format, method: derived, value: VHH, confidence: 中, note: '依据 Keyword "Nanobody" + 摘要 "nanobody-based CAR"；★文本推断，未见序列证实，见 R4'}

    # ===== 编号 / 注释 7 栏 =====
    annotation_fields:
      - target: [numbering_scheme, fr_cdr_regions,
                 cdr_lengths, vdj_genes, germline_origin, somatic_mutations]
        method: constant
        value: null
        status: 本粒度缺失
        note: 摘要级无序列 → 编号/注释整组为空

    # ===== 靶点 / 表位 4 栏 =====
    target_fields:
      - target: target_antigen
        method: derived
        value: 'CDH17（cadherin 17）'
        confidence: 高
        source_ref: [Keyword, AbstractText]
        note: ★本条唯一高置信的专属字段；Keyword 与摘要双重确认
      - {target: [epitope, binding_site], method: constant, value: null, status: 本粒度缺失}

    # ===== 亲和力 5 栏 =====
    affinity_fields:
      - target: [kd, kon, koff, measurement_method, measurement_conditions]
        method: constant
        value: null
        status: 本粒度缺失（全文亦无数值）
        note: ★全文层也只有定性 "high binding affinity"，故这 5 栏即使深抽也补不到，须另寻来源

    # ===== 特异性 2 栏 =====
    specificity_fields:
      - target: [cross_reactivity_protein, species_reactivity]
        method: constant
        value: null
        status: 本粒度缺失（全文有）
        note: 全文层有"人鼠双交叉（蛋白水平）"，摘要未提

    # ===== 成药性 10 栏 =====
    developability_fields:
      - target: [tm, viscosity, aggregation_tendency, solubility, hydrophobicity,
                 charge, glycosylation_sites, free_cysteines, humanization_level,
                 immunogenicity_ada_risk]
        method: constant
        value: null
        status: 永久缺失
        note: 摘要与全文均无成药性数据；须由 DOTAD / Thera-SAbDab 补

    # ===== 结构 3 栏 =====
    structure_fields:
      - {target: [structure_template, complex_structure], method: constant, value: null, status: 永久缺失}

    # ===== 状态 / 功能 3 栏 =====
    status_fields:
      - {unmapped_legacy_field: development_stage, method: constant, value: 临床前}
      - {unmapped_legacy_field: patent_status, method: constant, value: null}
      - {unmapped_legacy_field: in_vitro_readout, method: derived, value: '摘要述及 CDH17 依赖性清除 GI 肿瘤细胞（定性，无数值、无测定方法）', confidence: 中}


# =========================================================
# Part 3 — B 库映射（car.car / car.car）
# =========================================================
# 按 CAR 结构库字段规范 25 栏逐栏对齐——结论：模块级 25 栏全部填不了。
targets_car:
  - tables: [car.car, car.car_evidence]
    field_routing: "name/modules/version/entry_date -> car.car; source/performance/constraint fields -> car.car_evidence; IDs linked by car_id"
    decision: 不建行
    spec_checklist:
      note: 逐栏核对，标识栏起全部无值（★这是结论而非略过）
      元数据11栏: 'uid/name/source_type/source_id/experimental_conditions/evidence_level/version/entry_date/citation/applicable_scenario/contrary_evidence —— 技术上可填，但只有元数据而无标识栏，行本身无意义'
      module_type: '★NOT NULL 约束，而摘要不含任何模块名 → 无从填起，这一条即决定不建行'
      source_molecule: null
      sequence: null
      length_aa: null
      activation_speed: null
      metabolic_state: null
      expansion_capacity: null
      memory_phenotype: null
      persistence: null
      exhaustion_risk: null
      tonic_signaling_tendency: null
      geometric_length: 'null（且 car.car 无此列）'
      epitope_distance_effect: null
      immune_synapse_effect: null
      tonic_signaling_effect: null
      compatible_modules: null
      incompatible_modules: null
      assembly_rules: 'null（★该列属 car.car，非 car.car）'
    reason: |
      摘要只出现 "chimeric antigen receptor (CAR)" 与 "nanobody-based" 两个词，
      不含任何模块名（无信号肽/铰链/跨膜/共刺激/CD3ζ）。
      car.car.modules 为 NOT NULL，且无法给出任何合法 module_type → 不建行。

  - tables: [car.car, car.car_evidence]
    field_routing: "name/modules/version/entry_date -> car.car; source/performance/constraint fields -> car.car_evidence; IDs linked by car_id"
    decision: 可选建占位行
    caveat: 仅当业务侧要求"每篇文献都有 construct 占位"时才建；否则跳过
    fields_if_built:
      - {target: name, method: derived, value: 'CDH17-CAR-NK（摘要级，模块未知）'}
      - {target: source_type, method: constant, value: literature}
      - {target: source_id, method: constant, value: '10.1016/j.apsb.2025.03.039'}
      - {target: evidence_level, method: constant, value: 同行评议}
      - {target: [experimental_conditions, applicable_scenario], method: constant, value: null}
      - {target: contrary_evidence, method: constant, value: false}
      - {target: version, method: constant, value: 正式发表版}
      - {target: entry_date, method: platform}
      - {target: citation, method: derived, value: 'Zheng L, et al. (2025). Acta Pharm Sin B 15(5):2559-2574. PMID 40487639.'}
      - unmapped_legacy_fields: [binder_uid, scfv_module_uid, linker_module_uid, hinge_module_uid,
                 tm_module_uid, costim_module_uid, cd3z_module_uid]
        method: constant
        value: null
        note: ★6 个模块外键全部悬空 + binder_uid 亦无（binder 无 name）
      - {unmapped_legacy_fields: [full_sequence, vector_backbone], method: constant, value: null}
      - {unmapped_legacy_field: logic, method: constant, value: 无}
      - {unmapped_legacy_field: validated_function, method: derived, value: '摘要：CDH17 依赖性杀伤；与 CD47 阻断协同（定性）'}


# =========================================================
# Part 4 — C 库映射（manufacturing.manufacturing）
# =========================================================
# 按制造工艺字段规范逐栏对齐——结论：22 个业务列全部为空。
targets_process:
  decision: 不建行
  spec_checklist:
    note: 逐栏核对，无一有值（★这是结论而非略过）
    t_cell_source: null
    cd4_cd8_ratio: null
    starting_cell_quality: null
    activation_method: null
    reagents: null
    vector: null
    moi: null
    transduction_transfection_conditions: null
    culture_system: null
    cytokine_combination: null
    culture_duration: null
    cryopreservation_conditions: null
    formulation: null
    cell_viability: null
    transduction_efficiency: null
    vcn: null
    cd3_positive_ratio: null
    phenotype: null
    sterility: null
    mycoplasma: null
    endotoxin: null
    killing_activity: null
    cytokine_release: null
    car_construct_uid: '（可指向 Part 3 占位行）'
    corresponding_car_product: 'CDH17-CAR-NK（★仅此一栏有值）'
  reason: |
    旧版本此处填 {对应CAR产品: 'CDH17-CAR-NK(◐摘要)'} —— 22 个业务列里只有产品名一栏有值，
    建这样的行只会虚增 C 库计数、拉低完整度统计。改为不建行；
    产品名信息由 Part 2 的 citation 与 Part 3 的 construct 承载即可。
    ★对比同文全文层（EuropePMC_实例.yaml Part 4）：那边 22 栏里 11 栏有值。


# =========================================================
# Part 5 — 本条填不了的字段
# =========================================================
unmapped_target_columns:

  binder_blocked_by_abstract_only:
    columns: [name, vh_sequence, vl_sequence, scfv_sequence, linker, fr_cdr_regions,
              cdr_lengths, numbering_scheme, vdj_genes, germline_origin,
              somatic_mutations, epitope, binding_site,
              kd, kon, koff, measurement_method, measurement_conditions,
              cross_reactivity_protein, species_reactivity, tm, viscosity,
              aggregation_tendency, solubility, hydrophobicity, charge,
              glycosylation_sites, free_cysteines, humanization_level, immunogenicity_ada_risk,
              structure_template, complex_structure,
              patent_status, experimental_conditions, applicable_scenario,
              contrary_evidence]
    note: |
      ★这不是"本源永久缺失"，而是"本粒度缺失"——
      其中绝大多数在同一篇文章的 OA 全文里有值（见 EuropePMC_实例.yaml）。
      正确动作不是标 data_absent，而是走 PMCID 转 PMC 全文重抽。

  car_all:
    note: 见 Part 3
  process_all:
    note: 见 Part 4

  platform_managed:
    - version
    - entry_date

fill_rate_vs_fulltext:
  note: 同一篇文章两种粒度的产出对比（本档 vs EuropePMC_实例.yaml）
  abstract_level:
    binder_专属字段: '3 项有值（target_antigen / format / in_vitro_readout），其余全空'
    car_module_行数: 0
    car_construct_行数: '0（或 1 个空壳占位）'
    process_行数: 0
  fulltext_level:
    binder_专属字段: 'target_antigen / format / species_reactivity / cross_reactivity_protein / measurement_method / in_vitro_readout 等多项有值'
    car_module_行数: 7
    car_construct_行数: 2
    process_行数: '1（含培养体系/细胞因子/转导筛选/杀伤测定等）'
  conclusion: 摘要级产出约为全文级的十分之一 → PubMed 只做发现与路由，不做抽取主力


# =========================================================
# Part 6 — 派生规则标识
# =========================================================
rule_refs:
  route_to_pmc_if_pmcid:
    description: 有 PMCID 即转 PMC 取 OA 全文，本条记录降级为"发现记录"
    rule: 'ArticleId[IdType=pmc] 非空 → 触发全文抽取任务，抽取完成后两条记录按 DOI 归并'
    example: 'PMID 40487639 → PMC12144966 → EuropePMC_实例.yaml'
  antigen_from_keywords:
    description: 由 Keyword + 摘要联合抽靶抗原
    priority: Keyword 精确词 > 摘要 NER
    guard: ★MeSH 可能未标引（本条即空），不得把 MeSH 作为唯一依据
  infer_binder_format_from_text:
    description: 由 "nanobody" / "scFv" / "Fab" 等词推断 binder_format
    guard: 文本推断，须标 confidence=中；取到序列后以序列判定覆盖之
  assemble_citation_from_pubmed_xml:
    description: 由题录字段组装可回溯引用串
    rule: '"{authors} ({PubDate:%Y}). {ArticleTitle} {ISOAbbrev} {Volume}({Issue}):{MedlinePgn}. doi:{doi}. PMID {PMID}."'
    guard: 取 PubDate 而非 ArticleDate（后者是电子首发日）


# =========================================================
# Part 7 — 已知风险
# =========================================================
risks:
  - id: R1
    severity: P0
    desc: |
      重复入库风险。本条与 EuropePMC_实例.yaml 是同一篇文章的两个粒度。
      若两条 route 各自建 binder 实体而不归并，A 库会出现
      "一个空壳 CDH17 binder + 一个完整 NbCDH17 binder" 两行，
      且空壳行会稀释该文献的证据权重、污染去重统计。
      → 必须以 DOI 作为来源归并键：复用同一实体 ID，并分别保留摘要与全文证据记录，不相互覆盖。
  - id: R2
    severity: P1
    desc: |
      旧版本把 name 填成 "(标题)"、把 process 行填成只有一个产品名。
      两者都是"为了让字段非空而填"的伪值，会让完整度统计虚高、让实体名不可用。
      本轮已改为 null / 不建行。原则：宁可空，不可伪。
  - id: R3
    severity: P1
    desc: |
      本条 MeSH 为空（2025 年新文标引滞后）。
      若靶点筛选管线依赖 MeSH，本条这类新文会被系统性漏掉——
      而新文恰恰是最有价值的。必须以 Keyword + 标题 + 摘要 NER 作主路径，MeSH 仅作补充。
  - id: R4
    severity: P2
    desc: |
      format 填 VHH 是由 "nanobody" 一词推断的，无序列证实。
      若 QC 要求每值可回溯到原文，此栏可回溯（关键词 + 摘要原句），但属文本推断而非实测，
      应与全文/序列级证据区分权重。
  - id: R5
    severity: P2
    desc: |
      本条约 130 条参考文献的 PMID/PMCID 未被利用。
      这些是现成的"滚雪球"发现源，对 CDH17 这类相对小众靶点，
      比关键词检索更能补全候选池。建议在发现阶段接入。
  - id: R6
    severity: P1
    desc: |
      最新 schema 已用 binder.binder.fr_cdr_regions JSON 统一承载 FR/CDR。
      摘要没有 binder 序列，因此仍为空；全文补到序列后须按区域名写 JSON。
