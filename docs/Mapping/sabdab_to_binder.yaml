# =========================
# Mapping: SAbDab2 -> binder.binder + binder.binder_evidence
# =========================
# 只回答一件事：SAbDab2 的字段如何变成数据库字段。
# 不描述如何获取数据（见 docs/SourceRegistry/sabdab.yaml），
# 不描述目标库结构、类型、约束（见 sql/03_binder.sql）。

mapping_id: sabdab2_to_binder
source_name: SAbDab2
route_id: [all_summary, structures]
target_schema: sql/03_binder.sql → binder.binder + binder.binder_evidence
source_format: csv_row + mmcif_record
record_grain: 一条 SAbDab2 antibody instance（某 PDB 条目中的一组 H/L 配对或单域链）

status: draft
last_verified: 2026-08-20


# =========================================================
# Part 1 — Source 字段清单（all_summary，45 栏）
# =========================================================
# 取样档：data/raw/sabdab/20260824/gucy2c_summary.csv
# 全量实测 21,914 列 × 45 栏（GET /api/download/all-summary，v2.0.10）
# 下面的 example 取自本项目靶点 GCC/GUCY2C 的真实行（PDB 8GHO / 8GHP）。

source_field_inventory:

  # ---- 识别类 ----
  - source: INSTANCE
    example: pdb_00008gho-H-L
    description: 实例 ID，格式 <PDB>-<Hchain>-<Lchain>；每列唯一
    target: binder.binder_evidence.source_id
  - source: PDB
    example: pdb_00008gho
    target: binder.binder.structure_template
  - source: SABDAB_ID
    example: sabdab2_H03VYL030Q
    description: SAbDab2 内部抗体 ID；同一抗体的多个 PDB 实例共用
    target: binder.binder.name
    note: 非抗体名称，只是内部 ID。真名待 Thera-SAbDab / DOTAD 回填
  - source: [HEAVY_ID, LIGHT_ID, Hchain, Lchain, model]
    target: null
    note: 链级标识，用于从 mmCIF 取序列，不单独入库

  # ---- 靶点 ----
  - source: antigen_name
    example: Guanylyl cyclase C
    target: binder.binder.target_antigen
    method: derived
    rule: 去除 " peptide" / " ECD" 等构建体后缀后归一化；'NA' 视为 data_absent
  - source: antigen_type
    example: PROTEIN | PEPTIDE
    target: binder.binder_evidence.epitope
    method: derived
    value_map: {PEPTIDE: 线性, PROTEIN: 构象, NA: 未知}
    note: |
      这是推断，不是实测。antigen_type 说的是「抗原是肽还是蛋白」，
      不等于「表位是线性还是构象」——肽抗原多半呈线性但不必然。
      若 QC 要求严格，此栏应改填 未知 并留待结构计算。
  - source: antigen_chain
    target: binder.binder.complex_structure
    method: derived
    rule: PDB + ":" + antigen_chain；antigen_chain 为 NA 时该实例无抗原，填 null
  - source: antigen_species
    example: homo sapiens
    target: binder.binder_evidence.species_reactivity
    method: derived
    rule: 只说明「本结构里结合的抗原来自哪个物种」，不是跨物种反应性谱
  - source: agtaxid
    target: null

  # ---- 结构与实验条件 ----
  - source: method
    example: XRAY
    target: binder.binder_evidence.experimental_conditions
    method: derived
    rule: 与 resolution / r_free / r_factor 合成一句，如 "XRAY, 1.6 Å, Rfree 0.21"
  - source: [resolution, r_free, r_factor]
    example: '1.6'
    target: binder.binder_evidence.experimental_conditions
    method: derived
  - source: type
    example: FV
    target: null
    method: not_mapped
    note: |
      实测 8GHO/8GHP 的 type 均为 "FV"，而 compound 明写 "anti-GUCY2C-scFv antibody"。
      => type 栏可供来源审计，但最新 binder schema 不再存储 format，故不入库。
  - source: [short_header, compound]
    example: GUCY2C-ECD bound to anti-GUCY2C-scFv antibody
    target: binder.binder_evidence.citation
    method: derived
    note: compound 同时是 format 判定的输入，见上

  # ---- 物种与表达 ----
  - source: [heavy_species, light_species]
    example: homo sapiens
    target: binder.binder.germline_origin
    method: derived
    rule: 只记来源物种。不得据此填 humanization——物种 ≠ 人源化程度
  - source: [organism, organism_taxid, heavy_taxid, light_taxid,
             expression_system, expression_system_taxid,
             heavy_expression_system, light_expression_system,
             heavy_expression_system_taxid, light_expression_system_taxid,
             agexpression_system, agexpression_system_taxid]
    target: null
    note: 表达系统与 taxid，本库无对应列

  # ---- 亚型 ----
  - source: [heavy_subclass, light_subclass]
    example: NA
    target: null
    note: |
      【本轮更正】旧版本映射把这两栏送进 vdj_genes，那是错的。
      subclass 是恒定区亚型（IgG1/IgG2…），与 V(D)J 基因重排完全是两回事。
      且实测本项目靶点的三行全为 'NA'。
      => vdj_genes 本源填不了，见 Part 2。
  - source: light_ctype
    example: K
    target: null
    note: 轻链型别 κ/λ。binder.binder 无对应列；对 scFv 设计有用，属次要缺口

  # ---- 日期与作者 ----
  - source: [date, SABDABdepo_date, SABDABupdate_date]
    example: 2023/03/10
    target: binder.binder_evidence.citation
    method: derived
    note: |
      date 为结构发表日，用于组装 citation。源格式 YYYY/MM/DD，需转 ISO。
      切勿填 entry_date —— 那是我方录入日，由 DEFAULT current_date 管理。
  - source: authors
    example: Mosyak, L.
    target: binder.binder_evidence.citation
    method: derived

  # ---- 构象共享 ----
  - source: [chainsharing_construct, chainsharing_construct_partners,
             non_chainsharing_construct, non_chainsharing_construct_partners]
    target: null
    note: 多特异性构象的链共享关系。本库无对应列，但对判定「是否单一 binder」有用，
          建议在实体归一化阶段读取，不入库


# =========================================================
# Part 2 — binder.binder 中本源填不了的字段
# =========================================================
unmapped_target_columns:

  not_available_in_all_summary:
    - vh_sequence            # summary 无任何氨基酸序列；改由 structures route 取，见 Part 4
    - vl_sequence
    - scfv_sequence
  not_available_at_all:
    - linker            # 须从结构或原文抽取
    - fr_cdr_regions     # API 支援 CDR/Framework 检索，但 summary 不输出区域序列
    - cdr_lengths
    - vdj_genes         # 见 Part 1 的 heavy_subclass 说明
    - somatic_mutations
    - numbering_scheme         # summary 本身未编号。若我方自行对结构序列编号，
                        # 该值由我方 pipeline 决定而非由 source 决定，不得写死 constant IMGT
    - humanization_level
    - glycosylation_sites
    - free_cysteines
    - kd             # 当前 45 栏不含 affinity / delta_g / affinity_method / temperature
    - kon          #   （旧版 SAbDab 有，v2.0.10 已移除）
    - koff
    - measurement_method
    - measurement_conditions
    - tm
    - viscosity
    - aggregation_tendency
    - solubility
    - hydrophobicity
    - charge
    - immunogenicity_ada_risk
    - cross_reactivity_protein
    - cross_reactivity_cell
  epitope_gap:
    columns: [binding_site]
    note: |
      当前 epitope 仅由 antigen_type 作粗粒度推断；精确表位与 binding_site
      需从 mmCIF 计算接触残基后 derived，属 structures route 的延伸工作，本轮未做。
  platform_managed:
    - version
    - entry_date        # DEFAULT current_date


# =========================================================
# Part 3 — 可执行映射
# =========================================================

targets:

  - table: binder.binder
    record_per_source: one
    iterate_over:

    # 实体归一化键：同一 SABDAB_ID 的多个 PDB 实例视为同一 binder。
    entity_key: [SABDAB_ID]

    fields:
      - {target: binder_id, method: platform}
      - {target: name, source: SABDAB_ID, method: direct}
      - {target: target_antigen, source: antigen_name, method: derived, rule_ref: normalize_antigen_name}
      - {target: complex_structure, source: [PDB, antigen_chain], method: derived}
      - {target: structure_template, source: PDB, method: direct}
      - {target: germline_origin, source: [heavy_species, light_species], method: derived}

  - table: binder.binder_evidence
    record_per_source: one
    entity_key: [SABDAB_ID, INSTANCE]
    fields:
      - {target: evidence_id, method: platform}
      - {target: binder_id, method: parent, references: binder.binder_id}
      - {target: source_type, method: constant, value: public_database}
      - {target: source_id, source: INSTANCE, method: direct, required: true}
      - {target: evidence_level, method: constant, value: 同行评议}
      - {target: citation, source: [authors, compound, date, PDB], method: derived}
      - {target: experimental_conditions, source: [method, resolution, r_free, r_factor], method: derived}
      - {target: contrary_evidence, method: constant, value: false}
      - {target: epitope, source: antigen_type, method: derived, value_map: {PEPTIDE: 线性, PROTEIN: 构象, NA: 未知}}
      - target: species_reactivity
        source: antigen_species
        method: derived
        rule: '写为 JSON 单点观察，例如 {"observed_antigen_species": "homo sapiens"}'


# =========================================================
# Part 4 — structures route（补 vh_sequence / vl_sequence）
# =========================================================
# summary 无序列，序列只能走这条 route。
# 实测样本：data/raw/sabdab/20260824/gucy2c_structures.tgz
#   pdb_00008gho_sabdab.cif、pdb_00008gho_H_L_abag.cif、pdb_00008gho_A_B_abag.cif
#   pdb_00008ghp_sabdab.cif、pdb_00008ghp_H_L_abag.cif
# 取数：GET /api/download/all-structures 或 POST /api/download/search-structures

structures_route:
  route_id: structures      # 已在 docs/SourceRegistry/sabdab.yaml 的 notes 中定义为 route (b)
  source_format: mmcif_record
  record_grain: 一个 mmCIF 结构档（<pdb>_sabdab.cif 或 <pdb>_<chains>_abag.cif）

  join_to_summary:
    on: PDB
    rule: 用 summary 的 Hchain / Lchain 定位 mmCIF 中对应的 entity，再取其序列

  targets:
    - table: binder.binder
      record_per_source: one
      entity_key: [SABDAB_ID]
      fields:
        - target: vh_sequence
          source: entity_poly.pdbx_seq_one_letter_code
          method: derived
          rule: 取 Hchain 所属 entity 的一字母序列，去除换行与转义
        - target: vl_sequence
          source: entity_poly.pdbx_seq_one_letter_code
          method: derived
          rule: 取 Lchain 所属 entity 的一字母序列
    - table: binder.binder_evidence
      record_per_source: one
      entity_key: [SABDAB_ID, PDB]
      fields:
        - {target: evidence_id, method: platform}
        - {target: binder_id, method: parent, references: binder.binder_id}
        - {target: source_type, method: constant, value: public_database}
        - {target: source_id, source: PDB, method: direct, required: true}
        - {target: evidence_level, method: constant, value: 同行评议}
        - target: citation
          source: [citation.journal_abbrev, citation.title, citation.year,
                   citation.pdbx_database_id_DOI, citation.pdbx_database_id_PubMed]
          method: derived
          note: |
            mmCIF 的 citation 块比 summary 的 authors 栏完整，含 DOI 与 PubMed ID。
            两条 route 都能填 citation 时，以 structures route 为准（覆盖 summary 值）。


# =========================================================
# Part 5 — 派生规则标识
# =========================================================
# rule_ref 指向的规则实现放在 parser 代码里，此处只登记标识与语义。

rule_refs:
  normalize_antigen_name:
    description: 去除 " peptide" / " ECD" / " ectodomain" 等构建体后缀，保留抗原本名
    example: '"Guanylyl cyclase C peptide" → "Guanylyl cyclase C"'
    note: 本项目靶点 GCC/GUCY2C 与 CDH17 的别名表另行维护，不在本档
# =========================================================
# Part 6 — 已知风险
# =========================================================
risks:
  - id: R1
    desc: |
      21,914 条 instance 只对应 6,780 个 SAbDab2_entries。
      按 entity_key=[SABDAB_ID] 归一化后，同一 binder 会有多条来源记录
      （不同 PDB、不同分辨率、不同抗原构建体）。
      最新两表结构下，同一 binder 只保留一条实体，不同 PDB 实例作为多条 evidence 关联。
  - id: R2
    desc: |
      epitope_kind 由 antigen_type 推断而来，是本档唯一「推断而非实测」的字段。
      若 Day14 的引用可追溯性检查要求每个值都有原文出处，此栏会不合规。
      建议届时改填 未知。
  - id: R3
    desc: |
      本源无任何亲和力数据（kd / kon / koff 全空）。
      A 库若只灌 SAbDab2，推荐算法拿不到亲和力特征。
      亲和力须由 DOTAD 2.0（Adams / Jain 分页）与文献源补齐。
