# =========================
# Mapping: SAbDab2 -> binder.binder
# =========================
# 只回答一件事：SAbDab2 的字段如何变成数据库字段。
# 不描述如何获取数据（见 docs/SourceRegistry/sabdab.yaml），
# 不描述目标库结构、类型、约束（见 sql/03_binder.sql）。
#
# 【目标 schema 变更（2026-08-20）】
# 本档原先映射到 docs/Schema/Schema_A.yaml 的 binder + binder_evidence 两表。
# 现改以 sql/03_binder.sql 的 binder.binder 单表为准（业务侧 2026-08-20 确认）。
# 差异：单表已把实体与证据合并，故不再有 parent / 外键；
# 列名亦不同（vh_sequence→vh_seq、kd→kd_nm、tm→tm_celsius、germline_origin→germline）。

mapping_id: sabdab2_to_binder
source_name: SAbDab2
route_id: [all_summary, structures]
target_schema: sql/03_binder.sql → binder.binder
source_format: csv_row + mmcif_record
record_grain: 一条 SAbDab2 antibody instance（某 PDB 条目中的一组 H/L 配对或单域链）

status: draft
last_verified: 2026-08-20


# =========================================================
# Part 1 — Source 字段清单（all_summary，45 栏）
# =========================================================
# 取样档：data/raw/sabdab/20260824/gucy2c_summary.csv
# 全量实测 21,914 列 × 45 栏（GET /api/download/all-summary，v2.0.10）
# 下面的 example 取自本项目靶点 GCC/GUCY2C 的真实行（PDB 8GHO / 8GHP）。

source_field_inventory:

  # ---- 识别类 ----
  - source: INSTANCE
    example: pdb_00008gho-H-L
    description: 实例 ID，格式 <PDB>-<Hchain>-<Lchain>；每列唯一
    target: binder.binder.source_id
  - source: PDB
    example: pdb_00008gho
    target: binder.binder.structure_template
  - source: SABDAB_ID
    example: sabdab2_H03VYL030Q
    description: SAbDab2 内部抗体 ID；同一抗体的多个 PDB 实例共用
    target: binder.binder.name_code
    note: 非抗体名称，只是内部 ID。真名待 Thera-SAbDab / DOTAD 回填
  - source: [HEAVY_ID, LIGHT_ID, Hchain, Lchain, model]
    target: null
    note: 链级标识，用于从 mmCIF 取序列，不单独入库

  # ---- 靶点 ----
  - source: antigen_name
    example: Guanylyl cyclase C
    target: binder.binder.target_antigen
    method: derived
    rule: 去除 " peptide" / " ECD" 等构建体后缀后归一化；'NA' 视为 data_absent
  - source: antigen_type
    example: PROTEIN | PEPTIDE
    target: binder.binder.epitope_kind
    method: derived
    value_map: {PEPTIDE: 线性, PROTEIN: 构象, NA: 未知}
    note: |
      这是推断，不是实测。antigen_type 说的是「抗原是肽还是蛋白」，
      不等于「表位是线性还是构象」——肽抗原多半呈线性但不必然。
      若 QC 要求严格，此栏应改填 未知 并留待结构计算。
  - source: antigen_chain
    target: binder.binder.complex_structure
    method: derived
    rule: PDB + ":" + antigen_chain；antigen_chain 为 NA 时该实例无抗原，填 null
  - source: antigen_species
    example: homo sapiens
    target: binder.binder.species_reactivity
    method: derived
    rule: 只说明「本结构里结合的抗原来自哪个物种」，不是跨物种反应性谱
  - source: agtaxid
    target: null

  # ---- 结构与实验条件 ----
  - source: method
    example: XRAY
    target: binder.binder.experiment_conditions
    method: derived
    rule: 与 resolution / r_free / r_factor 合成一句，如 "XRAY, 1.6 Å, Rfree 0.21"
  - source: [resolution, r_free, r_factor]
    example: '1.6'
    target: binder.binder.experiment_conditions
    method: derived
  - source: type
    example: FV
    target: binder.binder.format
    method: derived
    value_map: {Fab: Fab, VHH: VHH, scFv: scFv, FV: 其他}
    note: |
      实测 8GHO/8GHP 的 type 均为 "FV"，而 compound 明写 "anti-GUCY2C-scFv antibody"。
      => type 栏不足以判定 format，FV 只能落到 其他。
      若要拿到真正的 scFv/IgG 判定，须解析 compound 文本或看 mmCIF 实体数。
    rule_ref: derive_binder_format
  - source: [short_header, compound]
    example: GUCY2C-ECD bound to anti-GUCY2C-scFv antibody
    target: binder.binder.citation
    method: derived
    note: compound 同时是 format 判定的输入，见上

  # ---- 物种与表达 ----
  - source: [heavy_species, light_species]
    example: homo sapiens
    target: binder.binder.germline
    method: derived
    rule: 只记来源物种。不得据此填 humanization——物种 ≠ 人源化程度
  - source: [organism, organism_taxid, heavy_taxid, light_taxid,
             expression_system, expression_system_taxid,
             heavy_expression_system, light_expression_system,
             heavy_expression_system_taxid, light_expression_system_taxid,
             agexpression_system, agexpression_system_taxid]
    target: null
    note: 表达系统与 taxid，本库无对应列

  # ---- 亚型 ----
  - source: [heavy_subclass, light_subclass]
    example: NA
    target: null
    note: |
      【本轮更正】旧版本映射把这两栏送进 vdj_genes，那是错的。
      subclass 是恒定区亚型（IgG1/IgG2…），与 V(D)J 基因重排完全是两回事。
      且实测本项目靶点的三行全为 'NA'。
      => vdj_genes 本源填不了，见 Part 2。
  - source: light_ctype
    example: K
    target: null
    note: 轻链型别 κ/λ。binder.binder 无对应列；对 scFv 设计有用，属次要缺口

  # ---- 日期与作者 ----
  - source: [date, SABDABdepo_date, SABDABupdate_date]
    example: 2023/03/10
    target: binder.binder.citation
    method: derived
    note: |
      date 为结构发表日，用于组装 citation。源格式 YYYY/MM/DD，需转 ISO。
      切勿填 entry_date —— 那是我方录入日，由 DEFAULT current_date 管理。
  - source: authors
    example: Mosyak, L.
    target: binder.binder.citation
    method: derived

  # ---- 构象共享 ----
  - source: [chainsharing_construct, chainsharing_construct_partners,
             non_chainsharing_construct, non_chainsharing_construct_partners]
    target: null
    note: 多特异性构象的链共享关系。本库无对应列，但对判定「是否单一 binder」有用，
          建议在实体归一化阶段读取，不入库


# =========================================================
# Part 2 — binder.binder 中本源填不了的字段
# =========================================================
unmapped_target_columns:

  not_available_in_all_summary:
    - vh_seq            # summary 无任何氨基酸序列；改由 structures route 取，见 Part 4
    - vl_seq
    - scfv_seq
  not_available_at_all:
    - linker            # 须从结构或原文抽取
    - cdr_h1            # SAbDab2 支援 CDR 检索（/api/sequence-similarity-search 的 region 参数
    - cdr_h2            #   支援 CDRH1/H2/H3、CDRL1/L2/L3、Framework），但 summary 不输出区域序列
    - cdr_h3
    - cdr_l1
    - cdr_l2
    - cdr_l3
    - cdr_lengths
    - vdj_genes         # 见 Part 1 的 heavy_subclass 说明
    - somatic_mutations
    - numbering         # summary 本身未编号。若我方自行对结构序列编号，
                        # 该值由我方 pipeline 决定而非由 source 决定，不得写死 constant IMGT
    - humanization
    - glycosylation_sites
    - free_cysteine
    - kd_nm             # 当前 45 栏不含 affinity / delta_g / affinity_method / temperature
    - kon_m1s1          #   （旧版 SAbDab 有，v2.0.10 已移除）
    - koff_s1
    - measure_method
    - measure_condition
    - tm_celsius
    - viscosity
    - aggregation
    - solubility
    - hydrophobicity
    - net_charge
    - immunogenicity_risk
    - cross_reactivity
    - development_stage
    - patent_status
    - in_vitro_readout
    - prediction_confidence
  epitope_gap:
    columns: [epitope_position, binding_site]
    note: |
      antigen_chain / antigen_name 只说明「结合了哪条抗原链」，不是表位，不得挪用。
      表位需从 mmCIF 计算接触残基后 derived，属 structures route 的延伸工作，本轮未做。
  platform_managed:
    - uid               # 由实体归一化键生成，见 entity_key
    - version
    - entry_date        # DEFAULT current_date
    - source_weight     # GENERATED ALWAYS AS core.weight_of(evidence_level)
    - batch_id
    - registry_id
    - merged_into
    - created_at
    - updated_at


# =========================================================
# Part 3 — 可执行映射
# =========================================================

targets:

  - table: binder.binder
    record_per_source: one
    iterate_over:

    # 实体归一化键：同一 SABDAB_ID 的多个 PDB 实例视为同一 binder。
    # uid 由此键生成；不同实例先各自入库，
    # 再由 core.merge_log 按 rule 归并（保留原记录，写 merged_into）。
    entity_key: [SABDAB_ID]

    fields:

      - target: source_type
        method: constant
        value: 公开库
        note: core.source_type 枚举取值之一

      - target: evidence_level
        method: constant
        value: 同行评议
        note: |
          【业务侧 2026-08-20 决定：按源定固定值】
          理由：SAbDab2 收录的是 RCSB PDB 的实验解析结构，每条结构都对应一篇
          经同行评议的发表（本档已把 authors/date 组装进 citation）。
          core.evidence_level 四个取值里，「同行评议」是唯一贴合的一档
          （「内部实验」属我方湿实验，「专利预印本」「模型预测」均不符）。
          注意 core.weight_of('同行评议') = 0.7，
          与 CLAUDE.md 权重(1) 阶梯（文献 0.4）不是同一套分级——以 sql 为准。

      - target: source_id
        source: INSTANCE
        method: direct
        required: true

      - target: name_code
        source: SABDAB_ID
        method: direct

      - target: citation
        source: [authors, compound, date, PDB]
        method: derived
        rule: '"{authors} ({date:%Y}). {compound}. PDB {PDB}."'

      - target: experiment_conditions
        source: [method, resolution, r_free, r_factor]
        method: derived
        rule: '"{method}, {resolution} Å, Rfree {r_free}, Rfactor {r_factor}"；NA 项省略'

      - target: contrary_evidence
        method: constant
        value: null
        note: 结构数据库不带相反证据标记；该列在 sql 中为 text 而非 boolean，留空

      - target: target_antigen
        source: antigen_name
        method: derived
        rule_ref: normalize_antigen_name
        note: "'NA' → null，原因记 data_absent"

      - target: epitope_kind
        source: antigen_type
        method: derived
        value_map: {PEPTIDE: 线性, PROTEIN: 构象, NA: 未知}
        note: 推断值，见 Part 1 的告警与 Part 6 R2

      - target: complex_structure
        source: [PDB, antigen_chain]
        method: derived
        rule: 'antigen_chain 非 NA 时填 "{PDB}:{antigen_chain}"，否则 null'

      - target: structure_template
        source: PDB
        method: direct

      - target: germline
        source: [heavy_species, light_species]
        method: derived
        rule: 两者相同则取其一，不同则填 "H:{heavy_species}/L:{light_species}"

      - target: species_reactivity
        source: antigen_species
        method: derived
        note: 单点观察，非反应性谱；'NA' → null

      - target: format
        source: [type, compound]
        method: derived
        rule_ref: derive_binder_format
        value_map: {Fab: Fab, VHH: VHH, scFv: scFv, FV: 其他}


# =========================================================
# Part 4 — structures route（补 vh_seq / vl_seq）
# =========================================================
# summary 无序列，序列只能走这条 route。
# 实测样本：data/raw/sabdab/20260824/gucy2c_structures.tgz
#   pdb_00008gho_sabdab.cif、pdb_00008gho_H_L_abag.cif、pdb_00008gho_A_B_abag.cif
#   pdb_00008ghp_sabdab.cif、pdb_00008ghp_H_L_abag.cif
# 取数：GET /api/download/all-structures 或 POST /api/download/search-structures

structures_route:
  route_id: structures      # 已在 docs/SourceRegistry/sabdab.yaml 的 notes 中定义为 route (b)
  source_format: mmcif_record
  record_grain: 一个 mmCIF 结构档（<pdb>_sabdab.cif 或 <pdb>_<chains>_abag.cif）

  join_to_summary:
    on: PDB
    rule: 用 summary 的 Hchain / Lchain 定位 mmCIF 中对应的 entity，再取其序列

  targets:
    - table: binder.binder
      record_per_source: one
      entity_key: [SABDAB_ID]
      fields:
        - target: vh_seq
          source: entity_poly.pdbx_seq_one_letter_code
          method: derived
          rule: 取 Hchain 所属 entity 的一字母序列，去除换行与转义
        - target: vl_seq
          source: entity_poly.pdbx_seq_one_letter_code
          method: derived
          rule: 取 Lchain 所属 entity 的一字母序列
        - target: citation
          source: [citation.journal_abbrev, citation.title, citation.year,
                   citation.pdbx_database_id_DOI, citation.pdbx_database_id_PubMed]
          method: derived
          note: |
            mmCIF 的 citation 块比 summary 的 authors 栏完整，含 DOI 与 PubMed ID。
            两条 route 都能填 citation 时，以 structures route 为准（覆盖 summary 值）。


# =========================================================
# Part 5 — 派生规则标识
# =========================================================
# rule_ref 指向的规则实现放在 parser 代码里，此处只登记标识与语义。

rule_refs:
  normalize_antigen_name:
    description: 去除 " peptide" / " ECD" / " ectodomain" 等构建体后缀，保留抗原本名
    example: '"Guanylyl cyclase C peptide" → "Guanylyl cyclase C"'
    note: 本项目靶点 GCC/GUCY2C 与 CDH17 的别名表另行维护，不在本档
  derive_binder_format:
    description: 由 type 与 compound 文本共同判定 binder.binder_format
    priority: compound 文本中的显式 format 词 > type 栏
    fallback: 其他


# =========================================================
# Part 6 — 已知风险
# =========================================================
risks:
  - id: R1
    desc: |
      21,914 条 instance 只对应 6,780 个 SAbDab2_entries。
      按 entity_key=[SABDAB_ID] 归一化后，同一 binder 会有多条来源记录
      （不同 PDB、不同分辨率、不同抗原构建体）。
      单表结构下这些会成为多行，必须靠 core.merge_log 归并，否则 A 库会虚胖约 3 倍。
  - id: R2
    desc: |
      epitope_kind 由 antigen_type 推断而来，是本档唯一「推断而非实测」的字段。
      若 Day14 的引用可追溯性检查要求每个值都有原文出处，此栏会不合规。
      建议届时改填 未知。
  - id: R3
    desc: |
      本源无任何亲和力数据（kd_nm / kon_m1s1 / koff_s1 全空）。
      A 库若只灌 SAbDab2，推荐算法拿不到亲和力特征。
      亲和力须由 DOTAD 2.0（Adams / Jain 分页）与文献源补齐。
