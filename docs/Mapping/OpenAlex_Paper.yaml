source_name: OpenAlex
domain: literature
入口_API: {endpoint: https://api.openalex.org/works, method: rest_api, authentication: none, credential_env: OPENALEX_MAILTO}
文件格式: [json]            # 直接下载：书目元数据 JSON(即用)
抽取:
  可用格式: [json, pdf]     # 元数据 JSON 即用；OA 条目另有全文 PDF
  获取步骤: 元数据直接用；OA 条目走 best_oa_location.pdf_url 另取全文 PDF
  额外成本: 非 OA 无全文；OA 的 PDF 在外部出版商站点(可能反爬/限流)
版本或快照: {mode: rolling, version_source: API updated_date / S3 月度快照, snapshot_date: null}
更新频率: {upstream: continuous, project_check: monthly}
取样验证:
  verified: true
  verification_sample: 'W4402816281「CD8α Structural Domains Enhance GUCY2C CAR-T Cell Efficacy」：id/doi/title/concepts/open_access(is_oa=true, gold)/authorships 存在；经 best_oa_location 取到 OA 全文 PDF'
  verified_at: 2026-08-19
# 两级抽取：① 元数据层(OpenAlex 本体 json) ② OA 全文层(经 best_oa_location 取 PDF/XML 后深抽)
# ---------------------------------------------------------------
# 可填性词表（三个 可填字段_* 小节通用）
#   直给 / 派生 / 需另取 / 需计算 / ◐条件 / 不适用 / 无 / 平台
#   （定义同 EuropePMC.yaml 档头词表）
# 本源特有标注：tier1 = OpenAlex 本体 json 即可得；tier2 = 须经 best_oa_location 取 OA 全文
# ---------------------------------------------------------------

可填字段_Binder:
  规范条目: 47
  tier1可填: 11    # 元数据层（json）
  tier2可填: 15    # OA 全文层（pdf）追加
  本源不可填: 28
  总述: |
    ★两级抽取。tier1 只给书目层，但★并非"专属字段全空"——
    abstract_inverted_index / mesh / ids.pmid 三项实测均非空，
    足以定靶抗原并接上全文路由。真正的专属字段填充发生在 tier2。
  字段:
    名称代号: {列: name_code, 可填性: tier2 ◐条件, 备注: tier1 只有文章标题，★不得用标题充当 binder 名称}
    来源类型: {列: source_type, 可填性: tier1 派生, rule: 恒为 文献}
    来源ID: {列: source_id, 可填性: tier1 直给, 来源位置: json.doi（另有 ids.pmid 作辅助键）}
    实验条件: {列: experiment_conditions, 可填性: tier2 ◐条件, 备注: tier1 无}
    证据等级: {列: evidence_level, 可填性: tier1 派生, rule: 由 type=article + 期刊判定；须排除 preprint}
    版本: {列: version, 可填性: tier1 派生, rule: 记文献状态；json.type 与 primary_location 可判定是否预印本}
    录入日期: {列: entry_date, 可填性: 平台, 备注: 不得用 publication_date / updated_date 冒充}
    引用: {列: citation, 可填性: tier1 直给, 来源位置: authorships + 期刊 + 日期 + doi, 备注: tier2 可精确到章节}
    适用场景: {列: applicable_scenario, 可填性: tier2 派生}
    相反证据: {列: contrary_evidence, 可填性: tier2 ◐条件}
    靶抗原:
      列: target_antigen
      可填性: tier1 直给
      来源位置: title + abstract_inverted_index + mesh
      置信度: 高
      备注: ★这是 tier1 最有价值的一栏——无需取全文即可完成靶点粗筛
    格式: {列: format, 可填性: tier2 派生, 备注: tier1 的 concepts 不足以判定格式}
    linker: {列: linker, 可填性: tier2 ◐条件, 备注: 构建体描述句常给 linker 类型（如 (G4S)4）}
    人源化程度: {列: humanization, 可填性: tier2 ◐条件, 置信度: 中, 备注: ★"构建体采用人源序列"≠"scFv 已人源化"，不可过度解读}
    结合位点: {列: binding_site, 可填性: tier2 ◐条件, 备注: 可由所用重组抗原构建体（如 ECD）推知，置信度中}
    开发临床阶段: {列: development_stage, 可填性: tier1 ◐条件 / tier2 派生}
    已有体外功能读出: {列: in_vitro_readout, 可填性: tier2 直给}
    'VH/VL/scFv 序列':
      列: [vh_seq, vl_seq, scfv_seq]
      可填性: tier2 ◐条件（实际覆盖率低）
      备注: ★文献常只给克隆号不给序列（实测本例即只有 "Clone 5F9"）。
             本源在 A 库无法用于序列建模，序列须由专利源补
    '编号/CDR/germline 组':
      列: [numbering, cdr_h1, cdr_h2, cdr_h3, cdr_l1, cdr_l2, cdr_l3,
           cdr_lengths, vdj_genes, germline, somatic_mutations]
      可填性: 需计算
      前置: ★必须先有序列——多数论文拿不到，故实际覆盖率很低
      备注: ★schema 无 FR 列，规范的「FR/CDR 区」只实现了一半
    '亲和力组':
      列: [kd_nm, kon_m1s1, koff_s1, measure_method, measure_condition]
      可填性: tier2 ◐条件
      备注: |
        ★最大陷阱：CAR 构型对照论文常报"某构型抗原结合更强"，
        那是 CAR 层面亲合力（avidity）差异，由铰链/跨膜几何造成，与 binder 亲和力无关。
        填入会得出"同一 scFv 有两种亲和力"的荒谬记录。正确归属是 car.module 的几何三栏。
        另：流式/珠定量是表面检测，非亲和力测定，不得填 measure_method。
    '特异性组':
      列: [cross_reactivity, species_reactivity]
      可填性: tier2 ◐条件
      备注: ★规范要求区分蛋白水平与细胞水平；多数论文只做其一，须写明是哪一级
    表位组: {列: [epitope_position, epitope_kind], 可填性: tier2 ◐条件, 备注: ★抗原构建体描述不是表位，不得挪用填入}
    专利状态:
      列: patent_status
      可填性: 无
      备注: ★即便作者同时是某专利发明人，其专利状态也不属于本条记录，不可挪用
  不可填:
    - 列: [tm_celsius, viscosity, aggregation, solubility, hydrophobicity, net_charge,
           glycosylation_sites, free_cysteine, immunogenicity_risk]
      原因: 功能类论文不做成药性表征
    - 列: [structure_template, complex_structure, prediction_confidence]
      原因: 无结构数据

可填字段_CAR:
  规范条目: 25
  tier1可填: 12    # 仅元数据 + 模块类型粗判
  tier2可填: 5     # 追加
  本源不可填: 8
  字段:
    元数据11:
      列: [uid, name_code, source_type, source_id, experiment_conditions,
           evidence_level, version, entry_date, citation, applicable_scenario, contrary_evidence]
      可填性: tier1 可填（experiment_conditions 与 applicable_scenario 须 tier2）
    模块类型: {列: module_type, 可填性: tier1 ◐粗判 / tier2 直给, 备注: tier1 只能由标题/concepts 粗判有无 CAR；模块清单须 tier2}
    来源分子: {列: source_molecule, 可填性: tier2 直给}
    序列: {列: sequence, 可填性: tier2 ◐条件（实际极少）, 备注: ★正文只给模块名不给序列}
    长度: {列: length_aa, 可填性: 需计算, 前置: 先有序列}
    装配规则: {列: assembly_rules, 可填性: tier2 直给, 备注: ★属 car.module 列；注意铰链/跨膜是否成对更换（HTM 整体替换不可拆开混搭）}
    可兼容模块: {列: compatible_modules, 可填性: tier2 ◐条件, rule: 由"该组合已成功表达且有功能"反推}
    不可兼容模块: {列: incompatible_modules, 可填性: tier2 ◐条件, 备注: ★"未验证混搭"≠"不兼容"}
    对表位距离的影响:
      列: epitope_distance_effect
      可填性: tier2 ◐条件
      前置: ★必须有构型对照（如 CD8HTM vs CD28HTM）
      备注: ★这是本源最有价值的一栏——六个源里只有构型对照类论文填得出。
             关键对照是"两构型表面 CAR 分子数相同"，它把差异锁定在几何而非表达量上
    对免疫突触的影响: {列: synapse_effect, 可填性: tier2 ◐条件, 前置: 同上}
    对紧张性信号的影响: {列: tonic_effect, 可填性: tier2 ◐条件, 前置: 同上, 备注: 阴性结论（"更换该模块不引入 tonic 风险"）同样有价值}
  不可填:
    - 列: [activation_speed, metabolic_state, expansion_capacity, memory_phenotype,
           persistence, exhaustion_risk, tonic_signaling]
      原因: |
        ★论文常测（记忆分型/耗竭/tonic/扩增），但属组合读出 → 归 DB1，不回填 B 库。
        且构型对照论文的结论多为"两构型无差异"，"无差异"不构成任何单个模块的属性值，
        填入反而误导。
    - 列: 几何长度
      原因: ★schema 无对应列。本源代价最大——构型对照论文的核心结论正是几何差异

可填字段_制造工艺:
  规范条目: 36
  tier1可填: 2     # 仅元数据 + 产品名粗判
  tier2可填: 26
  本源不可填: 8
  总述: ★与 EuropePMC 并列为 C 库的两大实质来源；原代 CAR-T 论文可给出全流程
  字段:
    元数据11: {列: [uid, name_code, source_type, source_id, experiment_conditions, evidence_level, version, entry_date, citation, applicable_scenario, contrary_evidence], 可填性: tier1/tier2 混合}
    T细胞来源:
      列: t_cell_source
      可填性: tier2 派生
      rule: 健康供者 leukopak → 异体；患者来源 → 自体
      备注: ★"研究用健康供者"与临床异体产品不是一回事；若下游按此栏筛"异体工艺"会大量误判，
             建议另设 研究用/临床用 区分列
    'CD4:CD8比例':
      列: cd4_cd8_ratio
      可填性: tier2 ◐条件
      备注: ★常见"分别报告两群指标却不给比例"（如 CAR 分子数 CD8+ 3906 / CD4+ 10,365），
             说明两群均被分析，只是比例数值未给 → 留 null，不得由分项数据自行折算
    起始细胞质量: {列: starting_quality, 可填性: tier2 直给, 备注: 供者数、分选方法与货号常齐全}
    激活方式: {列: activation_method, 可填性: tier2 直给, 备注: 磁珠类型、珠细胞比、去珠时间}
    试剂: {列: activation_reagents, 可填性: tier2 直给}
    载体类型: {列: vector, 可填性: tier2 直给, 备注: 另可记包装系统代次（三代 = Rev 独立质粒）}
    MOI: {列: moi, 可填性: tier2 ◐条件, 备注: 给出率约一半}
    转导条件: {列: transduction_condition, 可填性: tier2 直给, 备注: ★信息量最大的一栏——质粒配比、转染试剂、换液与收毒时间、polybrene 浓度}
    培养体系: {列: culture_system, 可填性: tier2 直给, 备注: 基础培养基 + 全部添加剂 + 培养器具（如 G-Rex）}
    细胞因子组合: {列: cytokines, 可填性: tier2 直给}
    培养时长: {列: culture_days, 可填性: tier2 ◐条件, 备注: ★须是明确总时长；"选择期 N 天"不得挪用}
    冻存条件: {列: cryo_condition, 可填性: tier2 ◐条件, 备注: 冻存液品名 + 细胞密度}
    表型: {列: phenotype, 可填性: tier2 ◐条件, 备注: 阴性结论（"两构型无差"）也应记录}
    杀伤活性: {列: cytotoxicity, 可填性: tier2 直给, 备注: 测定平台/指标/靶细胞分层（按抗原密度高中低）}
    细胞因子释放: {列: cytokine_release, 可填性: tier2 直给}
    对应CAR产品: {列: [car_construct_uid, product_name], 可填性: tier1 ◐粗判 / tier2 派生}
    细胞活率:
      列: viability_pct
      可填性: tier2 ◐条件
      备注: ★"有方法无数值"高发栏——常只说用某仪器测且组间无差，不给百分数。
             此时方法记入 experiment_conditions，数值列留 null
    转导效率: {列: transduction_efficiency_pct, 可填性: tier2 ◐条件, 备注: 同上，常只给定性比较}
  不可填:
    - 列: [vcn]
      原因: 研究级几乎从不测载体拷贝数
    - 列: [cd3_positive_pct]
      原因: 起始虽已负选纯化 T 细胞，但终产品纯度通常不报
    - 列: [sterility, mycoplasma, endotoxin]
      原因: |
        ★研究级无成品放行三项。
        常见陷阱：论文的 endotoxin-free 多指质粒纯化试剂盒，不是终产品内毒素放行，不得挪用。
    - 列: [formulation]
      原因: 无终产品制剂配方（冻存液属 cryo_condition，不重复填）

notes: >
  OpenAlex 本体只给书目元数据 → A/B/C 专属字段全空，主用于发现/去重。
  但 OA 条目可经 best_oa_location.pdf_url 取全文 PDF 再深抽，届时 A/B/C 大量字段可被填补
  （实测 W4402816281 即走此两级路径）。功能属性按设计归 DB1，不进 B 库。
