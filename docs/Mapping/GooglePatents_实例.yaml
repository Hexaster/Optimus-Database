# =========================================================
# Part 6 — 派生规则标识
# =========================================================
rule_refs:
  parse_car_claim:
    description: 从权利要求书中定位 CAR 权利要求，并判定其限定到哪一层
    rule: |
      检索 "chimeric antigen receptor" 开头的独立/从属权利要求；
      逐字判定是否限定骨架模块（hinge / transmembrane / costimulatory / CD3 zeta）。
      仅限定识别域者标 paper_car = true。
    guard: ★不得把 Fc / 免疫偶联物条款（本件 claim 7-13）误读为 CAR 骨架
  resolve_seq_id_refs:
    description: 把 claim 中的 "SEQ ID NO:n" 解析为说明书序列段的实际氨基酸序列
    guard: PDF 文本层 OCR 不可靠，须与官方 SEQ 列表或 BQ 序列数据集交叉校验
  separate_prior_art_antibodies:
    description: 区分"本专利的 binder"与"说明书引用/排除的第三方抗体"
    rule: |
      出现 "the antibody molecule is not X" / "X binds ... (Ref et al.)" 句式者，
      判为现有技术，不得作为本专利记录的属性入库。
    example: 'GCC:B10 / GCC:4D7 / GCC:C8 → 现有技术，排除'


# =========================================================
# Part 7 — 已知风险
# =========================================================
risks:
  - id: R1
    severity: P0
    desc: |
      旧版本本档存在两处实质错误（见档头更正 1、2），均已由 PDF 全文逐字核对修正：
      ① 把第三方被排除抗体 B10/4D7/C8 的表位挂到 MS7/MS20 名下；
      ② 种属反应性填反（原文为"与啮齿类无实质交叉"，旧版填"人鼠交叉"）。
      教训：专利说明书大量陈述现有技术与"实施方式"，抽取时必须区分
      「本专利的技术方案」与「背景/排除项」，否则会系统性污染 A 库。
      建议把 separate_prior_art_antibodies 规则加入 QC 强校验。
  - id: R2
    severity: P1
    desc: |
      "纸面 CAR" 入库口径未定。claim 17 只限定识别域，若为其建 car.car 行，
      则该行 5 个模块外键有 4 个悬空、full_sequence 与 validated_function 全空，
      在 B 库里与 CARTiBASE/文献那种"模块齐全"的构建体混排会拉低整体可用性。
      建议：为 construct 增 completeness 标（claimed_only / modules_named / full_sequence），
      或专利 CAR 只入 car.car 的识别域行，不建 construct。
  - id: R3
    severity: P1
    desc: |
      PDF 文本层 OCR 存在字符混淆（Q 被识别为 O、V 被识别为 W，
      如 WVRQT→WVROT、LQMSSL→LOMSSL）。VH/VL 序列若直接取 pdftotext 结果入库，
      会引入静默的序列错误，且下游比对不会报错、只会静静地对不上。
      必须改由官方序列表（SEQ listing）或 Google Patents Public Data 的序列数据集取。
  - id: R4
    severity: P2
    desc: |
      legal_status = granted 取自 BQ 快照，且 BQ 数据集滞后一个季度以上。
      本件 2013-04-26 申请（临时案 2012-04-26），名义届满约 2033 年，
      但维持费是否缴纳、有无提前失效未查。专利状态用于商业决策前须查实时法律状态。
  - id: R5
    severity: P1
    desc: |
      靶点 GCC/GUCY2C 正是本项目靶点，且 VH/VL 全序列齐全 →
      本条是 A 库最有价值的正样本之一（S 级）。
      但同一靶点的另一条实例（OpenAlex/GUCY2C 文献）用的是 Clone 5F9，与 MS7/MS20 不同源，
      两者不可归并；entity_key 按 name 区分，注意勿被"同靶点"误合并。
  - id: R6
    severity: P1
    desc: |
      最新 schema 已用 binder.binder.fr_cdr_regions JSON 统一承载 FR/CDR。
      本条 VH/VL 齐全，跑 ANARCI 后须按区域名写 JSON，不能恢复成旧版六个标量列。
