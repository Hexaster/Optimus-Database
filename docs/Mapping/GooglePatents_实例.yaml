# =========================
# Instance: US9156915B2 -> A / B / C
# =========================
# 只回答一件事：这一件专利抽出来的值，如何变成数据库字段。
# 不描述如何获取数据（见 1_数据源登记/GooglePatents.yaml），
# 不描述目标库结构、类型、约束（见 sql/03_binder.sql、04_car.sql、05_process.sql）。
#
# 【2026-08-21 逐字核对，两处实质更正】
# 更正 1（严重）：旧版本把 GCC:B10 / GCC:4D7 / GCC:C8 当作本专利的"表位克隆"，并据此
#   填了表位 "B10=前63aa, 4D7=491-568"。核对说明书原文：这三者是第三方既有抗体
#   （Nandi 1997 / Vijayachandra 2000 / Bakre 2000），且本专利明确排除之——
#   原文 "In an embodiment, the antibody molecule is not GCC:B10, GCC:4D7 or GCC:C8."
#   → 它们是被排除的现有技术，不是本专利的 binder，其表位不得填入本条 A 库记录。
# 更正 2（严重）：旧版本填 种属反应性 = "人+鼠 GCC(交叉)"，与原文相反。
#   原文 "the anti-GCC antibody molecule fails to show substantial cross reaction with
#   one or both of rat GCC and mouse GCC." → 为人 GCC 特异、与啮齿类无实质交叉。
# 沿用旧版本已做对的一处更正：claim 17 仅限定识别域，不含 hinge/TM/共刺激/CD3ζ；
#   早前误记的 IgG1 hinge/CH2CH3 + 免疫受体跨膜，实为 Fc/免疫偶联物条款（claim 7-13），非 CAR。

instance_id: uspto_US9156915B2_to_abc
