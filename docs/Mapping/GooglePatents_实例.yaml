# =========================================================
# Part 1 — 原文取证（逐条可回溯到 PDF 全文）
# =========================================================
raw_evidence:
  - key: claim_17
    verbatim: >-
      17. A chimeric antigen receptor comprising a light chain variable region and a heavy
      chain variable region of an anti-GCC antibody molecule, the chimeric antigen receptor
      comprising: a) heavy chain variable region Amino Acid Sequence SEQ ID NO:1 from
      anti-GCC antibody MS7, and light chain variable region Amino Acid Sequence SEQ ID NO:2
      from anti-GCC antibody MS7; or b) heavy chain variable region Amino Acid Sequence
      SEQ ID NO:3 from anti-GCC antibody MS20, and light chain variable region Amino Acid
      Sequence SEQ ID NO:4 from anti-GCC antibody MS20; wherein the chimeric antigen receptor
      binds to human guanylyl cyclase C.
    locator: Claims，claim 17
    note: ★通篇唯一的 CAR 权利要求。只限定识别域 + 结合活性，无任何骨架模块。
  - key: hybridoma_origin
    verbatim: >-
      Two hybridomas have been developed which secrete mouse monoclonal antibodies specific
      for the extracellular domain of GCC. These monoclonal antibodies, MS7 (IgG1k) and
      MS20 (IgG2ak), generated from BALB/c mice
    locator: 说明书，Detailed Description
    note: 同时给出三件事——鼠源(BALB/c)、亚型(IgG1κ / IgG2aκ)、结合区(GCC 胞外域)
  - key: no_rodent_cross_reaction
    verbatim: >-
      In an embodiment, the anti-GCC antibody molecule fails to show substantial cross
      reaction with one or both of rat GCC and mouse GCC.
    locator: 说明书
    note: ★与旧版本记载相反，见档头更正 2
  - key: domain_exclusion
    verbatim: >-
      In another embodiment, an anti-GCC antibody molecule does not bind the kinase homology
      domain or the guanylyl cyclase domain of GCC.
    locator: 说明书
    note: 与 hybridoma_origin 合起来构成本专利对结合区的全部描述（胞外域，非 KHD/GC 域）
  - key: prior_art_disclaimer
    verbatim: 'In an embodiment, the antibody molecule is not GCC:B10, GCC:4D7 or GCC:C8.'
    locator: 说明书
    note: ★B10/4D7/C8 是被排除的第三方抗体，见档头更正 1
  - key: prior_art_epitopes
    verbatim: >-
      GCC:B10 binds to the first 63 amino acids of GCC (Nandi et al., J. Cell. Biochem.
      66:500-511 (1997)). GCC:4D7 binds to the kinase homology domain, within residues
      491-568 of GCC (Bhandari et al. Biochemistry 40:9196-9206 (2001)).
    locator: 说明书，背景技术
    note: |
      ★这两条表位属于 B10/4D7 这两个第三方抗体，不属于 MS7/MS20。
      若要入库，应作为独立的 binder 记录（来源=所引文献），且须标为现有技术；
      绝不可挂在本专利的 MS7/MS20 名下。本档选择不入库，仅记录于此备查。
  - key: seq_id_1
    verbatim: 'MS7 heavy chain variable region (SEQ ID NO:1): EVMLVESGGGLVKPGGSLKLSCAASGFTFSTYAMSWVRQT...LQMSSLRSEDTAMYYCTRLRQIGLRGFSDYWGQGTTLTVSS'
    locator: 说明书序列段
  - key: seq_id_2
    verbatim: 'MS7 light chain variable region (SEQ ID NO:2): DIDILMTQSPSSMYASLGERVTITCKASHDIKSYLSWYQQ...ESDDTATYYCLQHGESPYTFGGGTKLEIK'
    locator: 说明书序列段
  - key: seq_id_3
    verbatim: 'MS20 heavy chain variable region (SEQ ID NO:3): EVQLEESGPELVKPGASVKMSCKASGYTFTDYVISWVKQR...MQLSSLTSEDSAVYFCTRNYGSFYALDYWGQGTSVTVSS'
    locator: 说明书序列段
  - key: seq_id_4
    verbatim: 'MS20 light chain variable region (SEQ ID NO:4): DIDILMTQSPATLSVTPGDRVSLSCRASQSIRDYLHWYQH...EPEDVGVYYCQNGHSFPTFGGGTKLEIK'
    locator: 说明书序列段
  - key: scfv_embodiment
    verbatim: >-
      14. The anti-GCC antibody molecule of claim 3, wherein said antigen-binding fragment
      of an antibody that binds to human guanylyl cyclase C is a single chain variable
      fragment (scFv).
    locator: Claims，claim 14
    note: scFv 是权利要求覆盖的实施形态之一，但未给出 linker 序列或 VH/VL 朝向
  - key: agonist_embodiment
    verbatim: 'In some embodiments... the antibody molecule is an agonist of GCC (see, e.g., US2004/0258687).'
    locator: 说明书
    note: ★这是"实施方式"表述加外部引用，不是本专利实测数据；置信度低


# =========================================================
# Part 2 — A 库映射（binder.binder）
# =========================================================
# 本源在 A 库是 S 级正样本：VH/VL 全序列 + 专利状态齐全，且靶点 GCC 正是本项目靶点。
# 按 Binder 字段规范 47 栏逐栏对齐。
# ★本源在 A 库是 S 级正样本：VH/VL 全序列 + 专利状态齐全，且靶点 GCC 正是本项目靶点。
targets_binder:
  - tables: [binder.binder, binder.binder_evidence]
    field_routing: "entity fields -> binder.binder; source/measurement fields -> binder.binder_evidence; IDs linked by binder_id"
    record_per_source: two              # MS7 与 MS20 各一行
    entity_key: [name, target_antigen]
    records:
      - {name: MS7,  vh: 'SEQ ID NO:1', vl: 'SEQ ID NO:2', isotype: IgG1κ}
      - {name: MS20, vh: 'SEQ ID NO:3', vl: 'SEQ ID NO:4', isotype: IgG2aκ}

    # ===== 公共元数据 11 栏 =====
    metadata_fields:
      - {platform_primary_key: true, method: platform}
      - {target: name, method: derived, value: 'MS7 / MS20', note: ★不得把被排除的 B10/4D7/C8 并入本栏，见档头更正 1}
      - {target: source_type, method: constant, value: patent}
      - {target: source_id, method: constant, value: US9156915B2, note: 规范要求"专利号"}
      - target: experimental_conditions
        method: constant
        value: null
        note: ★专利不披露实验条件（无 SPR/BLI/流式条件）；不适用而非漏抽
      - {target: evidence_level, method: constant, value: 专利预印本, note: 'evidence_level 以文本保存；★即便是授权专利也不升级为 同行评议'}
      - target: version
        method: derived
        value: 'B2（授权公告本）；另有 A1 申请公开本 US 2013/0315923'
        note: ★专利的"版本"就是文献类型代码，B2 与 A1 内容可能不同，须记明用的是哪一本
      - {target: entry_date, method: platform, note: 不得用授权日 2015-10-13 冒充录入日}
      - {target: citation, method: derived, value: 'Waldman SA, Magee MS, Snook AE. ANTI-GCC ANTIBODY MOLECULES. US 9,156,915 B2, granted 2015-10-13. Assignee: Thomas Jefferson University. SEQ ID NO:1-4；claim 17；说明书 Detailed Description。'}
      - {target: applicable_scenario, method: derived, value: '结直肠癌 GCC 靶向；MS7/MS20 可用作抗体、免疫偶联物（claim 7-13）或 CAR 识别域（claim 17）三种形态'}
      - target: contrary_evidence
        method: derived
        value: '说明书明述本发明抗体不与大鼠/小鼠 GCC 实质交叉 → 与"人鼠交叉"的任何记载相矛盾，以本件原文为准'
        note: ★本栏少见地有值：旧版本曾据误读填"人鼠交叉"，此处留痕以防再犯

    # ===== 序列 4 栏 =====
    sequence_fields:
      - target: vh_sequence
        method: direct
        source: ['SEQ ID NO:1（MS7）', 'SEQ ID NO:3（MS20）']
        note: ★PDF 文本层有 OCR 混淆（Q↔O、V↔W），入库前须以官方 SEQ 列表或 BQ 序列数据集校核，见 R3
      - {target: vl_sequence, method: direct, source: ['SEQ ID NO:2（MS7）', 'SEQ ID NO:4（MS20）']}
      - target: scfv_sequence
        method: constant
        value: null
        note: |
          ★claim 14 覆盖 scFv 实施形态，但说明书未给 scFv 全序列，也未给 VH/VL 朝向。
          由 VH/VL 拼接 scFv 属我方构造，不是来源数据，不得填入本栏。
      - {target: linker, method: constant, value: null, note: 未给 linker 序列}
      - {unmapped_legacy_field: format, method: constant, value: IgG, note: 'MS7/MS20 本体是完整单抗（IgG1κ / IgG2aκ）；claim 14 另覆盖 scFv 形态但无序列，故不另建行'}

    # ===== 编号 / 注释 7 栏 =====
    annotation_fields:
      - target: numbering_scheme
        method: constant
        value: null
        note: ★编号体系由我方 pipeline 决定（跑 ANARCI），不得因专利用某体系描述就写死
      - target: 'fr_cdr_regions'
        method: constant
        value: null
        status: 待计算
        note: VH/VL 已到手；跑 ANARCI 后按 JSON 键保存 FR/CDR 区域
      - target: cdr_lengths
        method: constant
        value: null
        note: ★VH/VL 已到手 → 跑 ANARCI 即可算出，属可执行的下一步而非死缺口
      - {target: vdj_genes, method: constant, value: null, note: 同上，可由序列比对推得}
      - {target: germline_origin, method: derived, value: 鼠源（BALB/c 杂交瘤）, source_ref: hybridoma_origin}
      - {target: somatic_mutations, method: constant, value: null}

    # ===== 靶点 / 表位 4 栏 =====
    target_fields:
      - {target: target_antigen, method: constant, value: 'GCC / GUCY2C（human guanylyl cyclase C）'}
      - target: epitope
        method: constant
        value: null
        note: |
          ★说明书未给 MS7/MS20 的表位残基。见档头更正 1——
          "前 63 aa" 属 GCC:B10、"491-568" 属 GCC:4D7，两者均为被本专利排除的第三方抗体，
          其表位绝不可挪用到本条记录。
      - {target: epitope, method: constant, value: 未知, note: 原文无线性/构象判定依据}
      - {target: binding_site, method: derived, value: 'GCC 胞外域（extracellular domain）；说明书明述不结合 kinase homology 域与 guanylyl cyclase 域', source_ref: [hybridoma_origin, domain_exclusion]}

    # ===== 亲和力 5 栏 =====
    affinity_fields:
      - target: [kd, kon, koff, measurement_method, measurement_conditions]
        method: constant
        value: null
        note: ★通篇无数值亲和力、无 SPR/BLI 测定描述——这是专利源的典型缺口（专利给序列，不给数值）

    # ===== 特异性 2 栏 =====
    specificity_fields:
      - target: cross_reactivity_protein
        method: derived
        value: '蛋白水平：说明书明述与大鼠/小鼠 GCC 无实质交叉反应。细胞水平：未做。'
        note: ★规范要求区分蛋白水平与细胞水平；本件只有蛋白/分子层面陈述，且是"无交叉"的阴性陈述
      - {target: species_reactivity, method: derived, value: 人 GCC 特异；与大鼠/小鼠 GCC 无实质交叉, source_ref: no_rodent_cross_reaction}

    # ===== 成药性 10 栏 =====
    developability_fields:
      - target: [tm, viscosity, aggregation_tendency, solubility, hydrophobicity,
                 charge, glycosylation_sites, free_cysteines, immunogenicity_ada_risk]
        method: constant
        value: null
        note: 专利不披露成药性表征
      - target: humanization_level
        method: derived
        value: 未人源化（SEQ ID NO:1-4 为鼠源序列）
        note: ★说明书另述人源化方法，但未给出人源化后的序列，故只记鼠源事实，不得记为"已人源化"

    # ===== 结构 3 栏 =====
    structure_fields:
      - {target: [structure_template, complex_structure], method: constant, value: null, note: 无结构数据}

    # ===== 状态 / 功能 3 栏 =====
    status_fields:
      - {unmapped_legacy_field: development_stage, method: constant, value: 专利申请阶段（无临床阶段标注）}
      - {unmapped_legacy_field: patent_status, method: constant, value: granted, note: '以 BQ legal_status 为准；★维持费/失效状态需另查实时法律状态，见 R4'}
      - {unmapped_legacy_field: in_vitro_readout, method: derived, value: 'GCC agonist（说明书"实施方式"表述并引外部文献 US2004/0258687，非本件实测数据）', confidence: 低}


# =========================================================
# Part 3 — B 库映射（car.car + car.car）
# =========================================================
# 按 CAR 结构库字段规范 25 栏逐栏对齐。
# ★本源在 B 库很弱："纸面 CAR"——claim 17 只限定识别域，25 栏里过半是"权利要求根本没写"。
targets_car:
  - analysis_scope: [car.car.modules, car.car_evidence]
    analysis_only: true
    record_per_source: one              # 只有识别域一个模块
    entity_key: [source_id, module_type, source_molecule]

    # ===== 元数据 11 栏 =====
    metadata_fields:
      - {platform_primary_key: true, method: platform}
      - {target: name, method: derived, value: 'MS7-识别域@US9156915B2 / MS20-识别域@US9156915B2'}
      - {target: source_type, method: constant, value: patent}
      - {target: source_id, method: constant, value: US9156915B2}
      - {target: experimental_conditions, method: constant, value: null, note: 专利无实验条件}
      - {target: evidence_level, method: constant, value: 专利预印本}
      - {target: version, method: constant, value: 'B2（授权公告本）'}
      - {target: entry_date, method: platform}
      - {target: citation, method: derived, value: 'US 9,156,915 B2, claim 17 与 SEQ ID NO:1-4。'}
      - {target: applicable_scenario, method: derived, value: '为 GCC CAR 提供有法律保护的识别域序列；使用前须做 FTO 分析'}
      - {target: contrary_evidence, method: constant, value: false}

    # ===== 标识 4 栏 =====
    identity_fields:
      - {target: modules, method: constant, value: 识别域}
      - {target: modules, method: derived, value: 'MS7（VH=SEQ1/VL=SEQ2）或 MS20（VH=SEQ3/VL=SEQ4）'}
      - {target: modules, method: derived, rule: 取 Part 2 的 vh_sequence / vl_sequence, note: ★专利源的强项——识别域序列齐全}
      - {target: modules, method: derived, rule: 由序列实算, note: 规范的"长度（残基数）"}

    absent_modules:
      note: |
        ★claim 17 未限定下列任何模块，故本源不产出对应 car.car 行：
        信号肽、linker、铰链、跨膜区、共刺激域、CD3ζ、标签、安全开关。
        这是"claimed only"的典型形态——法律上覆盖，技术上无骨架可入库。

    # ===== 功能属性 7 栏 =====
    functional_fields:
      - target: [activation_speed, metabolic_state, expansion_capacity,
                 memory_phenotype, persistence, exhaustion_risk, tonic_signaling_tendency]
        method: constant
        value: null
        status: 权利要求未写
        note: |
          ★专利无任何 CAR 功能数据。且这 7 栏主要描述共刺激域属性，
          而本件根本没有共刺激域模块 → 语义上是 not_applicable，
          QC 计缺失率时不应与"文献做了实验但没报"同等对待。

    # ===== 铰链/跨膜几何属性 =====
    geometry_fields:
      - target: geometric_length
        method: constant
        value: null
        status: 不适用
        note: 最新 schema 有此列，但本件未披露铰链/跨膜模块或物理长度
      - target: [epitope_distance_effect, immune_synapse_effect, tonic_signaling_effect]
        method: constant
        value: null
        status: 权利要求未写
        note: 本件无铰链/跨膜模块，这三栏天然不适用

    # ===== 组合约束 3 栏 =====
    assembly_fields:
      - target: assembly_rules
        method: derived
        value: 'claim 17 仅限定「识别域(VH+VL) + 结合人 GCC」；无骨架模块顺序可记'
        note: |
          ★assembly_rules 是 car.car 的列（04_car.sql 第 39 行），非 car.car 的列。
          本件此栏的内容实质是"限定范围声明"而非真正的装配顺序。
      - target: compatible_modules
        method: constant
        value: null
        note: |
          ★claim 17 对骨架不设限，法律上等于"与任意骨架兼容"——
          但那是权利范围而非技术验证，绝不可填入 compatible_modules（会被下游误读为已验证兼容）。
      - {target: incompatible_modules, method: constant, value: null}

  - tables: [car.car, car.car_evidence]
    field_routing: "name/modules/version/entry_date -> car.car; source/performance/constraint fields -> car.car_evidence; IDs linked by car_id"
    record_per_source: zero
    decision: 不建行
    caveat: claim 17 只给 binder、未给任何合法 backbone module；modules 为 NOT NULL，故最新 schema 下不能建占位 CAR
    legacy_placeholder_fields:
      - {target: name, method: derived, value: 'US9156915B2-CAR-MS7 / US9156915B2-CAR-MS20'}
      - {target: source_type, method: constant, value: patent}
      - {target: source_id, method: constant, value: US9156915B2}
      - {target: evidence_level, method: constant, value: 专利预印本}
      - {target: experimental_conditions, method: constant, value: null}
      - {target: version, method: constant, value: 'B2（授权公告本）'}
      - {target: entry_date, method: platform}
      - {target: citation, method: derived, value: 'US 9,156,915 B2, claim 17。'}
      - {target: applicable_scenario, method: derived, value: 'FTO / 专利布局分析用；不具备可实施的构建体信息'}
      - {target: contrary_evidence, method: constant, value: false}
      - {unmapped_legacy_field: binder_uid, method: derived, rule: 指向 Part 2 的 MS7 / MS20 binder 实体}
      - {target: modules, method: constant, value: null, note: 识别域不属于最新 car.car.modules，无法满足 NOT NULL}
      - unmapped_legacy_fields: [linker_module_uid, hinge_module_uid, tm_module_uid,
                 costim_module_uid, cd3z_module_uid]
        method: constant
        value: null
        note: ★car.car 共 6 个模块外键，本条 5 个悬空——只有识别域槽位有值
      - {unmapped_legacy_field: full_sequence, method: constant, value: null}
      - {unmapped_legacy_field: vector_backbone, method: constant, value: null}
      - {unmapped_legacy_field: logic, method: constant, value: 无}
      - {unmapped_legacy_field: validated_function, method: constant, value: null, note: 无任何 CAR 层面功能验证数据}
      - {unmapped_legacy_field: risk_tags, method: derived, value: '["paper_car_claimed_only", "no_backbone_modules", "no_functional_data"]'}


# =========================================================
