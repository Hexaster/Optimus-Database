source_name: Addgene
domain: car_db                 # 质粒库：CAR 构建体(GenBank 全序列)，B 池全靶点
入口_API:
  endpoint: https://www.addgene.org/{id}/                 # 主页面元数据(免登录)
  method: web_download                                    # 无公开 API(/api、api.addgene.org 均404)
  authentication: account                                 # 逐模块序列 GenBank 需免费账号
  credential_env: ADDGENE_COOKIE
  序列route: https://www.addgene.org/{id}/sequences/       # genbank / fasta / snapgene
文件格式: [html]            # 直接下载：主页面元数据 HTML(免登录)
抽取:
  可用格式: [genbank, fasta]  # 序列抽取目标(各模块坐标/全序列)
  获取步骤: 元数据抓 HTML(免登录)；逐模块序列 → 免费登录 + /{id}/sequences/ 下 GenBank
  额外成本: 序列需免费账号；实体质粒受 MTA(本项目仅要序列，不受限)
版本或快照: {mode: rolling, version_source: 每质粒 Addgene-full(验证版)/Depositor-full, snapshot_date: null}
更新频率: {upstream: continuous, project_check: quarterly}
取样验证:
  verified: true                                          # 实测 #135992
  verification_sample: 'plasmid 135992 (pSLCAR-CD19-BBz)：gene/insert=FMC63-41BB-3z-P2A-EGFP，Alt name 明写 "Contains: FMC63-scFV, Hinge domain, CD28-transmembrane domain, 41BB-ITD, CD3z-ITD"；vector backbone=pSL(Lentiviral)/promoter=EF1a-short/resistance=Ampicillin 100 μg/mL/depositor=Scott McComb/Publication=Bloemberg et al 2020(PubMed 32083149) 全部存在'
  # ⚠跨膜区是 CD28 不是 CD8；铰链页面只写 "Hinge domain" 未指明来源分子，不得推断
  verified_at: 2026-08-19
# 质粒 = CAR 构建体 → 主填 B(CAR)；scFv 内含 → Binder◐；载体信息 → 工艺仅"载体类型"
# ---------------------------------------------------------------
# 可填性词表（三个 可填字段_* 小节通用）
#   直给   = 源页面/档案直接给出该值，无需加工
#   派生   = 由源字段按规则推出（rule 写明）
#   需另取 = 需再发一次请求/换一种档案才有（登录、PDF、补充材料）
#   需计算 = 需跑工具才有（ANARCI 编号、序列比对、坐标切分）
#   ◐条件 = 只有部分条目/部分论文有
#   不适用 = 该字段对本源的记录类型语义上不成立（≠缺失）
#   无     = 本源任何路径都给不出
#   平台   = 由库自身管理（uid/entry_date/source_weight 等）
# ---------------------------------------------------------------

可填字段_Binder:
  规范条目: 47      # 对应 sql/03_binder.sql 的 54 个业务列
  本源可填: 18
  本源不可填: 36
  字段:
    名称代号:
      列: name_code
      可填性: 直给
      来源位置: 'Gene/Insert → Alt name（"Contains: FMC63-scFV"）'
      覆盖率: 全部条目
      成本: 免登录 HTML
      置信度: 高
      备注: 取的是 scFv 克隆名（FMC63），不是质粒名；质粒名归 car.construct.name_code
    来源类型:
      列: source_type
      可填性: 派生
      rule: 恒为 公开库（core.source_type 枚举）
    来源ID:
      列: source_id
      可填性: 直给
      来源位置: 质粒号（规范所称"登录号"）
      rule: '"Addgene " + 质粒号'
    实验条件:
      列: experiment_conditions
      可填性: 不适用
      备注: 质粒库不做实验，无实验条件可记——非漏抽
    证据等级:
      列: evidence_level
      可填性: 派生
      来源位置: Publication 栏
      rule: 有对应同行评议发表 → 同行评议（weight 0.7）；无发表的存放质粒应降为 专利预印本 或另议
      覆盖率: ◐条件（并非每条质粒都有发表）
    版本:
      列: version
      可填性: 需另取
      来源位置: 序列页的版本标识（Addgene-full 验证版 / Depositor-full 存放者提供版）
      成本: 需免费登录
      备注: ★两种版本可信度不同——Addgene-full 经过测序验证，Depositor-full 未必；取序列时必须同时记版本
    录入日期:
      列: entry_date
      可填性: 平台
      备注: DEFAULT current_date；不得用质粒存放日或发表日冒充
    引用:
      列: citation
      可填性: 直给
      来源位置: Publication 栏（作者/期刊/卷页/DOI）+ PubMed 链接
      覆盖率: ◐条件
    适用场景:
      列: applicable_scenario
      可填性: 派生
      来源位置: Purpose + Backbone → Modifications to backbone
      备注: 本源少见地有实质内容（如"模块化骨架，BpiI 单管换识别域"）
    相反证据:
      列: contrary_evidence
      可填性: 无
    VH序列:
      列: vh_seq
      可填性: 需另取 + 需计算
      来源位置: /{id}/sequences/ 的 GenBank 全序列
      成本: 需免费登录 + 接受 Affinity Reagent Sequence Policy；再按 features 坐标切出 scFv，再拆 VH/VL
      置信度: 高（切分正确的前提下）
      备注: ★本源在 A 库的全部价值都压在这一步；不登录则 A 库只有元数据
    VL序列: {列: vl_seq, 可填性: 需另取 + 需计算, 同: VH序列}
    scFv全序列:
      列: scfv_seq
      可填性: 需另取
      来源位置: GenBank features 中识别域区段
      备注: 比 VH/VL 少一步——只需按 features 切出，不需再拆链
    linker:
      列: linker
      可填性: 需计算
      rule: 从 scFv 序列中识别 (G4S)n 等柔性接头
    编号体系:
      列: numbering
      可填性: 需计算
      备注: ★由我方 pipeline 决定（跑 ANARCI 时选定），不由来源决定，不得写死常量
    'FR/CDR 区':
      列: '[cdr_h1, cdr_h2, cdr_h3, cdr_l1, cdr_l2, cdr_l3] —— ★FR 无列'
      可填性: 需计算
      前置: 先取到 VH/VL
      备注: ★schema 只有 CDR 六列，无 FR 列——ANARCI 同时产出的 FR 会被丢弃
    CDR长度: {列: cdr_lengths, 可填性: 需计算, 前置: 同上}
    'V(D)J基因': {列: vdj_genes, 可填性: 需计算, 前置: 同上, rule: germline 比对}
    胚系来源:
      列: germline
      可填性: 需计算
      备注: 页面 Species 栏是"插入基因来源物种"，★不等于胚系来源，不得挪用
    体细胞突变: {列: somatic_mutations, 可填性: 需计算, 前置: 同上}
    靶抗原:
      列: target_antigen
      可填性: 直给
      来源位置: 'Gene/Insert → Alt name（"CD19(FMC63)-CAR"）'
      覆盖率: 全部 CAR 类质粒
      成本: 免登录
      置信度: 高
      备注: ★此栏原标 ◐ 属低估，页面直接给出，无需推断
    格式:
      列: format
      可填性: 派生
      rule: 'Alt name 中的 "scFV"/"VHH"/"nanobody" 等词 → binder_format 枚举'
    种属反应性:
      列: species_reactivity
      可填性: ◐条件
      来源位置: Gene/Insert → Species
      置信度: 低
      备注: ★该栏是"插入基因取自哪个物种"，不是跨物种结合谱。挪用会造成系统性错误，建议留空
    开发临床阶段:
      列: development_stage
      可填性: 派生
      rule: 质粒工具 → 临床前
    专利状态: {列: patent_status, 可填性: 无}
  不可填:
    - 列: [epitope_position, epitope_kind, binding_site]
      原因: 页面只给靶抗原名，不做表位定位
    - 列: [kd_nm, kon_m1s1, koff_s1, measure_method, measure_condition, cross_reactivity]
      原因: 质粒库无任何亲和力/特异性测定数据
    - 列: [tm_celsius, viscosity, aggregation, solubility, hydrophobicity, net_charge,
           glycosylation_sites, free_cysteine, humanization, immunogenicity_risk]
      原因: 无成药性表征
    - 列: [structure_template, complex_structure, prediction_confidence]
      原因: 无结构数据
    - 列: [in_vitro_readout]
      原因: 页面 Citations（16 Articles）只是引用计数，不是功能读出，不得挪用

可填字段_CAR:
  规范条目: 25
  本源可填: 17
  本源不可填: 12
  字段:
    元数据11:
      列: [uid, name_code, source_type, source_id, experiment_conditions,
           evidence_level, version, entry_date, citation, applicable_scenario, contrary_evidence]
      可填性: 同 可填字段_Binder 的对应栏
      备注: experiment_conditions=不适用；contrary_evidence=无；其余可填
    模块类型:
      列: module_type
      可填性: 直给
      来源位置: 'Gene/Insert → Alt name 的 "Contains: ..." 清单'
      覆盖率: ◐条件（并非每条质粒都写 Contains 清单）
      成本: 免登录
      备注: ★这是本源最省力的一栏——模块清单以逗号分隔直接给出，无需 NLP
    来源分子:
      列: source_molecule
      可填性: 直给 + 交叉验证
      来源位置: Alt name 的模块名 + Entrez Gene 栏（CD247/CD28/TNFRSF9）
      置信度: 高
      备注: ★Entrez Gene 栏可独立验证模块来源分子，是本源少见的双重佐证
      陷阱: 未写来源的模块（如仅写 "Hinge domain"）必须填 未指明，禁止推断
    序列:
      列: sequence
      可填性: 需另取
      来源位置: GenBank features 各模块区段
      成本: 需登录
    长度:
      列: length_aa
      可填性: 需计算
      前置: 先取序列
      rule: 由 features 坐标区间实算，无序列不得估计
    装配规则:
      列: assembly_rules
      可填性: 直给
      来源位置: Alt name 的 Contains 清单顺序 + GenBank features 坐标
      备注: ★assembly_rules 属 car.module（04_car.sql:39），不在 car.construct
    可兼容模块:
      列: compatible_modules
      可填性: 直给
      来源位置: Backbone → Modifications to backbone
      覆盖率: ◐条件（仅模块化设计的骨架有）
      备注: ★本源少见地真给出兼容性规则（如 BpiI 单管换识别域）；落库为 jsonb 需待对方模块 uid
    不可兼容模块: {列: incompatible_modules, 可填性: 无}
  不可填:
    - 列: [activation_speed, metabolic_state, expansion_capacity, memory_phenotype,
           persistence, exhaustion_risk, tonic_signaling]
      原因: ★质粒库无功能读出；且这些是"CAR×细胞×靶细胞"组合读出，按设计归 DB1，不回填本表
    - 列: [epitope_distance_effect, synapse_effect, tonic_effect]
      原因: 几何效应需构型对照实验才可归因，单条质粒给不出
    - 列: 几何长度
      原因: ★schema 无对应列（car.module 只有 length_aa）——规范条目落不了库

可填字段_制造工艺:
  规范条目: 36
  本源可填: 2
  本源不可填: 34
  建行建议: ★不建议单独建 process 行——22 个业务列只有 vector 一栏有值，接近空行
  字段:
    载体类型:
      列: vector
      可填性: 派生
      来源位置: Backbone → Vector type（"Mammalian Expression, Lentiviral"）
      rule: 'Lentiviral → 慢病毒；Retroviral → 逆转录病毒（process.vector_type 枚举）'
      置信度: 高
    对应CAR产品:
      列: car_construct_uid
      可填性: 派生
      rule: 指向本质粒建立的 car.construct
  元数据11:
    列: [uid, name_code, source_type, source_id, experiment_conditions,
         evidence_level, version, entry_date, citation, applicable_scenario, contrary_evidence]
    可填性: 技术上可填（同 可填字段_Binder 的对应栏）
    备注: ★但业务列全空时，元数据齐全并无意义——故本源不建 process 行，这 11 栏一并不产出
  无列可落但页面有值:
    note: ★以下页面确有值、规范未列、schema 亦无列，本轮丢弃；建议在 process 侧补列
    项:
      - {值: 'promoter = EF1a-short', 用途: 表达强度/工艺复现}
      - {值: 'bacterial resistance = Ampicillin 100 μg/mL', 用途: 筛选条件}
      - {值: 'growth strain = NEB Stable；copy number = High Copy；37°C', 用途: 扩增质粒的操作条件}
      - {值: 'cloning sites = BpiI / BpiI (destroyed during cloning)', 用途: 换模块的可操作性}
  不可填:
    - 列: [t_cell_source, cd4_cd8_ratio, starting_quality, activation_method,
           activation_reagents, moi, transduction_condition, culture_system,
           cytokines, culture_days, cryo_condition, formulation]
      原因: 质粒记录不含任何细胞/培养信息
    - 列: [viability_pct, transduction_efficiency_pct, vcn, cd3_positive_pct,
           phenotype, sterility, mycoplasma, endotoxin, cytotoxicity, cytokine_release]
      原因: 无制备/放行/功能指标
    - 列: [product_name]
      原因: 质粒是工具不是产品

notes: >
  主页面元数据免登录可抓；逐模块序列 GenBank 需免费登录 + 接受 Affinity Reagent Sequence Policy。
  ⚠许可：页面 Industry Terms = "Not Available to Industry"，Ordering 栏写明
  "available to academics and nonprofits only"。本项目为商业合作，实体质粒按字面不可获取；
  序列数据是否同受限取决于 Affinity Reagent Sequence Policy 条款，落地前须法务复核
  ——不可默认"只要序列就不受限"。规模 ~58 条(搜 "chimeric antigen receptor")。
  无功能属性(激活/持久/耗竭)——那属 DB1 组合，非序列库能给。
