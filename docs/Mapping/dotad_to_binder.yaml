# =========================
# Mapping: DOTAD 2.0 -> binder.binder + binder.binder_evidence
# =========================
# 只回答一件事：DOTAD 2.0 的字段如何变成数据库字段。
# 不描述如何获取数据（见 docs/SourceRegistry/dotad.yaml），
# 不描述目标库结构、类型、约束（见 sql/03_binder.sql）。
#
# 【本档为重写，非增量修改（2026-08-20）】
# 旧版本按 DOTAD 1.0 的五档结构（metadata.xlsx / sequence.xlsx / clinical_trials.xlsx /
# experimental.xlsx / tools_integration.xlsx）编写，栏名已全部失效。
# 业务侧 2026-08-20 决定：按 2.0 重写，废弃 1.0。
# data/raw/dotad/ 下的 1.0 档案保留作历史，但不再是本映射的输入。

mapping_id: dotad2_to_binder
source_name: DOTAD 2.0
route_id: release_center
target_schema: sql/03_binder.sql → binder.binder + binder.binder_evidence
source_format: xlsx_workbooks
record_grain: >-
  metadata 分页的一条抗体记录，按 antibody_id 连接 sequences 分页；
  experimental 与 literature 两个工作簿另外产生一对多的成药性证据行。

status: draft
last_verified: 2026-08-20


# =========================================================
# Part 0 — 输入档案与连接关系
# =========================================================
# 全部为 2026-08-20 实测，档案存于 data/raw/dotad/20260824/v2.0/

source_datasets:

  metadata:
    file: data/raw/dotad/20260824/v2.0/dotad_antibody_metadata_sequences_v2.0.xlsx
    sheet: metadata
    header_row: 1
    record_key: [antibody_id]
    observed_rows: 4100
    observed_unique_id: 4100

  sequences:
    file: data/raw/dotad/20260824/v2.0/dotad_antibody_metadata_sequences_v2.0.xlsx
    sheet: sequences
    header_row: 1
    record_key: [antibody_id]
    observed_rows: 9845
    observed_unique_id: 9845
    join_to_metadata:
      type: left
      on: [antibody_id]
      rule: >-
        以 sequences 为主表（9,845 条有序列），左连 metadata。
        注意两表行数不同：metadata 4,100 条里只有 28.2% 有 Target。
        无 Target 的记录不得只凭序列相似性推断靶点，target_antigen 留 null。

  experimental:
    file: data/raw/dotad/20260824/v2.0/dotad_experimental_developability_v2.0.xlsx
    sheets: ['Assay Data - average ', 'Assay Data - average （2）', 'Assay Data - average（3）',
             'Assay Data - tidy format', 'Assay Data - tidy format(2)', 'Assay Data - tidy format（3）']
    record_key: [antibody_id]
    note: |
      average 与 tidy format 是同一批数据的两种形态（前者已聚合，后者逐次重复测量）。
      入库只取 tidy format —— average 的 _avg/_stddev/_replicates 是派生统计量，
      两者都灌会造成同一测量重复计数。

  literature:
    file: data/raw/dotad/20260824/v2.0/dotad_literature_developability_collection_v2.0.xlsx
    sheets: 30 个分页，每分页 = 一篇文献的抽取结果
    record_key: [antibody_id]
    index_sheet: link          # 30 列 × 3 栏：name / PMID / address，用于组装 citation

  data_dictionary:
    file: data/raw/dotad/20260824/v2.0/dotad_data_dictionary_v2.0.xlsx
    note: |
      不入库，但 parser 必须读：
      [Field Dictionary] 461 列 × 17 栏，逐字段给 unit / lower_bound / upper_bound /
        missing_value_rule / example_values —— 直接用作 QC 边界检查规则。
      [Assay Endpoint Dictionary] 35 列 × 14 栏，给 Harmonized_Endpoint /
        Endpoint_Unit / Comparable_Flag / Risk_Direction —— 用作跨文献指标归一化，
        见 Part 3 的 literature targets。


# =========================================================
# Part 1 — Source 字段清单（metadata + sequences）
# =========================================================
# fill 为 2026-08-20 实测非空率（'na' / 空 均计为空）。

source_field_inventory:

  metadata:
    - source: antibody_id
      fill: 100.0%
      example: DOTAD-001
      target: binder.binder_evidence.source_id
    - source: antibody_name
      fill: 28.4%
      uniq: 1165
      example: abagovomab
      target: binder.binder.name
      note: 只有 1,165 个抗体有名字；其余 2,935 条只有 ID
    - source: Format
      fill: 97.8%
      uniq: 103
      example: Whole mAb
      target: null
      method: not_mapped
      note: 最新 binder schema 不存储 format；保留作来源审计，不入库
    - source: hc_subtype
      fill: 29.5%
      example: G1
      target: null
      note: 恒定区亚型，非 V(D)J 基因。binder.binder 无对应列
    - source: lc_subtype
      fill: 29.8%
      example: Kappa
      target: null
      note: 轻链型别，本库无对应列
    - source: Highest_Clin_Trial
      fill: 28.2%
      example: Phase-III
      target: binder.binder_evidence.applicable_scenario
      method: derived
    - source: est_status_asof_feb2025
      fill: 27.7%
      example: Discontinued
      target: binder.binder_evidence.applicable_scenario
      method: derived
      note: |
        栏名自带截止日 feb2025 —— 该状态截至 2025-02，已过时约 18 个月。
        与 Highest_Clin_Trial 合并成一句，并在 experimental_conditions 注明截止日。
    - source: Target
      fill: 28.2%
      uniq: 540
      example: MUC16/CA125
      target: binder.binder.target_antigen
      method: derived
      rule: '"/" 分隔的通常是同一靶点的别名而非多靶点，需逐条判断'
    - source: Species
      fill: 26.9%
      example: Murine
      target: binder.binder.germline_origin
      method: derived
      note: 亦可作 humanization 的粗略参考，但 Murine≠人源化程度，不直接填 humanization
    - source: Clinical indication
      fill: 13.2%
      example: Cancers, ovarian
      target: binder.binder_evidence.applicable_scenario
    - source: PDB
      fill: 4.4%
      example: "<TAB>6v4p"
      target: binder.binder.structure_template
      method: derived
      rule: 值带前导制表符，必须 strip 后再入库
    - source: PDB_reference
      fill: 4.4%
      example: https://www.rcsb.org/structure/6v4p
      target: binder.binder_evidence.citation
      method: derived
    - source: ADAs_rate
      fill: 5.6%
      example: '68.1'
      target: binder.binder_evidence.immunogenicity_ada_risk
      method: derived
      rule: 数值为 ADA 阳性率百分比，入库写成 "ADA {value}%" 并保留原值
    - source: ADAs_reference
      fill: 5.6%
      target: binder.binder_evidence.citation
      method: derived
    - source: production_host
      fill: 0.0%
      target: null
      note: |
        【实测告警】该栏只有表头，4,100 列全为空。
        docs/SourceRegistry/dotad.yaml 曾把它列为「2.0 新增能力」，已更正。
        勿为它写 parser 分支。
    - source: tag
      fill: 0.0%
      target: null
      note: 同 production_host，全表为空

  sequences:
    - source: antibody_id
      fill: 100.0%
      target: binder.binder_evidence.source_id
    - source: antibody_name
      fill: 11.8%
      target: null
      note: 与 metadata.antibody_name 重复且填充率更低，以 metadata 为准
    - source: VH
      fill: 99.9%
      uniq: 7125
      target: binder.binder.vh_sequence
    - source: VL
      fill: 92.0%
      uniq: 3298
      target: binder.binder.vl_sequence
      note: 8% 无 VL。可能是 VHH/单域，也可能是缺失——不得默认当作 VHH，
            须与 Format 交叉判断序列语义；最新 binder schema 不再存储 format
    - source: hc_protein_sequence
      fill: 2.5%
      target: null
      note: 含信号肽的全长重链（例中以 MRAWIFFLLCLAGRALA 开头）。全长≠可变区，不得填 vh_sequence
    - source: lc_protein_sequence
      fill: 2.5%
      target: null
    - source: [hc_dna_sequence, lc_dna_sequence]
      fill: 3.3%
      target: null
      note: DNA 序列，本库只存氨基酸序列


# =========================================================
# Part 2 — binder.binder 中本源填不了的字段
# =========================================================
unmapped_target_columns:
  not_available:
    - scfv_sequence          # 有 VH/VL 但无 scFv 构建体序列
    - linker
    - numbering_scheme         # 未编号
    - fr_cdr_regions       # 无区域切分
    - cdr_lengths
    - vdj_genes
    - somatic_mutations
    - epitope
    - binding_site
    - glycosylation_sites
    - free_cysteines
    - humanization_level      # Species 只说来源物种，不得替代
    - viscosity
    - solubility
    - charge
    - cross_reactivity_protein
    - cross_reactivity_cell
    - species_reactivity
    - complex_structure # 只有 PDB ID（structure_template），无复合物链信息
  platform_managed:
    - version
    - entry_date


# =========================================================
# Part 3 — 可执行映射
# =========================================================
# metadata + sequences 产生一条 binder 实体；每个来源/测量产生独立 evidence。

targets:

  # ---------- (1) 实体行：metadata + sequences ----------
  - table: binder.binder
    record_per_source: one
    entity_key: [antibody_id]
    fields:
      - {target: binder_id, method: platform}
      - target: name
        source: metadata.antibody_name
        method: direct
      - target: vh_sequence
        source: sequences.VH
        method: direct
      - target: vl_sequence
        source: sequences.VL
        method: direct
      - target: target_antigen
        source: metadata.Target
        method: derived
        rule_ref: normalize_antigen_name
      - target: germline_origin
        source: metadata.Species
        method: direct
      - target: structure_template
        source: metadata.PDB
        method: derived
        rule: strip 前导制表符

  - table: binder.binder_evidence
    record_per_source: one
    entity_key: [antibody_id, metadata]
    fields:
      - {target: evidence_id, method: platform}
      - {target: binder_id, method: parent, references: binder.binder_id}
      - {target: source_type, method: constant, value: public_database}
      - {target: source_id, source: metadata.antibody_id, method: direct, required: true}
      - {target: evidence_level, method: constant, value: 同行评议}
      - target: applicable_scenario
        source: [metadata.Clinical indication, metadata.Highest_Clin_Trial,
                 metadata.est_status_asof_feb2025]
        method: derived
      - {target: immunogenicity_ada_risk, source: metadata.ADAs_rate, method: derived}
      - target: citation
        source: [metadata.PDB_reference, metadata.ADAs_reference]
        method: derived

  # ---------- (2) 证据行：experimental（实测成药性）----------
  - table: binder.binder_evidence
    record_per_source: many
    iterate_over: experimental 的 tidy format 三个分页，每行 × 每个指标栏
    entity_key: [antibody_id]
    fields:
      - {target: evidence_id, method: platform}
      - {target: binder_id, method: parent, references: binder.binder_id}
      - {target: source_type, method: constant, value: public_database}
      - {target: evidence_level, method: constant, value: 同行评议}
      - target: source_id
        source: [antibody_id, sheet_name, metric_name, technical_replicate]
        method: derived
        rule: '"{antibody_id}|{sheet}|{metric}|rep{n}"，保证行内唯一'
      - target: tm
        source: [tm1_nanodsf, tm2_nanodsf, tm3_nanodsf, tonset_nanodsf]
        method: derived
        rule: |
          取 tm1_nanodsf 为主值；tonset 是起始温度不是 Tm，不得混填。
          单位已是 °C，与 tm 一致，无需换算。
      - target: hydrophobicity
        source: [hic_rt, smac_rt, hac_rt]
        method: derived
        unit_from: min（色谱保留时间）
        note: |
          【单位不一致告警】hic_rt 等是保留时间（分钟），
          而 binder.binder_evidence.hydrophobicity 是 numeric 无量纲。
          直接灌入会让不同色谱条件的值不可比。
          须先按 Assay Endpoint Dictionary 的 Harmonized_Endpoint 归一化，
          并把原始指标名与单位写进 experimental_conditions。
      - target: aggregation_tendency
        source: ['sec_%monomer', 'acsins_dLmax_ph7.4', 'acsins_dLmax_ph6.0']
        method: derived
        rule: 'sec_%monomer 越低聚集越强；acsins_dLmax 反映自缔合。合成描述串'
      - target: experimental_conditions
        source: [sheet_name, metric_name, production_batch, run, technical_replicate]
        method: derived
        required: true
        note: 必填。缺了就无法区分同一抗体的多次测量

  # ---------- (3) 证据行：literature（文献抽取的成药性与亲和力）----------
  - table: binder.binder_evidence
    record_per_source: many
    iterate_over: literature 的 30 个分页 × 每行 × 每个指标栏
    entity_key: [antibody_id]
    fields:
      - {target: evidence_id, method: platform}
      - {target: binder_id, method: parent, references: binder.binder_id}
      - target: source_type
        method: constant
        value: literature
        note: 与 (1)(2) 不同——这批的原始出处是具体文献，不是公开库整编
      - target: evidence_level
        method: derived
        rule_ref: derive_evidence_level_literature
        note: |
          【本档唯一非 constant 的 evidence_level】
          绝大多数分页为「同行评议」，但下列分页是计算预测值，必须填「模型预测」：
            Hebditch et al.  —— 全部 13 个指标栏名以 .pred 结尾
            Bailly et al.    —— HIC.pred.15
          填错会让 evidence_level 分类被误改，直接污染下游打分。
      - target: source_id
        source: [link.PMID, antibody_id, metric_name]
        method: derived
      - target: citation
        source: [link.name, link.PMID, link.address]
        method: derived
        rule: 由 literature 工作簿的 [link] 分页按 sheet 名连接取得
      - target: kd
        source: ['Adams et al..fit_KD_median [M]', 'Jain et al.(2024) 的 Octet KD (M)']
        method: derived
        unit_from: M
        rule: 'nM = 原值 × 1e9'
        note: |
          【2.0 新增能力】1.0 时代本源填不了亲和力。
          Adams et al. 分页 10,970 列带 fit_KD_median/mean/min/max [M]，
          Jain et al.(2024) 带 Octet KD (M)。
          源单位是 M，目标列 kd 是 nM，必须换算，且 unit_from 必填。
      - target: tm
        source: 各分页的 Tm / Tm1 (C) / Fab Tm by DSF (°C) 等
        method: derived
        rule_ref: harmonize_endpoint
      - target: immunogenicity_ada_risk
        source: 'marks et al. 分页的 %ADA response'
        method: derived
      - target: experimental_conditions
        source: [sheet_name, metric_name, Harmonized_Endpoint, Endpoint_Unit, Condition]
        method: derived
        required: true


# =========================================================
# Part 4 — 派生规则标识
# =========================================================
rule_refs:
  normalize_antigen_name:
    description: 靶点名归一化；"/" 分隔的按别名处理而非多靶点
  harmonize_endpoint:
    description: 按 data_dictionary 的 [Assay Endpoint Dictionary] 把各分页指标名
                 映射到 Harmonized_Endpoint 与 Endpoint_Unit
    note: 只有 Comparable_Flag 为真的指标才允许跨文献合并
  derive_evidence_level_literature:
    description: literature 工作簿按分页判定 evidence_level
    rule: 指标栏名以 .pred 结尾，或分页属 {Hebditch et al., Bailly et al.} → 模型预测；否则 同行评议


# =========================================================
# Part 5 — 已知风险
# =========================================================
risks:
  - id: R1
    desc: |
      实体/证据两表结构下，literature 的 Adams et al. 分页有 10,970 列，
      全量灌入会在 binder.binder_evidence 中产生上万条测量记录。
      它们应按 binder_id 关联单一实体，不应当成重复实体归并。
      建议第一轮只灌 metadata + sequences 实体行，证据行按靶点筛选后再灌。
  - id: R2
    desc: |
      Target 填充率只有 28.2%。以序列为主表左连后，约 7 成记录的 target_antigen 为 null。
      对「给定靶点找 binder」这个主用例，本源实际可用的只有约 1,160 条。
  - id: R3
    desc: |
      hydrophobicity 的源值是色谱保留时间（分钟），目标列无量纲。
      未经 Harmonized_Endpoint 归一化就入库会产生不可比的数值。这是本档最易出错处。
  - id: R4
    desc: |
      Hebditch / Bailly 两个预测分页若误判为「同行评议」，evidence_level 分类会被误改。
      建议在 QC 加一条断言：source_id 含 .pred 的行，evidence_level 必须为 模型预测。
