db1:
  table: abc_combination_db1
  description: ABC組合數據庫 -- db1
  fields:
    combination_id:
      type: uuid
      key: primary
      nullable: false
    binder_id:
      type: uuid
      key: foreign
      references: binder.binder_id
      nullable: false
    car_id:
      type: uuid
      key: foreign
      references: car.car_id
      nullable: false
    manufacturing_id:
      type: uuid
      key: foreign
      references: manufacturing.manufacturing_id
      nullable: false
    similarity:
      type: any
      description: A+B組合蛋白質序列與其他蛋白質序列的相似度(處理方法待定)
      nullable: true
    completed_experiment_phase:
      type: string
      description: 已完成的實驗階段
      nullable: true
      allowed_values:
        # GPT provided
        - design_only # 僅設計/構建
        - in_vitro # 體外實驗
        - in_vivo # 動物實驗
        - preclinical # 臨床前安全性/IND 支持
        - clinical_phase_1
        - clinical_phase_2
        - clinical_phase_3
