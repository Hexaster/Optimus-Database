# measurement：保留定量结果的原始表达形式，Python 类型为 Measurement。
# 仅用于可能报告单值、范围、界限或 ± 的结果及工艺参数。
# 序列长度、残基位置、确定的序列一致性及固定评分仍用原有类型。
#
# 结构：
#   kind: 数值形式，见下方对应关系
#   value: 单一数值或中心值；统计含义按字段描述和 raw 保留
#   lower: 范围下限或大于比较的门槛
#   upper: 范围上限或小于比较的门槛
#   error: ± 后的数值，不得为负
#   unit: 这组结构化数值的实际单位；来源未注明或无量纲时填 null
#   raw: 原文，保留来源单位及报告的统计含义
#
# kind → 使用字段（其他数值子字段填 null）：
#   single_value → value
#   range → lower, upper（lower <= upper）
#   mean_with_standard_deviation → value, error（平均值 ± 标准差）
#   mean_with_standard_error → value, error（平均值 ± 标准误）
#   plus_minus_unspecified → value, error（原文未说明 ± 的含义）
#   greater_than / greater_than_or_equal → lower（> / >=）
#   less_than / less_than_or_equal → upper（< / <=）
#
# 未报告的可空 measurement 整项填 null；不以空对象代替。
# 即使只报告一个数值，也使用 kind: single_value，不直接填数字。
# 抽取时数值与 unit 按来源填写，不自行换算；未知单位不从 preferred_unit 补全。
# preferred_unit 仅为归一化偏好，不限制可保存的来源单位。
# 程序仅做已列明的固定倍率或偏移换算；不能换算时保留数值与实际单位，不置空或报 schema_mismatch。
# 换算时同步处理 value、lower、upper、error；error 仅按尺度换算，不加偏移；raw 不变。
# 数值检查按实际单位解释；0–100 的百分比上限只适用于 %。
# 单位相同不代表指标或分母相同；保持字段语义，分母及测量方法保留在实验条件中。
# 比较或筛选数值前须确认指标、分母及单位一致；无法归一化的记录不参与该次比较。
# 不取范围中点，不把 mean ± SD 转成范围，不猜测 ± 是 SD 还是 SEM。
# 多实体或多实验的汇总范围不能分配给其中某一个实体或实验。
# 示例（Kd，偏好单位 nM；仅示意结构）：
#   {kind: range, value: null, lower: 2, upper: 5, error: null, unit: nM, raw: '2–5 nM'}
#   {kind: mean_with_standard_deviation, value: 12, lower: null, upper: null, error: 2, unit: nM, raw: '12 ± 2 nM (mean ± SD)'}

evidence:
  table: evidence
  description: 合并 record、binder_evidence、car_evidence 和 manufacturing_evidence 的统一证据表。
  fields:
    record_id:
      type: uuid
      key: primary
      nullable: false
    source_type:
      type: string
      nullable: false
      description: 证据来源类型。
      allowed_values:
      - public_database
      - literature
      - patent
      - internal_data
      index: true
    source_id:
      type: string
      nullable: false
      description: 外部来源 ID，例如 DOI、专利号、数据库登录号或内部批次号。
      index: true
    citation:
      type: string
      nullable: true
      description: 该证据对应的引用信息。
    #evidence_level:
    #  type: number
    #  nullable: false
    #  description: 证据等级；内部实验 ＞ 同行评议 ＞ 文献 ＞ 模型预测，後續程序生成，不由模型填寫
    #  check: evidence_level >= 0 and evidence_level <= 1

    #experimental_conditions:
    #  type: json
    #  nullable: true
    #  description: 产生该证据时不在本schema内的实验条件
    
    applicable_scenario:
      type: string
      nullable: true
      description: 该条证据的结论在什么范围内成立——实验体系、受试对象来源、疾病或适应症、细胞类型、给药与分组条件中，原文明确限定的那些。写原文实际陈述的限定，不外推、不概括成一句泛泛的话；原文点名了患者来源、疾病种类或对照设置时要逐项写出。
      example: 适用 B-ALL, 儿童及青年

    contrary_evidence:
      type: boolean
      nullable: true
      description: 该记录是否属于与主要结论相反的证据。
      default: null
    time_of_upload:
      type: date
      description: 源數據上傳時間
    time_of_download:
      type: date
      description: 數據下載時間

    binder.binder_id:
      type: uuid
      key: foreign
      references: binder.binder_id
      description: 该证据对应的 Binder ID。
      nullable: true
      index: true

    binder.epitope:
      type: json
      shape: object
      nullable: true
      description: 表位
      item_schema:
        identified_area:
          type: string
          description: 抗原上被识别的那块区域
          example: "Ig 样 C2 型结构域 2"
        epitope_type:
          type: enum
          description: 线性表位还是构象表位
          allowed_values: 
            - 线性表位
            - 构象表位
        location:
          type: enum
          description: 离膜远近
          allowed_values:
            - 近膜端
            - 远膜端

    binder.binding_site:
      type: json
      shape: object
      nullable: true
      description: Binder 的结合位点信息
      item_schema:
        antigen_residues:
          type: json
          shape: array
          nullable: true
          description: 抗原侧参与结合界面的残基。
          item_schema:
            residue:
              type: string
              nullable: false
              description: 抗原侧残基，以单字母氨基酸代码加残基编号表示，例如 R163。
        binder_residues:
          type: json
          shape: array
          nullable: true
          description: Binder 侧参与结合界面的残基。
          item_schema:
            chain:
              type: string
              nullable: false
              description: 残基所属抗体链。
              allowed_values:
                - heavy
                - light
            region:
              type: string
              nullable: true
              description: 残基所属 FR/CDR 区域。
              allowed_values:
                - FR1
                - CDR1
                - FR2
                - CDR2
                - FR3
                - CDR3
                - FR4
            residue:
              type: string
              nullable: false
              description: Binder 侧残基，以单字母氨基酸代码加残基编号表示，例如 Y100。
        buried_surface_area:
          type: number
          nullable: true
          description: Binder-抗原结合界面的埋藏表面积。
          unit: Å²
          check: buried_surface_area >= 0

    binder.kd:
      type: measurement
      nullable: true
      description: 平衡解离常数 Kd。
      preferred_unit: nM
      check: "对 value、lower、upper 中每个非 null 的 x，要求 x >= 0"

    binder.kon:
      type: measurement
      nullable: true
      description: 结合速率常数 Kon。
      preferred_unit: 1/(M*s)
      check: "对 value、lower、upper 中每个非 null 的 x，要求 x >= 0"

    binder.koff:
      type: measurement
      nullable: true
      description: 解离速率常数 Koff。
      preferred_unit: 1/s
      check: "对 value、lower、upper 中每个非 null 的 x，要求 x >= 0"

    binder.measurement_method:
      type: string
      nullable: true
      description: 亲和力或动力学参数的测量方法。
      allowed_values:
      - SPR
      - BLI
      - other

    binder.measurement_conditions:
      type: json
      shape: object
      nullable: true
      description: Kd、Kon、Koff 等测量值对应的具体测量条件
      item_schema:
        temperature_c:
          type: number
          nullable: true
          description: 测量温度。实验进行时的温度，单位为摄氏度（°C）。
        ph:
          type: number
          nullable: true
          description: 缓冲液 pH。实验测量体系的 pH 值。
          check: 0 <= ph <= 14
        buffer:
          type: string
          nullable: true
          description: 缓冲液。实验测量所使用的缓冲液名称或组成。
        instrument:
          type: string
          nullable: true
          description: 测量仪器。用于进行亲和力或结合动力学测量的仪器名称或型号。
        immobilized_component:
          type: string
          nullable: true
          description: 固定化组分。实验中被固定在传感器、芯片或其他固相表面的组分。
          allowed_values:
            - binder
            - antigen
        analyte_component:
          type: string
          nullable: true
          description: 分析物组分。实验中以溶液形式流过或接触固定化组分的待测组分。
          allowed_values:
            - binder
            - antigen
        concentration_series:
          type: json
          shape: array
          nullable: true
          description: 分析物浓度系列。动力学或亲和力测量中使用的各分析物浓度。
          item_schema:
            value:
              type: number
              nullable: false
              description: 浓度数值。单个分析物浓度的数值。
              check: value >= 0
            unit:
              type: string
              nullable: true
              description: 分析物浓度数值的实际单位，按来源填写；未注明时为 null。
        flow_rate_ul_min:
          type: number
          nullable: true
          description: 流速。测量过程中溶液通过检测系统的流速，单位为 μL/min。
          check: flow_rate_ul_min >= 0
          unit: μL/min
        fitting_model:
          type: string
          nullable: true
          description: 拟合模型。用于根据实验数据计算结合动力学或亲和力参数的数学拟合模型。
          allowed_values:
            - "1:1"
            - bivalent_analyte
            - heterogeneous_ligand
            - steady_state
            - other

    binder.cross_reactivity_protein:
      type: json
      shape: array
      nullable: true
      description: 蛋白水平的交叉反应性信息
      item_schema:
        tested_protein:
          type: string
          nullable: false
          description: 交叉反应性实验中被检测的蛋白名称或标识。
        result:
          type: string
          nullable: true
          description: Binder 对该蛋白的交叉反应性检测结果。
          allowed_values:
            - positive
            - negative
            - weak
            - inconclusive
        measurement_value:
          type: measurement
          nullable: true
          description: 原始来源报告的交叉反应性定量测量值。
          preferred_unit: '%'

    binder.cross_reactivity_cell:
      type: json
      shape: array
      nullable: true
      description: 细胞水平的交叉反应性信息。
      item_schema:
        tested_cell:
          type: string
          nullable: false
          description: 交叉反应性实验中被检测的细胞名称或标识。
        result:
          type: string
          nullable: true
          description: Binder 对该细胞的交叉反应性检测结果。
          allowed_values:
            - positive
            - negative
            - weak
            - inconclusive
        measurement_value:
          type: measurement
          nullable: true
          description: 原始来源报告的交叉反应性定量测量值。
          preferred_unit: '%'

    binder.species_reactivity:
      type: json
      shape: array
      nullable: true
      description: 对人、鼠、猴等不同物种的反应性信息。
      item_schema:
        species:
          type: string
          nullable: false
          description: 物种名称。
        reactivity:
          type: string
          nullable: true
          description: 该物种对 Binder 的反应性。
          allowed_values:
            - positive
            - negative
            - weak
            - inconclusive

    binder.tm:
      type: measurement
      nullable: true
      description: 热稳定性指标 Tm。
      preferred_unit: °C

    binder.viscosity:
      type: measurement
      nullable: true
      description: 黏度
      check: "对 value、lower、upper 中每个非 null 的 x，要求 x >= 0"

    binder.aggregation_tendency:
      type: json
      shape: array
      nullable: true
      description: Binder 的聚集倾向实验测量或计算预测结果。
      item_schema:
        method:
          type: string
          nullable: false
          description: 聚集倾向的测量或预测方法，例如 SEC、AggScore 或 SAP。
        value:
          type: measurement
          nullable: false
          description: 原始来源报告的聚集倾向测量值或预测分数。

    binder.solubility:
      type: measurement
      nullable: true
      description: 溶解度
      preferred_unit: mg/mL
      check: "对 value、lower、upper 中每个非 null 的 x，要求 x >= 0"
      
    #binder.hydrophobicity:
    #  type: number
    #  nullable: true
    #  description: 疏水性

    # 疏水性
    binder.hic_retention_time:
      type: measurement
      nullable: true
      description: Binder 在疏水相互作用色谱（HIC）中的保留时间，用于表征其相对疏水行为。
      preferred_unit: min
      check: "对 value、lower、upper 中每个非 null 的 x，要求 x >= 0"

    binder.hydrophobic_patch_area:
      type: number
      nullable: true
      description: Binder 表面最大疏水补丁的表面积。
      unit: Å²
      check: hydrophobic_patch_area >= 0

    binder.hydrophobic_patch_location:
      type: string
      nullable: true
      description: 最大表面疏水补丁所在或邻近的结构区域，例如 CDR-H2、CDR-H3 或 VH/VL 界面。

    binder.sap_score:
      type: number
      nullable: true
      description: 来源明确报告的 Spatial Aggregation Propensity（SAP）评分。

    #binder.charge:
    #  type: number
    #  nullable: true
    #  description: 电荷

    # 電荷
    binder.isoelectric_point:
      type: measurement
      nullable: true
      description: Binder 的等电点（pI），即分子净电荷为零时对应的 pH。
      check: "对 value、lower、upper 中每个非 null 的 x，要求 0 <= x <= 14"

    binder.net_charge:
      type: number
      nullable: true
      description: Binder 在指定 pH 条件下的净电荷。

    binder.net_charge_ph:
      type: number
      nullable: true
      description: Binder 净电荷数值对应的 pH 条件。
      check: 0 <= net_charge_ph <= 14

    binder.immunogenicity_ada_risk:
      type: string
      nullable: true
      description: 免疫原性/抗药抗体（ADA）风险
      example: "预测 MHC-II 高亲和表位 3 个（集中于 linker 接缝处）；临床 ADA 阳性率 11 %（n=64）" # To be refined 

    car.car_id:
      type: uuid
      key: foreign
      references: car.car_id
      description: 该证据对应的 CAR backbone ID
      nullable: true
      index: true

    #car.activation_speed:
    #  type: string
    #  nullable: true
    #  description: CAR 激活速度
    #  example: "慢；IFN-γ 分泌 48-72 h 达峰（CD28 对照 12-24 h）" # To be refined

    # 激活速度
    car.activation_peak_time_min:
      type: number
      nullable: true
      description: 来源报告的 CAR-T 激活指标达到峰值的最早时间。
      unit: h
      check: activation_peak_time_min >= 0

    car.activation_peak_time_max:
      type: number
      nullable: true
      description: 来源报告的 CAR-T 激活指标达到峰值的最晚时间。
      unit: h
      check: activation_peak_time_max >= 0

    car.activation_readout:
      type: string
      nullable: true
      description: 用于判断 CAR-T 激活动力学的实验指标，例如 IFN-γ、IL-2、CD69 或 CD25。


    car.metabolic_state:
      type: string
      nullable: true
      description: CAR-T 细胞的代谢状态，例如糖酵解或氧化代谢
      allowed_values:
      - glycolytic
      - oxidative
      - both

    car.expansion_capacity:
      type: string
      nullable: true
      description: CAR-T 细胞的扩增能力
      example: "体外 day 10 扩增 45 倍；体内峰值 12 000 拷贝/µg gDNA（day 14）" # To be refined

    # CAR 与工艺使用相同的表型字段；仅在证据明确关联相应构型或工艺时记录，不自动互相复制。
    car.tscm_ratio:
      type: measurement
      nullable: true
      description: 干细胞样记忆 T 细胞（Tscm）的比例。raw 保留原文分母及门控定义，测量时间和方法记录在 experimental_conditions；合并亚型比例不拆分。
      preferred_unit: '%'

    car.tcm_ratio:
      type: measurement
      nullable: true
      description: 中央记忆 T 细胞（Tcm）的比例。raw 保留原文分母及门控定义，测量时间和方法记录在 experimental_conditions；合并亚型比例不拆分。
      preferred_unit: '%'

    car.tem_ratio:
      type: measurement
      nullable: true
      description: 效应记忆 T 细胞（Tem）的比例。raw 保留原文分母及门控定义，测量时间和方法记录在 experimental_conditions；合并亚型比例不拆分。
      preferred_unit: '%'

    car.teff_ratio:
      type: measurement
      nullable: true
      description: 效应 T 细胞（Teff）的比例。raw 保留原文分母及门控定义，测量时间和方法记录在 experimental_conditions；合并亚型比例不拆分。
      preferred_unit: '%'

    car.exhaustion_phenotype:
      type: string
      nullable: true
      default: null
      description: 细胞的耗竭表型，保留原文标志物组合、比例及门控细胞群；测量时间和方法记录在 experimental_conditions，不根据单个标志物推断功能状态。

    car.treg_phenotype:
      type: string
      nullable: true
      default: null
      description: 细胞的Treg 相关表型，保留原文标志物组合、比例及门控细胞群；测量时间和方法记录在 experimental_conditions，不根据单个标志物推断功能状态。

    car.persistence:
      type: measurement
      nullable: true
      preferred_unit: day
      description: CAR-T 细胞的持久性(中位可检出时长)
      

    car.tonic_signaling_tendency:
      type: string
      nullable: true
      description: CAR 的 tonic signaling 倾向
      example: "低；无抗原培养 7 天 CD69⁺ 6 %，基础 IFN-γ < 50 pg/mL" # To be refined

    car.binder_length:
      type: number
      nullable: true
      description: 这个模块把识别域顶出细胞膜多远
      unit: aa

    car.epitope_distance_effect:
      type: string
      nullable: true
      description: 构型对表位距离相关效果的影响
      example: "适配近膜表位（< 5 nm）"

    car.immune_synapse_effect:
      type: string
      nullable: true
      description: 构型对免疫突触形成或性质的影响
      example: "若配远膜表位则突触过宽、CD45 排除不全、杀伤下降约 40 %"

    car.tonic_signaling_effect:
      type: string
      nullable: true
      description: 构型对 tonic signaling 的影响
      example: "本铰链含 Cys，高密度表达时可致二聚化，tonic 风险 +"

    car.compatible_modules:
      shape: array
      type: json
      item_type: string
      nullable: true
      description: 已观察或报告为可兼容的模块组合
      example: ["MOD-0008 (CD8α TM)", "MOD-0031 (CD3ζ)"]

    car.incompatible_modules:
      shape: array
      type: json
      item_type: string
      nullable: true
      description: 已观察或报告为不兼容的模块组合

    #暫時不用
    #car.assembly_rules:
    #  type: string
    #  nullable: true
    #  description: CAR 模块装配规则或约束
    #  example: "位置: 跨膜区之后、CD3ζ 之前；每条 CAR 至多 1 个（双共刺激为例外，需显式标注为 3rd-gen）；两端不引入终止子，须保持读框" # To be refined


    manufacturing.manufacturing_id:
      type: uuid
      key: foreign
      references: manufacturing.manufacturing_id
      description: 该证据对应的制造工艺 ID。
      nullable: true
      index: true

    manufacturing.cell_viability:
      type: measurement
      nullable: true
      description: 细胞活率。
      preferred_unit: '%'
      check: "对 value、lower、upper 中每个非 null 的 x，要求 0 <= x <= 100"

    manufacturing.transduction_efficiency:
      type: measurement
      nullable: true
      description: 来源报告的转导效率。**判断依据是测量口径，不是原文的叫法**——凡实际以「CAR 表达阳性细胞比例」测得的（如流式 CAR⁺ 门内百分比），一律记录在 car_positive_ratio，本字段留空，即使原文把它称作 transduction efficiency。本字段只放以其他口径定义的转导效率（如 VCN、病毒滴度推算），并保留原文检测方法和分母。例：Figure 中流式图直印的「CAR⁺ 52.1%」→ 填 car_positive_ratio，本字段留空。
      preferred_unit: '%'
      check: "对 value、lower、upper 中每个非 null 的 x，要求 0 <= x <= 100"

    manufacturing.car_positive_ratio:
      type: measurement
      nullable: true
      description: 表达 CAR 的阳性细胞比例。raw 保留分母或门控细胞群；测量阶段、检测方法及直接检测或替代标志物记录在 experimental_conditions。不以 CD3+ 比例、VCN 或未说明检测定义的转导效率推算。仅存实测结果，不把放行门槛当作结果。
      preferred_unit: '%'
      check: "对 value、lower、upper 中每个非 null 的 x，要求 0 <= x <= 100"

    manufacturing.turbidity:
      type: json
      shape: object
      nullable: true
      description: 细胞制剂的浑浊程度。记录来源报告的观察或测量，不据此推断污染、无菌性或放行合格；培养液微生物检测结果不混入此处。
      item_schema:
        observation:
          type: string
          nullable: true
          default: null
          description: 原文报告的浑浊或澄清外观，例如轻微浑浊；不从定量值推断。
        value:
          type: measurement
          nullable: true
          description: 来源报告的定量浊度，保留实际单位；仅有文字观察时为空，不换算为 NTU 或其他方法的读数。
        method:
          type: string
          nullable: true
          default: null
          description: 原文检测方法或仪器；若报告光学读数，保留波长等条件。未报告时为空。

    manufacturing.ifn_gamma_release:
      type: measurement
      nullable: true
      description: 体外细胞功能试验的 IFN-γ（干扰素 γ）分泌或释放结果，保留实际指标和单位。experimental_conditions 记录刺激物或靶细胞及抗原状态、对照、E:T 比（适用时）、时长、方法及归一化基准。不得混入患者血清水平或将细胞内 IFN-γ 阳性比例当作释放量；不同刺激条件分别记录证据。仅存实测结果，不把放行门槛当作结果。
      preferred_unit: pg/mL

    manufacturing.vcn:
      type: measurement
      nullable: true
      description: 载体拷贝数（VCN）。
      preferred_unit: copies/cell
      check: "对 value、lower、upper 中每个非 null 的 x，要求 x >= 0"

    manufacturing.cd3_positive_ratio:
      type: measurement
      nullable: true
      description: CD3+ 细胞比例。
      preferred_unit: '%'
      check: "对 value、lower、upper 中每个非 null 的 x，要求 0 <= x <= 100"

    manufacturing.tscm_ratio:
      type: measurement
      nullable: true
      description: 干细胞样记忆 T 细胞（Tscm）的比例。raw 保留原文分母及门控定义，测量时间和方法记录在 experimental_conditions；合并亚型比例不拆分。
      preferred_unit: '%'

    manufacturing.tcm_ratio:
      type: measurement
      nullable: true
      description: 中央记忆 T 细胞（Tcm）的比例。raw 保留原文分母及门控定义，测量时间和方法记录在 experimental_conditions；合并亚型比例不拆分。
      preferred_unit: '%'

    manufacturing.tem_ratio:
      type: measurement
      nullable: true
      description: 效应记忆 T 细胞（Tem）的比例。raw 保留原文分母及门控定义，测量时间和方法记录在 experimental_conditions；合并亚型比例不拆分。
      preferred_unit: '%'

    manufacturing.teff_ratio:
      type: measurement
      nullable: true
      description: 效应 T 细胞（Teff）的比例。raw 保留原文分母及门控定义，测量时间和方法记录在 experimental_conditions；合并亚型比例不拆分。
      preferred_unit: '%'

    manufacturing.exhaustion_phenotype:
      type: string
      nullable: true
      default: null
      description: 细胞的耗竭表型，保留原文标志物组合、比例及门控细胞群；测量时间和方法记录在 experimental_conditions，不根据单个标志物推断功能状态。

    manufacturing.treg_phenotype:
      type: string
      nullable: true
      default: null
      description: 细胞的Treg 相关表型，保留原文标志物组合、比例及门控细胞群；测量时间和方法记录在 experimental_conditions，不根据单个标志物推断功能状态。

    manufacturing.sterility:
      type: boolean
      nullable: true
      description: 无菌检测结果；true 表示检测阳性（检出微生物），false 表示检测阴性，未报告为 null，不以 true 表示合格。

    manufacturing.mycoplasma:
      type: boolean
      nullable: true
      description: 支原体检测结果；true 表示检测阳性，false 表示检测阴性，未报告为 null。

    manufacturing.endotoxin:
      type: measurement
      nullable: true
      description: 内毒素检测结果
      preferred_unit: EU/mL

    manufacturing.killing_activity:
      type: json
      shape: object
      nullable: true
      description: 杀伤活性的实验条件与结果：条件记于 target_cell_line、effector_target_ratio、duration、method，结果记于 killing_rate。原文给出杀伤率时必须填 killing_rate，不得只记条件而丢结果——含 ">70%"、"a minimum of 90%" 这类带比较符的表述，按 measurement 的 kind 如实保留边界（minimum/at least 为 greater_than_or_equal，more than 为 greater_than）。仅记录原文，不同实验条件分别记录证据，未报告时为空。
      item_schema:
        target_cell_line:
          type: string
          nullable: true
          default: null
          description: 靶细胞系名称；若使用原代靶细胞，保留原文细胞名称，不编造细胞系。
        effector_target_ratio:
          type: measurement
          nullable: true
          description: 效应细胞数与靶细胞数之比（E:T）。明确报告 5:1 时 value 为 5，unit 为 E/T，raw 保留原文比例及效应细胞计数口径；未报告时为空，不推断。
        duration:
          type: measurement
          nullable: true
          description: 杀伤检测对应的效应细胞与靶细胞共培养时长，不以制造培养时长替代。
          preferred_unit: h
        method:
          type: string
          nullable: true
          default: null
          description: 原文报告的杀伤检测方法，如流式细胞术、LDH 释放法、荧光素酶法或实时阻抗法。
        killing_rate:
          type: measurement
          description: 对靶细胞的特异性杀伤率
          preferred_unit: '%'

    manufacturing.cytokine_release:
      type: json
      shape: array
      nullable: true
      description: 释放的其他细胞因子及其浓度；体外 IFN-γ 分泌或释放结果统一记录在 ifn_gamma_release，不在此重复。
      item_schema:
        cytokine:
          type: string
          nullable: false
          description: 检测的细胞因子名称。

        concentration:
          type: measurement
          nullable: false
          description: 该细胞因子的测量浓度。
          preferred_unit: pg/mL
          check: "对 value、lower、upper 中每个非 null 的 x，要求 x >= 0"
