# measurement：保留定量结果的原始表达形式，Python 类型为 Measurement。
# 仅用于可能报告单值、范围、界限或 ± 的结果及工艺参数。
# 序列长度、残基位置、确定的序列一致性及固定评分仍用原有类型。
#
# 结构：
#   kind: 数值形式，见下方对应关系
#   value: 单一数值或中心值；统计含义按字段描述和 raw 保留
#   lower: 范围下限或大于比较的门槛
#   upper: 范围上限或小于比较的门槛
#   error: ± 后的数值，不得为负
#   raw: 原文，保留来源单位及报告的统计含义
#
# kind → 使用字段（其他数值子字段填 null）：
#   single_value → value
#   range → lower, upper（lower <= upper）
#   mean_with_standard_deviation → value, error（平均值 ± 标准差）
#   mean_with_standard_error → value, error（平均值 ± 标准误）
#   plus_minus_unspecified → value, error（原文未说明 ± 的含义）
#   greater_than / greater_than_or_equal → lower（> / >=）
#   less_than / less_than_or_equal → upper（< / <=）
#
# 未报告的可空 measurement 整项填 null；不以空对象代替。
# 即使只报告一个数值，也使用 kind: single_value，不直接填数字。
# 结构化数值使用字段的 unit；单位可变时使用同层 unit。
# 未定义 unit 的字段从 raw 保留单位，不自行假定单位。
# 有目标单位但来源单位不明、无法确定性换算时填 null 并记录异常。
# 换算时同步处理 value、lower、upper、error；error 仅按尺度换算，不加偏移。
# 不取范围中点，不把 mean ± SD 转成范围，不猜测 ± 是 SD 还是 SEM。
# 多实体或多实验的汇总范围不能分配给其中某一个实体或实验。
# 示例（Kd，目标单位 nM；仅示意结构）：
#   {kind: range, value: null, lower: 2, upper: 5, error: null, raw: '2–5 nM'}
#   {kind: mean_with_standard_deviation, value: 12, lower: null, upper: null, error: 2, raw: '12 ± 2 nM (mean ± SD)'}

evidence:
  table: evidence
  description: 合并 record、binder_evidence、car_evidence 和 manufacturing_evidence 的统一证据表。
  fields:
    record_id:
      type: uuid
      key: primary
      nullable: false
    source_type:
      type: string
      nullable: false
      description: 证据来源类型。
      allowed_values:
      - public_database
      - literature
      - patent
      - internal_data
      index: true
    source_id:
      type: string
      nullable: false
      description: 外部来源 ID，例如 DOI、专利号、数据库登录号或内部批次号。
      index: true
    citation:
      type: string
      nullable: true
      description: 该证据对应的引用信息。
    evidence_level:
      type: number
      nullable: false
      description: 证据等级；内部实验 ＞ 同行评议 ＞ 文献 ＞ 模型预测
      check: evidence_level >= 0 and evidence_level <= 1

    experimental_conditions:
      type: json
      nullable: true
      description: 产生该证据时的实验条件。
    
    applicable_scenario:
      type: string
      nullable: true
      description: 该证据或结果适用的场景
      example: B-ALL, 儿童及青年

    contrary_evidence:
      type: boolean
      nullable: false
      description: 该记录是否属于与主要结论相反的证据。
      default: false
    time_of_upload:
      type: date
      description: 源數據上傳時間
    time_of_download:
      type: date
      description: 數據下載時間

    binder.binder_id:
      type: uuid
      key: foreign
      references: binder.binder_id
      description: 该证据对应的 Binder ID。
      nullable: true
      index: true

    binder.epitope:
      type: json
      nullable: true
      description: 表位
      item_schema:
        identified_area:
          type: string
          description: 抗原上被识别的那块区域
          example: "Ig 样 C2 型结构域 2"
        epitope_type:
          type: enum
          description: 线性表位还是构象表位
          allowed_values: 
            - 线性表位
            - 构象表位
        location:
          type: enum
          description: 离膜远近
          allowed_values:
            - 近膜端
            - 远膜端

    binder.binding_site:
      type: json
      nullable: true
      description: Binder 的结合位点信息
      item_schema:
        antigen_residues:
          type: json
          shape: array
          nullable: true
          description: 抗原侧参与结合界面的残基。
          item_schema:
            residue:
              type: string
              nullable: false
              description: 抗原侧残基，以单字母氨基酸代码加残基编号表示，例如 R163。
        binder_residues:
          type: json
          shape: array
          nullable: true
          description: Binder 侧参与结合界面的残基。
          item_schema:
            chain:
              type: string
              nullable: false
              description: 残基所属抗体链。
              allowed_values:
                - heavy
                - light
            region:
              type: string
              nullable: true
              description: 残基所属 FR/CDR 区域。
              allowed_values:
                - FR1
                - CDR1
                - FR2
                - CDR2
                - FR3
                - CDR3
                - FR4
            residue:
              type: string
              nullable: false
              description: Binder 侧残基，以单字母氨基酸代码加残基编号表示，例如 Y100。
        buried_surface_area:
          type: number
          nullable: true
          description: Binder-抗原结合界面的埋藏表面积。
          unit: Å²
          check: buried_surface_area >= 0

    binder.kd:
      type: measurement
      nullable: true
      description: 平衡解离常数 Kd。
      unit: nM
      check: "对 value、lower、upper 中每个非 null 的 x，要求 x >= 0"

    binder.kon:
      type: measurement
      nullable: true
      description: 结合速率常数 Kon。
      unit: 1/(M*s)
      check: "对 value、lower、upper 中每个非 null 的 x，要求 x >= 0"

    binder.koff:
      type: measurement
      nullable: true
      description: 解离速率常数 Koff。
      unit: 1/s
      check: "对 value、lower、upper 中每个非 null 的 x，要求 x >= 0"

    binder.measurement_method:
      type: string
      nullable: true
      description: 亲和力或动力学参数的测量方法。
      allowed_values:
      - SPR
      - BLI

    binder.measurement_conditions:
      type: json
      nullable: true
      description: Kd、Kon、Koff 等测量值对应的具体测量条件
      item_schema:
        temperature_c:
          type: number
          nullable: true
          description: 测量温度。实验进行时的温度，单位为摄氏度（°C）。
        ph:
          type: number
          nullable: true
          description: 缓冲液 pH。实验测量体系的 pH 值。
          check: 0 <= ph <= 14
        buffer:
          type: string
          nullable: true
          description: 缓冲液。实验测量所使用的缓冲液名称或组成。
        instrument:
          type: string
          nullable: true
          description: 测量仪器。用于进行亲和力或结合动力学测量的仪器名称或型号。
        immobilized_component:
          type: string
          nullable: true
          description: 固定化组分。实验中被固定在传感器、芯片或其他固相表面的组分。
          allowed_values:
            - binder
            - antigen
        analyte_component:
          type: string
          nullable: true
          description: 分析物组分。实验中以溶液形式流过或接触固定化组分的待测组分。
          allowed_values:
            - binder
            - antigen
        concentration_series:
          type: json
          nullable: true
          description: 分析物浓度系列。动力学或亲和力测量中使用的各分析物浓度。
          item_schema:
            value:
              type: number
              nullable: false
              description: 浓度数值。单个分析物浓度的数值。
              check: value >= 0
            unit:
              type: string
              nullable: false
              description: 浓度单位。分析物浓度数值对应的单位。
              allowed_values:
                - M
                - mM
                - uM
                - nM
                - pM
        flow_rate_ul_min:
          type: number
          nullable: true
          description: 流速。测量过程中溶液通过检测系统的流速，单位为 μL/min。
          check: flow_rate_ul_min >= 0
          unit: μL/min
        fitting_model:
          type: string
          nullable: true
          description: 拟合模型。用于根据实验数据计算结合动力学或亲和力参数的数学拟合模型。
          allowed_values:
            - 1:1
            - bivalent_analyte
            - heterogeneous_ligand
            - steady_state

    binder.cross_reactivity_protein:
      type: json
      nullable: true
      description: 蛋白水平的交叉反应性信息
      item_schema:
        tested_protein:
          type: string
          nullable: false
          description: 交叉反应性实验中被检测的蛋白名称或标识。
        result:
          type: string
          nullable: true
          description: Binder 对该蛋白的交叉反应性检测结果。
          allowed_values:
            - positive
            - negative
            - weak
            - inconclusive
        measurement_value:
          type: measurement
          nullable: true
          description: 原始来源报告的交叉反应性定量测量值。
          unit: '%'

    binder.cross_reactivity_cell:
      type: json
      nullable: true
      description: 细胞水平的交叉反应性信息。
      item_schema:
        tested_cell:
          type: string
          nullable: false
          description: 交叉反应性实验中被检测的细胞名称或标识。
        result:
          type: string
          nullable: true
          description: Binder 对该细胞的交叉反应性检测结果。
          allowed_values:
            - positive
            - negative
            - weak
            - inconclusive
        measurement_value:
          type: measurement
          nullable: true
          description: 原始来源报告的交叉反应性定量测量值。
          unit: '%'

    binder.species_reactivity:
      type: json
      nullable: true
      description: 对人、鼠、猴等不同物种的反应性信息。
      item_schema:
        species:
          type: string
          nullable: false
          description: 物种名称。
        reactivity:
          type: string
          nullable: true
          description: 该物种对 Binder 的反应性。
          allowed_values:
            - positive
            - negative
            - weak
            - inconclusive

    binder.tm:
      type: measurement
      nullable: true
      description: 热稳定性指标 Tm。
      unit: °C

    binder.viscosity:
      type: measurement
      nullable: true
      description: 黏度
      check: "对 value、lower、upper 中每个非 null 的 x，要求 x >= 0"

    binder.aggregation_tendency:
      type: json
      shape: array
      nullable: true
      description: Binder 的聚集倾向实验测量或计算预测结果。
      item_schema:
        method:
          type: string
          nullable: false
          description: 聚集倾向的测量或预测方法，例如 SEC、AggScore 或 SAP。
        value:
          type: measurement
          nullable: false
          description: 原始来源报告的聚集倾向测量值或预测分数。
        unit:
          type: string
          nullable: true
          description: 测量值对应的单位；无量纲预测分数可为空。

    binder.solubility:
      type: measurement
      nullable: true
      description: 溶解度
      unit: mg/mL
      check: "对 value、lower、upper 中每个非 null 的 x，要求 x >= 0"
      
    #binder.hydrophobicity:
    #  type: number
    #  nullable: true
    #  description: 疏水性

    # 疏水性
    binder.hic_retention_time:
      type: measurement
      nullable: true
      description: Binder 在疏水相互作用色谱（HIC）中的保留时间，用于表征其相对疏水行为。
      unit: min
      check: "对 value、lower、upper 中每个非 null 的 x，要求 x >= 0"

    binder.hydrophobic_patch_area:
      type: number
      nullable: true
      description: Binder 表面最大疏水补丁的表面积。
      unit: Å²
      check: hydrophobic_patch_area >= 0

    binder.hydrophobic_patch_location:
      type: string
      nullable: true
      description: 最大表面疏水补丁所在或邻近的结构区域，例如 CDR-H2、CDR-H3 或 VH/VL 界面。

    binder.sap_score:
      type: number
      nullable: true
      description: 来源明确报告的 Spatial Aggregation Propensity（SAP）评分。

    #binder.charge:
    #  type: number
    #  nullable: true
    #  description: 电荷

    # 電荷
    binder.isoelectric_point:
      type: measurement
      nullable: true
      description: Binder 的等电点（pI），即分子净电荷为零时对应的 pH。
      check: "对 value、lower、upper 中每个非 null 的 x，要求 0 <= x <= 14"

    binder.net_charge:
      type: number
      nullable: true
      description: Binder 在指定 pH 条件下的净电荷。

    binder.net_charge_ph:
      type: number
      nullable: true
      description: Binder 净电荷数值对应的 pH 条件。
      check: 0 <= net_charge_ph <= 14

    binder.immunogenicity_ada_risk:
      type: string
      nullable: true
      description: 免疫原性/抗药抗体（ADA）风险
      example: "预测 MHC-II 高亲和表位 3 个（集中于 linker 接缝处）；临床 ADA 阳性率 11 %（n=64）" # To be refined 

    car.car_id:
      type: uuid
      key: foreign
      references: car.car_id
      description: 该证据对应的 CAR backbone ID
      nullable: true
      index: true

    #car.activation_speed:
    #  type: string
    #  nullable: true
    #  description: CAR 激活速度
    #  example: "慢；IFN-γ 分泌 48-72 h 达峰（CD28 对照 12-24 h）" # To be refined

    # 激活速度
    car.activation_peak_time_min:
      type: number
      nullable: true
      description: 来源报告的 CAR-T 激活指标达到峰值的最早时间。
      unit: h
      check: activation_peak_time_min >= 0

    car.activation_peak_time_max:
      type: number
      nullable: true
      description: 来源报告的 CAR-T 激活指标达到峰值的最晚时间。
      unit: h
      check: activation_peak_time_max >= 0

    car.activation_readout:
      type: string
      nullable: true
      description: 用于判断 CAR-T 激活动力学的实验指标，例如 IFN-γ、IL-2、CD69 或 CD25。


    car.metabolic_state:
      type: string
      nullable: true
      description: CAR-T 细胞的代谢状态，例如糖酵解或氧化代谢
      allowed_values:
      - glycolytic
      - oxidative

    car.expansion_capacity:
      type: string
      nullable: true
      description: CAR-T 细胞的扩增能力
      example: "体外 day 10 扩增 45 倍；体内峰值 12 000 拷贝/µg gDNA（day 14）" # To be refined

    # 和manufacturing衝突？
    #car.memory_phenotype:
    #  type: string
    #  nullable: true
    #  description: CAR-T 细胞的记忆表型
    #  example: "Tscm 14 % / Tcm 48 % / Tem 31 % / Teff 7 %"

    car.persistence:
      type: measurement
      nullable: true
      unit: day
      description: CAR-T 细胞的持久性(中位可检出时长)
      

    car.exhaustion_risk:
      type: string
      nullable: true
      description: CAR-T 细胞的耗竭风险
      example: "低；day 14 三标志物共阳性 8 %（CD28 对照 34 %）；TOX 低表达" # To be refined


    car.tonic_signaling_tendency:
      type: string
      nullable: true
      description: CAR 的 tonic signaling 倾向
      example: "低；无抗原培养 7 天 CD69⁺ 6 %，基础 IFN-γ < 50 pg/mL" # To be refined

    car.binder_length:
      type: number
      nullable: true
      description: 这个模块把识别域顶出细胞膜多远
      unit: aa

    car.epitope_distance_effect:
      type: string
      nullable: true
      description: 构型对表位距离相关效果的影响
      example: "适配近膜表位（< 5 nm）"

    car.immune_synapse_effect:
      type: string
      nullable: true
      description: 构型对免疫突触形成或性质的影响
      example: "若配远膜表位则突触过宽、CD45 排除不全、杀伤下降约 40 %"

    car.tonic_signaling_effect:
      type: string
      nullable: true
      description: 构型对 tonic signaling 的影响
      example: "本铰链含 Cys，高密度表达时可致二聚化，tonic 风险 +"

    car.compatible_modules:
      shape: array
      type: string
      nullable: true
      description: 已观察或报告为可兼容的模块组合
      example: ["MOD-0008 (CD8α TM)", "MOD-0031 (CD3ζ)"]

    car.incompatible_modules:
      shape: array
      type: string
      nullable: true
      description: 已观察或报告为不兼容的模块组合

    #暫時不用
    #car.assembly_rules:
    #  type: string
    #  nullable: true
    #  description: CAR 模块装配规则或约束
    #  example: "位置: 跨膜区之后、CD3ζ 之前；每条 CAR 至多 1 个（双共刺激为例外，需显式标注为 3rd-gen）；两端不引入终止子，须保持读框" # To be refined


    manufacturing.manufacturing_id:
      type: uuid
      key: foreign
      references: manufacturing.manufacturing_id
      description: 该证据对应的制造工艺 ID。
      nullable: true
      index: true

    manufacturing.cell_viability:
      type: measurement
      nullable: true
      description: 细胞活率。
      unit: '%'
      check: "对 value、lower、upper 中每个非 null 的 x，要求 0 <= x <= 100"

    manufacturing.transduction_efficiency:
      type: measurement
      nullable: true
      description: 转导效率。
      unit: '%'
      check: "对 value、lower、upper 中每个非 null 的 x，要求 0 <= x <= 100"

    manufacturing.vcn:
      type: measurement
      nullable: true
      description: 载体拷贝数（VCN）。
      unit: copies/cell
      check: "对 value、lower、upper 中每个非 null 的 x，要求 x >= 0"

    manufacturing.cd3_positive_ratio:
      type: measurement
      nullable: true
      description: CD3+ 细胞比例。
      unit: '%'
      check: "对 value、lower、upper 中每个非 null 的 x，要求 0 <= x <= 100"

    #manufacturing.memory_phenotype:
    #  type: string
    #  nullable: true
    #  description: 产品细胞的记忆表型
    #  example: "Tscm 12 % / Tcm 44 %" # TBR

    #  description: 产品细胞的记忆表型
    manufacturing.tscm_ratio:
      type: measurement
      unit: '%'
    manufacturing.tcm_ratio:
      type: measurement
      unit: '%'
    manufacturing.tem_ratio:
      type: measurement
      unit: '%'
    manufacturing.teff_ratio:
      type: measurement
      unit: '%'

    manufacturing.exhaustion_phenotype:
      type: string
      nullable: true
      description: 产品细胞的耗竭表型
      example: "PD-1⁺LAG-3⁺ 9 %" # TBR

    manufacturing.treg_phenotype:
      type: string
      nullable: true
      description: 产品细胞的 Treg 相关表型。
      example: "CD4⁺CD25⁺FoxP3⁺ Treg 1.8 %" # TBR

    manufacturing.sterility:
      type: boolean
      nullable: true
      description: 无菌检测结果

    manufacturing.mycoplasma:
      type: boolean
      nullable: true
      description: 支原体检测结果

    manufacturing.endotoxin:
      type: measurement
      nullable: true
      description: 内毒素检测结果
      unit: EU/mL

    manufacturing.killing_activity:
      type: measurement
      nullable: true
      description: 对靶细胞的特异性杀伤率
      unit: '%'
      #example: "Nalm-6 靶细胞，E:T 5:1，24 h 特异杀伤 76 %（实时阻抗法）；放行标准 ≥ 40 %" # To be refined

    manufacturing.cytokine_release:
      type: json
      shape: array
      nullable: true
      description: 释放的细胞因子及其浓度。
      item_schema:
        cytokine:
          type: string
          nullable: false
          description: 检测的细胞因子名称。

        concentration:
          type: measurement
          nullable: false
          description: 该细胞因子的测量浓度。
          unit: pg/mL
          check: "对 value、lower、upper 中每个非 null 的 x，要求 x >= 0"
