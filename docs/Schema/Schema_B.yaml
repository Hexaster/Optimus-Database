car:
  table: car
  description: CAR 骨架核心实体表。一个经归一化后的 CAR backbone 对应一条记录；Binder 作为 A 实体独立管理，后续通过 ABC 组合关联。来源明确受体骨架相同时，不因额外共表达蛋白不同而新建 car_id；共表达蛋白记录在 evidence 的 car.coexpressed_proteins 中，不作为独立共表达蛋白加入 modules。
  fields:
    car_id:
      type: uuid
      key: primary
      description: 平台内部唯一 CAR backbone ID。
      nullable: false
    name:
      type: string
      description: CAR backbone 的名称或代号。
      nullable: true
    modules:
      type: json
      shape: array
      description: 按 CAR 中实际顺序保存的模块列表；每个模块记录模块类型、来源分子、序列与长度。Binder 识别域作为 A 实体独立管理，不参与 B 实体的 backbone 去重。
      item_schema:
        module_type:
          type: string
          description: CAR 模块类型。
          nullable: false
          allowed_values:
          - linker # 连接 CAR 不同模块的连接肽，不包含 Binder 内部连接 VH/VL 的 linker；后者写入 binder.linker。原文明确定义为 hinge 的部分仍归为 hinge。
          - hinge
          - transmembrane_region
          - costimulatory_domain
          - signaling_domain
          - tag
          - safety_switch
        source_molecule:
          type: string
          nullable: true
          description: 该模块来源分子。
        sequence:
          type: string
          nullable: true
          description: 该模块的氨基酸序列。
        length:
          type: integer
          nullable: true
          description: 该模块长度，以氨基酸残基数表示。
          unit: aa
          check: length >= 0
      nullable: false
