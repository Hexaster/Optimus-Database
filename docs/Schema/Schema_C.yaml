manufacturing:
  table: manufacturing
  description: 制造工艺核心实体表。每个产品/工艺版本对应一条记录。
  fields:
    manufacturing_id:
      type: uuid
      key: primary
      description: 平台内部唯一制造工艺 ID
      nullable: false

    name:
      type: string
      description: 制造工艺或工艺版本的名称/代号
      nullable: true

    t_cell_source:
      type: string
      nullable: true
      description: T 细胞来源
      allowed_values:
        - 自体
        - 异体

    cd4_cd8_ratio:
      type: number
      nullable: true
      description: 起始 CD4:CD8 比例

    starting_cell_quality:
      type: json
      nullable: true
      description: 起始细胞质量
      
    activation_method:
      type: string
      nullable: true
      description: T 细胞激活方式

    reagents:
      shape: array
      type: json
      nullable: true
      description: 制造过程中使用的关键试剂
      item_schema:
        reagent_name:
          type: string
          nullable: false
          description: 试剂名称
        reagent_type:
          type: string
          nullable: false
          description: 试剂类型
          allowed_values:
            - activation_reagent
            - cytokine
            - culture_medium
            - transduction_reagent
            - transfection_reagent
            - selection_reagent
            - cryopreservation_reagent
            - other

    vector_type:
      type: string
      nullable: true
      description: 用于基因导入的载体类型
      allowed_values:
        - 慢病毒
        - 逆转录病毒
        - 转座子
        - 电转

    moi:
      type: number
      nullable: true
      description: 感染复数（MOI）。
      check: moi >= 0

    transduction_transfection_conditions:
      type: json
      nullable: true
      description: 转导或转染条件
      example: "激活后 24 h 转导；RetroNectin 包被板；鱼精蛋白 10 µg/mL；32 ℃ 离心 1000×g 60 min；24 h 后换液" # To be refined

    culture_system:
      type: string
      nullable: true
      description: 细胞培养体系
      example: "封闭式自动化生物反应器，摇摆式灌流培养，起始 5×10⁷ 细胞 / 300 mL"

    cytokine_combination:
      type: json
      nullable: true
      description: 细胞因子组合
      item_schema:
        cytokine_name:
          type: string
          nullable: false
          description: 细胞因子名称
        concentration:
          type: number
          nullable: true
          description: 细胞因子浓度
          unit: ng/mL
          check: concentration >= 0

    culture_duration:
      type: number
      nullable: true
      description: 培养时长
      unit: day

    cryopreservation_conditions:
      type: json
      nullable: true
      description: 冻存条件
      example: "CryoStor CS10（10 % DMSO），程序降温 −1 ℃/min 至 −80 ℃，转液氮气相 ≤ −150 ℃"
      
    formulation:
      type: json
      nullable: true
      description: 制剂
      example: "输注袋 50 mL，1×10⁷ CAR⁺ 细胞/mL，目标剂量 2×10⁶ CAR⁺/kg，床旁解冻后直接输注"

    corresponding_car_product:
      type: string
      nullable: true
      description: 对应 CAR 构型/产品
