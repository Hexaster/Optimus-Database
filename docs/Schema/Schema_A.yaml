binder:
  table: binder
  description: >-
    Binder 核心实体表，ID 标识结合域；一个经实体归一化后的 Binder 对应一条记录。
    原文明确为同一结合域时，不因实验用 Fc 融合、纯化标签、表达载体或 CAR 展示方式不同而新建 Binder；
    测量分子格式及适用范围保存在 evidence.applicable_scenario，测量条件保存在相应证据字段。
    结合域自身序列或结构变化时，依据来源判断实体身份，不能仅凭相同克隆名合并。
    共享 Binder ID 不代表不同分子格式的测量结果可以互换。
  fields:
    binder_id:
      type: uuid
      key: primary
      description: 平台内部唯一 Binder ID。
      nullable: false

    name:
      type: string
      description: Binder 的名称或代号。
      nullable: true

    aliases:
      shape: array
      type: json
      item_type: string
      nullable: true
      description: 該 Binder 的其他名稱——指同一 binder 实体的其他称呼（克隆号、
        原文中的不同写法、文献别名）。不含包含该 binder 的上层对象：CAR 构建体、
        细胞产品、商品名都不是它的别名，那些关系由 car / manufacturing 表及外键表达。
        例：IC78 的别名是 "anti-CD19 IC78 scFv"；CABA19-IC78（构建体）和
        CABA-201（产品）不是别名。

    scfv_sequence:
      type: string
      nullable: true
      description: scFv 完整氨基酸序列（含 VL–linker–VH 或 VH–linker–VL 全长）。填了本字段并不代表 heavy_chain / light_chain / linker 可以留空——能从本序列识别出三段时，三个字段都要填，本字段仍保留全长。

    heavy_chain:
      type: json
      shape: object
      nullable: true
      description: 重链可变区（VH）序列。原文单独给出时完整保留，不裁切。若原文只给出完整 scFv 序列，按其中的柔性 linker（如 (G4S)3 / GGGGSGGGGSGGGGS）切分，把 linker 之后（VL–linker–VH 排布）或之前（VH–linker–VL 排布）的一段填入本字段，并把 linker 本身填入 linker、完整序列保留在 scfv_sequence——这属于按原文结构识别，不是「自行裁切」。无法确定排布方向时留空并记异常。
      item_schema:
        sequence:
          type: string
          nullable: false
          description: 原文提供的氨基酸序列。
        scope:
          type: string
          nullable: true
          allowed_values: [full_chain, variable_region, partial]
          default: null
          description: 序列范围，未报告时为 null；完整链标记 full_chain，其他局部片段标记 partial，无法判断时显式填 null，不单凭长度推断。

    light_chain:
      type: json
      shape: object
      nullable: true
      description: 轻链可变区（VL）序列。原文单独给出时完整保留，不裁切。若原文只给出完整 scFv 序列，按其中的柔性 linker 切分后取对应的一段填入本字段，规则与 heavy_chain 相同。
      item_schema:
        sequence:
          type: string
          nullable: false
          description: 原文提供的氨基酸序列。
        scope:
          type: string
          nullable: true
          allowed_values: [full_chain, variable_region, partial]
          default: null
          description: 序列范围，未报告时为 null；完整链标记 full_chain，其他局部片段标记 partial，无法判断时显式填 null，不单凭长度推断。

    linker:
      type: string
      nullable: true
      description: Binder 内部连接 VH 与 VL（或 VL 与 VH）的 linker 氨基酸序列；不包含 CAR 模块之间的连接肽，也不重复写入 car.modules。原文只给出 linker 类型或名称（如 GS linker、(G4S)3）而未给序列时，照记该名称，不因缺序列而留空。

    fr_cdr_regions:
      type: json
      shape: array
      nullable: true
      description: FR/CDR 区域及其位置或序列信息。**每项是一个区域**（链 + 区域名 + 序列或起止位置），不是一段叙述。原文没有给出任何区域的序列或位置时，本字段为 null。「CDR 移植到某框架」「保留了哪几个 CDR」这类人源化方法的描述不写在这里；移植所用的人源框架记在 germline_origin。
      item_schema:
        numbering_scheme:
          type: string
          nullable: false
          description: 抗体序列编号体系
          allowed_values:
            - IMGT
            - Kabat
            - Chothia
            - AHo
        chain:
          type: string
          allowed_values: [heavy, light]
          nullable: false
        region:
          type: string
          allowed_values: [FR1, CDR1, FR2, CDR2, FR3, CDR3, FR4]
          nullable: false
        sequence:
          type: string
          nullable: true
        start:
          type: integer
          nullable: true
          description: 相对于对应 heavy_chain.sequence 或 light_chain.sequence 的起始位置，1-based、包含端点；不是编号体系的残基标签，无法定位时为空。
        end:
          type: integer
          nullable: true
          description: 相对于同一条已存储序列的结束位置，1-based、包含端点；无法定位时为空。
        
    cdr_length:
      type: string
      nullable: true
      check: cdr_length >= 0
      description: 各 CDR 区域的长度
      example: "H1:8 H2:8 H3:13 L1:11 L2:3 L3:9"

    vdj_genes:
      type: string
      nullable: true
      description: V(D)J 基因信息
      example: "IGHV3-23*01 / IGHD3-10*01 / IGHJ4*02; IGKV1-39*01 / IGKJ1*01"
      
    germline_origin:
      type: string
      nullable: true
      description: 胚系来源
      example: "人源胚系 IGHV3-23"
    
    germline_origin_identity:
      type: number
      nullable: true
      description: 胚系來源同一性
      unit: '%'
      check: 0-100

    somatic_mutations:
      type: json
      shape: array
      nullable: true
      description: 体细胞突变信息
      item_schema:
        chain:
          type: string
          allowed_values:
            - heavy
            - light
        position:
          type: integer
        germline_aa:
          type: string
          pattern: "^[ARNDCQEGHILKMFPSTWYV]$"
        mutated_aa:
          type: string
          pattern: "^[ARNDCQEGHILKMFPSTWYV]$"

    target_antigen:
      type: string
      nullable: true
      description: Binder 的靶抗原
      index: true

    glycosylation_sites:
      shape: array
      type: json
      nullable: true
      description: 糖基化位点
      item_schema:
        chain:
          type: string
          nullable: false
          allowed_values:
            - heavy
            - light
        position:
          type: integer
          nullable: false
          check: position > 0
        glycosylation_type:
          type: string
          nullable: true
          allowed_values:
            - N-linked
            - O-linked
            - other
        motif:
          type: string
          nullable: true

    free_cysteines:
      shape: array
      type: json
      nullable: true
      description: 游离半胱氨酸信息
      item_schema:
        chain:
          type: string
          nullable: false
          allowed_values:
            - heavy
            - light
        position:
          type: integer
          nullable: false
          check: position > 0

    humanization_level:
      type: string
      nullable: true
      description: 人源化程度
      allowed_values:
        - non_human
        - chimeric
        - humanized
        - fully_human

    structure_template:
      type: json
      shape: array
      nullable: true
      description: Binder 结构建模时用作模板的**已解析实验结构**，每项必须有 PDB ID。原文只说「做了同源建模 / 用某服务器建模」却没给出模板的 PDB ID 时，本字段为 null。建模过程、建模软件、CDR 移植所用的抗体框架（如 4D5）都不是结构模板，不写在这里。
      item_schema:
        pdb_id:
          type: string
          nullable: false
          description: 用作结构建模模板的 PDB ID。

        chains:
          type: string
          nullable: true
          description: 用作结构建模模板的 PDB 链，例如 H/L。

        sequence_identity:
          type: number
          nullable: true
          description: Binder 与结构模板之间的序列一致性。
          unit: "%"
          check: 0 <= sequence_identity <= 100

    complex_structure:
      type: string
      nullable: true
      description: 複合物結構