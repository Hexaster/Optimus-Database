binder:
  table: binder
  description: Binder 核心实体表。一个经实体归一化后的 Binder 对应一条记录。
  fields:
    binder_id:
      type: uuid
      key: primary
      description: 平台内部唯一 Binder ID。
      nullable: false
    name:
      type: string
      description: Binder 的名称或代号。
      nullable: true
    scfv_sequence:
      type: string
      nullable: true
      description: scFv 完整氨基酸序列。
    vh_sequence:
      type: string
      nullable: true
      description: VH 氨基酸序列。
    vl_sequence:
      type: string
      nullable: true
      description: VL 氨基酸序列。
    linker:
      type: string
      nullable: true
      description: 连接 VH 与 VL 的 linker 序列。
    numbering_scheme:
      type: string
      nullable: true
      description: 抗体序列编号体系，例如 IMGT、Kabat。
    fr_cdr_regions:
      type: json
      nullable: true
      description: FR/CDR 区域列表及其位置或序列信息。
      item_schema:
        chain:
          type: string
          nullable: false
          allowed_values:
          - VH
          - VL
        region:
          type: string
          nullable: false
          allowed_values:
          - FR1
          - CDR1
          - FR2
          - CDR2
          - FR3
          - CDR3
          - FR4
        start_position:
          type: string
          nullable: true
        end_position:
          type: string
          nullable: true
        sequence:
          type: string
          nullable: true
    cdr_lengths:
      type: json
      nullable: true
      description: 各 CDR 区域的长度列表。
      item_schema:
        chain:
          type: string
          nullable: false
          allowed_values:
          - VH
          - VL
        region:
          type: string
          nullable: false
          allowed_values:
          - CDR1
          - CDR2
          - CDR3
        length:
          type: integer
          nullable: false
          unit: aa
          check: length >= 0
    vdj_genes:
      type: json
      nullable: true
      description: 各可变区链的 V(D)J 基因列表。
      item_schema:
        chain:
          type: string
          nullable: false
          allowed_values:
          - VH
          - VL
        v_gene:
          type: string
          nullable: true
        d_gene:
          type: string
          nullable: true
        j_gene:
          type: string
          nullable: true
    germline_origin:
      type: string
      nullable: true
      description: 胚系来源。
    somatic_mutations:
      type: json
      nullable: true
      description: 体细胞突变位点列表。
      item_schema:
        chain:
          type: string
          nullable: false
          allowed_values:
          - VH
          - VL
        position:
          type: string
          nullable: false
        germline_residue:
          type: string
          nullable: false
        observed_residue:
          type: string
          nullable: false
    target_antigen:
      type: string
      nullable: true
      description: Binder 的靶抗原，例如 GCC、CDH17。
      index: true
    glycosylation_sites:
      type: json
      nullable: true
      description: 糖基化位点列表。
      item_schema:
        chain:
          type: string
          nullable: false
          allowed_values:
          - VH
          - VL
        position:
          type: string
          nullable: false
        motif:
          type: string
          nullable: true
    free_cysteines:
      type: json
      nullable: true
      description: 游离半胱氨酸位点列表。
      item_schema:
        chain:
          type: string
          nullable: false
          allowed_values:
          - VH
          - VL
        position:
          type: string
          nullable: false
    humanization_level:
      type: string
      nullable: true
      description: 人源化程度。
    structure_template:
      type: string
      nullable: true
      description: 可用于该 Binder 的结构模板。
    complex_structure:
      type: string
      nullable: true
      description: Binder 与靶标复合物的结构信息。
    version:
      type: string
      nullable: false
      description: 该 Binder 记录的版本。
      default: '1.0'
    entry_date:
      type: date
      nullable: false
      description: 该记录的录入日期。
      default: current_date
      
binder_evidence:
  table: binder_evidence
  description: Binder 证据表。保存特定来源、特定实验条件下对 Binder 的观察或测量结果。
  fields:
    evidence_id:
      type: uuid
      key: primary
      description: 平台内部唯一 Binder 证据记录 ID。
      nullable: false
    binder_id:
      type: uuid
      key: foreign
      references: binder.binder_id
      description: 该证据对应的 Binder ID。
      nullable: false
      index: true
    source_type:
      type: string
      nullable: false
      description: 证据来源类型。
      allowed_values:
      - public_database
      - literature
      - patent
      - internal_data
      index: true
    source_id:
      type: string
      nullable: false
      description: 外部来源 ID，例如 DOI、专利号、数据库登录号或内部批次号。
      index: true
    citation:
      type: string
      nullable: true
      description: 该证据对应的引用信息。
    evidence_level:
      type: string
      nullable: false
      description: 证据等级；具体分级值由统一证据分级规范定义。
    experimental_conditions:
      type: json
      nullable: true
      description: 产生该证据时的实验条件列表。
      item_schema:
        name:
          type: string
          nullable: false
        value:
          type: string
          nullable: false
        unit:
          type: string
          nullable: true
    applicable_scenario:
      type: string
      nullable: true
      description: 该证据或结果适用的场景。
    contrary_evidence:
      type: boolean
      nullable: false
      description: 该记录是否属于与主要结论相反的证据。
      default: false
    epitope:
      type: string
      nullable: true
      description: Binder 识别的表位。
    binding_site:
      type: string
      nullable: true
      description: Binder 的结合位点信息。
    kd:
      type: number
      nullable: true
      description: 平衡解离常数 Kd。
      unit: nM
      check: kd >= 0
    kon:
      type: number
      nullable: true
      description: 结合速率常数 Kon。
      unit: 1/(M*s)
      check: kon >= 0
    koff:
      type: number
      nullable: true
      description: 解离速率常数 Koff。
      unit: 1/s
      check: koff >= 0
    measurement_method:
      type: string
      nullable: true
      description: 亲和力或动力学参数的测量方法。
      allowed_values:
      - SPR
      - BLI
    measurement_conditions:
      type: json
      nullable: true
      description: Kd、Kon、Koff 等测量值对应的条件列表。
      item_schema:
        name:
          type: string
          nullable: false
        value:
          type: string
          nullable: false
        unit:
          type: string
          nullable: true
    cross_reactivity_protein:
      type: json
      nullable: true
      description: 蛋白水平的交叉反应性结果列表。
      item_schema:
        protein:
          type: string
          nullable: false
        species:
          type: string
          nullable: true
        result:
          type: string
          nullable: false
    cross_reactivity_cell:
      type: json
      nullable: true
      description: 细胞水平的交叉反应性结果列表。
      item_schema:
        cell_type:
          type: string
          nullable: false
        species:
          type: string
          nullable: true
        result:
          type: string
          nullable: false
    species_reactivity:
      type: json
      nullable: true
      description: 对人、鼠、猴等不同物种的反应性结果列表。
      item_schema:
        species:
          type: string
          nullable: false
        result:
          type: string
          nullable: false
    tm:
      type: number
      nullable: true
      description: 热稳定性指标 Tm。
      unit: °C
    viscosity:
      type: number
      nullable: true
      description: 黏度测量结果。
      check: viscosity >= 0
    aggregation_tendency:
      type: string
      nullable: true
      description: 聚集倾向。
    solubility:
      type: string
      nullable: true
      description: 溶解度。
    hydrophobicity:
      type: number
      nullable: true
      description: 疏水性指标。
    charge:
      type: number
      nullable: true
      description: 电荷相关指标。
    immunogenicity_ada_risk:
      type: string
      nullable: true
      description: 免疫原性或抗药抗体（ADA）风险信息。
