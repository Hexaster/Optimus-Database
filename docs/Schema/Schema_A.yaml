binder:
  table: binder
  description: Binder 核心实体表。一个经实体归一化后的 Binder 对应一条记录。
  fields:
    binder_id:
      type: uuid
      key: primary
      description: 平台内部唯一 Binder ID。
      nullable: false
    name:
      type: string
      description: Binder 的名称或代号。
      nullable: true
    aliases:
      type: json
      nullable: true
      description: 該 Binder 的其他名稱
    scfv_sequence:
      type: string
      nullable: true
      description: scFv 完整氨基酸序列。
    vh_sequence:
      type: string
      nullable: true
      description: VH 氨基酸序列。
    vl_sequence:
      type: string
      nullable: true
      description: VL 氨基酸序列。
    linker:
      type: string
      nullable: true
      description: 连接 VH 与 VL 的 linker 序列。
    numbering_scheme:
      type: string
      nullable: true
      description: 抗体序列编号体系，例如 IMGT、Kabat。
    fr_cdr_regions:
      type: json
      nullable: true
      description: FR/CDR 区域及其位置或序列信息。
    cdr_lengths:
      type: json
      nullable: true
      description: 各 CDR 区域的长度。
    vdj_genes:
      type: json
      nullable: true
      description: V(D)J 基因信息。
    germline_origin:
      type: string
      nullable: true
      description: 胚系来源。
    somatic_mutations:
      type: json
      nullable: true
      description: 体细胞突变信息。
    target_antigen:
      type: string
      nullable: true
      description: Binder 的靶抗原，例如 GCC、CDH17。
      index: true
    glycosylation_sites:
      type: json
      nullable: true
      description: 糖基化位点信息。
    free_cysteines:
      type: json
      nullable: true
      description: 游离半胱氨酸信息。
    humanization_level:
      type: string
      nullable: true
      description: 人源化程度。
    structure_template:
      type: string
      nullable: true
      description: 可用于该 Binder 的结构模板。
    complex_structure:
      type: string
      nullable: true
      description: Binder 与靶标复合物的结构信息。