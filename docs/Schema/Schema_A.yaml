binder:
  table: binder
  description: Binder 核心实体表。一个经实体归一化后的 Binder 对应一条记录。
  fields:
    binder_id:
      type: uuid
      key: primary
      description: 平台内部唯一 Binder ID。
      nullable: false
    name:
      type: string
      description: Binder 的名称或代号。
      nullable: true
    aliases:
      type: json
      nullable: true
      description: 該 Binder 的其他名稱
    scfv_sequence:
      type: string
      nullable: true
      description: scFv 完整氨基酸序列。
    vh_sequence:
      type: string
      nullable: true
      description: VH 氨基酸序列。
    vl_sequence:
      type: string
      nullable: true
      description: VL 氨基酸序列。
    linker:
      type: string
      nullable: true
      description: 连接 VH 与 VL 的 linker 序列。
    numbering_scheme:
      type: string
      nullable: true
      description: 抗体序列编号体系，例如 IMGT、Kabat。
    fr_cdr_regions:
      type: json
      nullable: true
      description: FR/CDR 区域及其位置或序列信息。
    cdr_lengths:
      type: json
      nullable: true
      description: 各 CDR 区域的长度。
    vdj_genes:
      type: json
      nullable: true
      description: V(D)J 基因信息。
    germline_origin:
      type: string
      nullable: true
      description: 胚系来源。
    somatic_mutations:
      type: json
      nullable: true
      description: 体细胞突变信息。
    target_antigen:
      type: string
      nullable: true
      description: Binder 的靶抗原，例如 GCC、CDH17。
      index: true
    glycosylation_sites:
      type: json
      nullable: true
      description: 糖基化位点信息。
    free_cysteines:
      type: json
      nullable: true
      description: 游离半胱氨酸信息。
    humanization_level:
      type: string
      nullable: true
      description: 人源化程度。
    structure_template:
      type: string
      nullable: true
      description: 可用于该 Binder 的结构模板。
    complex_structure:
      type: string
      nullable: true
      description: Binder 与靶标复合物的结构信息。

binder_evidence:
  table: binder_evidence
  description: Binder 证据表。保存特定来源、特定实验条件下对 Binder 的观察或测量结果。
  fields:
    evidence_id:
      type: uuid
      key: primary
      description: 平台内部唯一 Binder 证据记录 ID。
      nullable: false
    record_id:
      type: uuid
      key: foreign
      references: record.record_id
      nullible: true
      description: 該 Binder 證據對應的記錄 ID。
      unique: true
    binder_id:
      type: uuid
      key: foreign
      references: binder.binder_id
      description: 该证据对应的 Binder ID。
      nullable: false
      index: true
    epitope:
      type: string
      nullable: true
      description: Binder 识别的表位。
    binding_site:
      type: string
      nullable: true
      description: Binder 的结合位点信息。
    kd:
      type: number
      nullable: true
      description: 平衡解离常数 Kd。
      unit: nM
      check: kd >= 0
    kon:
      type: number
      nullable: true
      description: 结合速率常数 Kon。
      unit: 1/(M*s)
      check: kon >= 0
    koff:
      type: number
      nullable: true
      description: 解离速率常数 Koff。
      unit: 1/s
      check: koff >= 0
    measurement_method:
      type: string
      nullable: true
      description: 亲和力或动力学参数的测量方法。
      allowed_values:
      - SPR
      - BLI
    measurement_conditions:
      type: json
      nullable: true
      description: Kd、Kon、Koff 等测量值对应的具体测量条件。
    cross_reactivity_protein:
      type: json
      nullable: true
      description: 蛋白水平的交叉反应性信息。
    cross_reactivity_cell:
      type: json
      nullable: true
      description: 细胞水平的交叉反应性信息。
    species_reactivity:
      type: json
      nullable: true
      description: 对人、鼠、猴等不同物种的反应性信息。
    tm:
      type: number
      nullable: true
      description: 热稳定性指标 Tm。
      unit: °C
    viscosity:
      type: number
      nullable: true
      description: 黏度测量结果。
      check: viscosity >= 0
    aggregation_tendency:
      type: string
      nullable: true
      description: 聚集倾向。
    solubility:
      type: string
      nullable: true
      description: 溶解度。
    hydrophobicity:
      type: number
      nullable: true
      description: 疏水性指标。
    charge:
      type: number
      nullable: true
      description: 电荷相关指标。
    immunogenicity_ada_risk:
      type: string
      nullable: true
      description: 免疫原性或抗药抗体（ADA）风险信息。
